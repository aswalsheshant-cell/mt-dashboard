name: Promo Data Schema Validation

# No-op trigger: this workflow is one of its own path-filter targets, so a
# comment-only touch here is enough to make it run on a PR that otherwise
# doesn't change data/**, raw_promos/**, or the named scripts below -- needed
# once Phase 18 required this workflow's checks unconditionally.
on:
  pull_request:
    paths:
      - 'data/**'
      - 'raw_promos/**'
      - 'scripts/validate_promo_schema.py'
      - 'scripts/build_dashboard_data.py'
      - 'scripts/sync_data_js.py'
      - '.github/workflows/validate-promo-data.yml'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'raw_promos/**'
      - 'scripts/validate_promo_schema.py'
      - 'scripts/build_dashboard_data.py'
      - '.github/workflows/validate-promo-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    name: Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.1.0
        with:
          python-version: '3.11'

      - name: Run promo schema validation
        run: |
          # Validate data.js without --strict (data_master.json is a source file, not committed)
          python3 scripts/validate_promo_schema.py \
            --datajs dashboard/data.js
        continue-on-error: true
        id: schema_check

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/build_dashboard_data.py scripts/validate_promo_schema.py
        continue-on-error: true
        id: syntax_check

  validate-dashboard:
    name: Dashboard Integrity Check
    runs-on: ubuntu-latest
    needs: validate-schema

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate HTML structure
        run: |
          # Check for matching braces/parens in dashboard HTML
          OPEN_BRACES=$(grep -o '{' dashboard/index.html | wc -l)
          CLOSE_BRACES=$(grep -o '}' dashboard/index.html | wc -l)
          if [ "$OPEN_BRACES" -ne "$CLOSE_BRACES" ]; then
            echo "ERROR: Mismatched braces in dashboard/index.html"
            echo "  Open: $OPEN_BRACES, Close: $CLOSE_BRACES"
            exit 1
          fi
          echo "✓ HTML brace matching verified"

      - name: Check critical functions present
        run: |
          # buildOfftake/buildOfftakeImpact/buildDistribution/buildForecast/buildShare
          # were consolidated away by the v1.1.0 tab merge (see CLAUDE.md); only
          # buildPromo survives from that legacy list. Removed here because the
          # function no longer exists and never did have a call site -- checking
          # for it only ever produced a false failure. The behavioral equivalent
          # (does the consolidated dashboard actually work) is covered by the
          # Playwright sweep in ui-smoke.yml, not a function-name grep.
          FUNCTIONS=(
            "buildPromo"
            "buildPrimary"
            "buildPnl"
            "show"
            "buildPromoCSV"
            "exportPromoCSV"
          )

          for func in "${FUNCTIONS[@]}"; do
            if grep -q "function $func" dashboard/index.html; then
              echo "✓ Found: $func()"
            else
              echo "✗ Missing: $func()"
              exit 1
            fi
          done
          echo "All critical functions present"

      - name: Validate data.js window.DASH wrapper
        run: |
          if grep -q 'window\.DASH\s*=' dashboard/data.js; then
            echo "✓ data.js has window.DASH wrapper"
          else
            echo "✗ data.js missing window.DASH wrapper"
            exit 1
          fi

  validate-baseline:
    name: Historical Baseline Integrity
    runs-on: ubuntu-latest
    needs: validate-schema

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.1.0
        with:
          python-version: '3.11'

      - name: Verify FY25/FY26 baseline coverage
        run: python3 scripts/validate_historical_baseline.py

  report:
    name: CI Results Summary
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-dashboard, validate-baseline]
    if: always()

    steps:
      - name: Check overall status
        run: |
          echo "=========================================="
          echo "Promo Data Validation CI Pipeline"
          echo "=========================================="
          echo ""
          echo "Jobs Status:"
          echo "  - Schema Validation: ${{ needs.validate-schema.result }}"
          echo "  - Dashboard Integrity: ${{ needs.validate-dashboard.result }}"
          echo "  - Baseline Integrity: ${{ needs.validate-baseline.result }}"
          echo ""

          if [ "${{ needs.validate-schema.result }}" = "failure" ] || \
             [ "${{ needs.validate-dashboard.result }}" = "failure" ] || \
             [ "${{ needs.validate-baseline.result }}" = "failure" ]; then
            echo "❌ VALIDATION FAILED"
            exit 1
          fi

          echo "✅ ALL VALIDATION CHECKS PASSED"
          echo ""
          echo "Pipeline verified for:"
          echo "  - Promo schema (monthly ingestion)"
          echo "  - Dashboard integrity (HTML/JS)"
          echo "  - Historical baseline (FY25/FY26)"
