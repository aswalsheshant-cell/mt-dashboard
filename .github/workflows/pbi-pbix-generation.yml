name: Phase 2 — Automated PBIX Generation

# Trigger: After Phase 1 monthly refresh completes (data.js built and committed)
# Manual trigger also supported for testing
on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: 'Source data directory (PowerBI/ExportData/ by default)'
        required: false
        default: 'PowerBI/ExportData/'
  push:
    branches:
      - main
    paths:
      - 'dashboard/data.js'

jobs:
  extract-data-contracts:
    name: Extract Data Contracts (CSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffbf834c0dab474d5c4aaae9a77c503bda4c0f  # v4.1.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0110993efc25b59c4ee7  # v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Extract data contracts from data.js
        run: |
          python scripts/extract_data_contracts.py \
            --src dashboard/data.js \
            --out PowerBI/ExportData/
        continue-on-error: false

      - name: Validate CSV output
        run: |
          # Check that all expected CSVs exist
          for csv in offtake.csv primary.csv detail_articles.csv universe.csv tot_mapping.csv forecast_targets.csv; do
            if [ ! -f "PowerBI/ExportData/$csv" ]; then
              echo "ERROR: Missing CSV: $csv"
              exit 1
            fi
            rows=$(wc -l < "PowerBI/ExportData/$csv")
            echo "✓ $csv: $rows rows"
          done

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@5d5d22a31266ced592b4d2e6a78a02a72126d14b  # v4.3.1
        with:
          name: data-contracts-csv
          path: PowerBI/ExportData/
          retention-days: 30

  generate-pbix:
    name: Generate Versioned PBIX
    needs: extract-data-contracts
    runs-on: windows-latest  # Requires Windows for Power BI Desktop COM API
    steps:
      - uses: actions/checkout@b4ffbf834c0dab474d5c4aaae9a77c503bda4c0f  # v4.1.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0110993efc25b59c4ee7  # v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install pywin32  # For COM API to Power BI Desktop

      - name: Download CSV artifacts
        uses: actions/download-artifact@65a9edc5881444af5b321c5c1f7ba3d26d72a9e8  # v4.1.7
        with:
          name: data-contracts-csv
          path: PowerBI/ExportData/

      - name: Check Power BI Desktop availability
        run: |
          # Check if Power BI Desktop is installed
          # This is a check-only step; skip PBIX generation if not available
          $pbiPath = "C:\Program Files\Microsoft Power BI Desktop\bin\PBIDesktop.exe"
          if (Test-Path $pbiPath) {
            Write-Host "✓ Power BI Desktop found at: $pbiPath"
          } else {
            Write-Host "⚠ Power BI Desktop not installed (Phase 1 workflow only)"
            exit 0  # Don't fail the workflow — proceed without PBIX generation
          }
        shell: pwsh
        continue-on-error: true

      - name: Generate PBIX (dry-run)
        run: |
          # For now: dry-run mode to validate CSV data without requiring Power BI Desktop
          # Full PBIX generation requires Windows + Power BI Desktop + COM API
          python scripts/generate_pbix.py \
            --data PowerBI/ExportData/ \
            --template PowerBI/mt-dashboard-template.pbix \
            --out PowerBI/ \
            --dry-run
        continue-on-error: true  # Don't fail if template not found yet

      - name: "[Phase 2.5] Generate & Validate PBIX"
        if: false  # Disabled until Windows runner + Power BI Desktop are available (Sep 5-8)
        run: |
          # Full PBIX generation workflow:
          # 1. Load PBIX template
          # 2. Modify Power Query connections to CSV data
          # 3. Inject/update DAX measures
          # 4. Run data refresh via COM API
          # 5. Validate all measures
          # 6. Save versioned PBIX with metadata
          python scripts/generate_pbix.py \
            --data PowerBI/ExportData/ \
            --template PowerBI/mt-dashboard-template.pbix \
            --out PowerBI/

      - name: Upload PBIX artifacts
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced592b4d2e6a78a02a72126d14b  # v4.3.1
        with:
          name: generated-pbix
          path: PowerBI/mt-dashboard-*.pbix
          retention-days: 90

  validate-pbix-measures:
    name: Validate DAX Measures
    needs: generate-pbix
    runs-on: windows-latest
    if: false  # Disabled until Phase 2.5 (requires live Power BI Desktop + Analysis Services)
    steps:
      - uses: actions/checkout@b4ffbf834c0dab474d5c4aaae9a77c503bda4c0f  # v4.1.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0110993efc25b59c4ee7  # v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywin32

      - name: Download PBIX artifacts
        uses: actions/download-artifact@65a9edc5881444af5b321c5c1f7ba3d26d72a9e8  # v4.1.7
        with:
          name: generated-pbix

      - name: Validate DAX measures
        run: |
          # Find latest PBIX file
          $pbix = Get-ChildItem -Path . -Filter "mt-dashboard-*.pbix" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($pbix) {
            python scripts/validate_pbix_measures.py --pbix $pbix.FullName
          } else {
            Write-Host "No PBIX file found"
            exit 1
          }
        shell: pwsh

  qc-gate:
    name: QC Validation Gate
    needs: extract-data-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffbf834c0dab474d5c4aaae9a77c503bda4c0f  # v4.1.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0110993efc25b59c4ee7  # v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download CSV artifacts
        uses: actions/download-artifact@65a9edc5881444af5b321c5c1f7ba3d26d72a9e8  # v4.1.7
        with:
          name: data-contracts-csv
          path: PowerBI/ExportData/

      - name: Validate data contracts
        run: |
          # Run QC checks on extracted CSVs
          python scripts/qc_dashboard.py \
            --data dashboard/data.js \
            --no-browser \
            || true  # QC warnings don't fail the job
        continue-on-error: false

  notify:
    name: Notify Completion
    needs: [extract-data-contracts, qc-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Job summary
        run: |
          echo "## Phase 2 Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Data contracts extracted" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ QC validation gate passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Sep 5-8: Set up Windows self-hosted runner with Power BI Desktop" >> $GITHUB_STEP_SUMMARY
          echo "- Sep 10-12: Enable PBIX generation (Phase 2.5)" >> $GITHUB_STEP_SUMMARY
          echo "- Sep 13-14: Test end-to-end PBIX workflow" >> $GITHUB_STEP_SUMMARY
          echo "- Sep 15: Production automation go-live" >> $GITHUB_STEP_SUMMARY

# Notes for Phase 2.5 (Sep 5-12):
#
# When Windows self-hosted runner + Power BI Desktop are available:
# 1. Register self-hosted runner at repo settings
# 2. Enable the `if: false` condition on `generate-pbix` and `validate-pbix-measures` jobs
# 3. Update `runs-on: windows-latest` to `runs-on: [windows, self-hosted]`
# 4. Ensure Power BI Desktop COM API is available (pywin32 + win32com)
# 5. Create PBIX template at `PowerBI/mt-dashboard-template.pbix`
# 6. Test dry-run first with `--dry-run` flag
#
# Environment variables for self-hosted runner:
#   PBI_DESKTOP_PATH: C:\Program Files\Microsoft Power BI Desktop\bin\PBIDesktop.exe
#   PYTHON_VERSION: 3.11
