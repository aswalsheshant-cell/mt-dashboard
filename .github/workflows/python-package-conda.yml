name: Python CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: CompileAll
        run: python -m compileall scripts

      - name: Ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Collect tests
        run: pytest --collect-only scripts

      - name: Test release gate
        run: pytest scripts/test_release_gate.py -v

      - name: Test dashboard disclosures
        run: pytest scripts/test_dashboard_disclosures.py -v

      - name: Run full script test suite
        run: pytest scripts/test_*.py -v
