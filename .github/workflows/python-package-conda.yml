name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies from requirements.txt
      run: pip install -r requirements.txt

    - name: Validate environment.yml is parseable
      run: |
        python - <<'EOF'
        import yaml, pathlib, sys
        doc = yaml.safe_load(pathlib.Path("environment.yml").read_text())
        assert "dependencies" in doc, "environment.yml missing 'dependencies'"
        print(f"✓ environment.yml valid — name={doc.get('name')}")
        EOF

    - name: Syntax check — all scripts
      run: python -m compileall scripts/ -q

    - name: Lint with ruff
      run: ruff check scripts/build_dashboard_data.py --select=E9,F63,F7,F82

    - name: Run unit tests
      run: pytest scripts/test_pipeline.py scripts/test_chain_consolidation.py -v
