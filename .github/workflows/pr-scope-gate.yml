name: PR Scope Gate

# Feature freeze: every PR must declare "Freeze classification: BLOCKER_FIX |
# CORRECTNESS_FIX | HOUSEKEEPING | DEFERRED" in its body, and the declaration
# must match the diff (scripts/check_pr_scope.py). Added after PR #272 was
# fully green in CI while outside the freeze scope.
#
# SECURITY / TRUST BOUNDARY: pull_request_target runs THIS workflow, the
# checker and config/project_state.yml from the BASE branch, so a PR cannot
# switch the freeze off, edit the checker or skip this job to pass itself.
# The PR's changed-file NAMES come from the GitHub API (GET pulls/N/files), not
# from `git fetch`: checkout runs with persist-credentials: false, so a git fetch
# of the PR ref fails on a private repo ("could not read Username"). PR code is
# never fetched, checked out or executed; the only credential is the auto-issued,
# read-only GITHUB_TOKEN, used for that one API call. Permissions are read-only.

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-scope:
    name: PR scope vs feature freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0  (base branch)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Check the declared scope against the diff
        env:
          # PR text goes through env vars, never inline in the script
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # list the PR's file names only (new and, for renames, old); nothing from the PR is fetched or run
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          # an empty list means the API call went wrong, never "nothing changed"
          test -s "$RUNNER_TEMP/changed.txt" || { echo "::error::no changed files returned for PR ${PR_NUMBER}"; exit 1; }
          python scripts/check_pr_scope.py --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr_body.txt" \
            --changed-files-file "$RUNNER_TEMP/changed.txt" \
            --state-file config/project_state.yml
