name: PR Scope Gate

# Feature freeze: every PR must declare "Freeze classification: BLOCKER_FIX |
# CORRECTNESS_FIX | HOUSEKEEPING | DEFERRED" in its body, and the declaration
# must match the diff (scripts/check_pr_scope.py). Added after PR #272 was
# fully green in CI while outside the freeze scope. Not a required check until
# the repo owner adds it to branch protection.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-scope:
    name: PR scope vs feature freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Check the declared scope against the diff
        env:
          # PR text goes through env vars, never inline in the script
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          python scripts/check_pr_scope.py --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr_body.txt" \
            --changed-files-file "$RUNNER_TEMP/changed.txt"
