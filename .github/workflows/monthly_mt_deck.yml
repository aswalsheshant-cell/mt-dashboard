name: Modern Trade (MT) Monthly Leadership Deck Pipeline

# Manual only. The monthly schedule was removed on purpose: a scheduled run has no
# one to supply a data source, so it built a deck from data/sample_seeds and the
# typed-in defaults in scripts/build_mt_monthly_ppt.py (docs/GOVERNANCE.md calls
# them "hardcoded mock data"). The deck is not fed from dashboard/data.js, so every
# deck built here is stamped SAMPLE or DRAFT, in the slides, JSON and file name.
# Re-add a schedule only after the builder reads verified data.
#
# Live Google Slides publishing was removed from this workflow: the deploy script
# only supports interactive OAuth (no --credentials, no --share), so it could never
# run on a CI runner. Run scripts/deploy_to_google_slides.py locally.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Target Review Month (e.g., september, october)'
        required: false
        default: 'auto'
      year:
        description: 'Target Review Year'
        required: false
        default: '2026'
      data_source:
        description: 'Path to a CSV directory or .json file in the repo. Blank = sample seeds (deck stamped SAMPLE).'
        required: false
        default: ''
      format:
        description: 'Artifact Export Mode'
        required: true
        type: choice
        options:
          - both
          - pptx
          - json
        default: 'both'

concurrency:
  group: mt-deck-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-generate:
    name: Build MT Deck (SAMPLE/DRAFT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx

      - name: Run Analytical & Exporter Unit Tests
        id: unit_tests
        run: |
          echo "Running Analytics Engine Test Suite..."
          python scripts/test_analytics_engine.py

          echo "Running Google Slides Export & Float Validation Suite..."
          python scripts/test_gslides_export.py

          echo "Running Priority 3 Dashboard UI Validation Suite..."
          python scripts/test_priority_3_dashboard_validation.py

      - name: Resolve Data Source and Data Status
        id: source
        env:
          DATA_SOURCE_INPUT: ${{ github.event.inputs.data_source }}
        run: |
          if [ -z "$DATA_SOURCE_INPUT" ]; then
            DATA_SOURCE="./data/sample_seeds"
          else
            DATA_SOURCE="$DATA_SOURCE_INPUT"
          fi

          # A path that does not exist must fail. It used to be skipped silently,
          # and the build then fell back to the typed-in defaults.
          case "$DATA_SOURCE" in
            *://*) echo "::error ::SQL connection strings are not accepted in CI."; exit 1 ;;
          esac
          if [ ! -d "$DATA_SOURCE" ] && [ ! -f "$DATA_SOURCE" ]; then
            echo "::error ::Data source not found: $DATA_SOURCE"
            exit 1
          fi

          if [ -d "$DATA_SOURCE" ]; then
            echo "Pre-flight validation on: $DATA_SOURCE"
            python scripts/validate_seeds.py --data-dir "$DATA_SOURCE"
          fi

          STATUS=$(python scripts/build_mt_monthly_ppt.py --print-data-status --data-source "$DATA_SOURCE")
          echo "Data status: $STATUS"
          echo "data_source=$DATA_SOURCE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::warning ::Deck will be stamped $STATUS. It is not fed from dashboard/data.js."

      - name: Resolve Target Month and Year
        id: resolve_date
        env:
          MONTH_INPUT: ${{ github.event.inputs.month }}
          YEAR_INPUT: ${{ github.event.inputs.year }}
        run: |
          if [ "$MONTH_INPUT" = "auto" ] || [ -z "$MONTH_INPUT" ]; then
            # Previous month (e.g., run in October reports September)
            TARGET_MONTH=$(date -d "last month" +%B | tr '[:upper:]' '[:lower:]')
            TARGET_YEAR=$(date -d "last month" +%Y)
          else
            TARGET_MONTH="$MONTH_INPUT"
            TARGET_YEAR="$YEAR_INPUT"
          fi

          echo "month=$TARGET_MONTH" >> "$GITHUB_OUTPUT"
          echo "year=$TARGET_YEAR" >> "$GITHUB_OUTPUT"
          echo "Deck Target: $TARGET_MONTH $TARGET_YEAR"

      - name: Generate MT Deck Artifacts
        id: build_deck
        env:
          TARGET_MONTH: ${{ steps.resolve_date.outputs.month }}
          TARGET_YEAR: ${{ steps.resolve_date.outputs.year }}
          EXPORT_FORMAT: ${{ github.event.inputs.format }}
          DATA_SOURCE: ${{ steps.source.outputs.data_source }}
          DATA_STATUS: ${{ steps.source.outputs.status }}
        run: |
          mkdir -p output
          OUTPUT_PREFIX="./output/${DATA_STATUS}_MT_${TARGET_MONTH^}_${TARGET_YEAR}_Leadership"

          python scripts/build_mt_monthly_ppt.py \
            --month "$TARGET_MONTH" --year "$TARGET_YEAR" \
            --format "${EXPORT_FORMAT:-both}" \
            --output "$OUTPUT_PREFIX" \
            --data-source "$DATA_SOURCE"

          echo "output_prefix=$OUTPUT_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Upload Deck Artifacts to GitHub
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ${{ steps.source.outputs.status }}-MT-Leadership-Deck-${{ steps.resolve_date.outputs.month }}-${{ steps.resolve_date.outputs.year }}
          path: ./output/
          retention-days: 30

      - name: Publish Step Summary
        if: always()
        env:
          DATA_STATUS: ${{ steps.source.outputs.status }}
          DATA_SOURCE: ${{ steps.source.outputs.data_source }}
        run: |
          {
            echo "### Modern Trade Monthly Deck Run Summary"
            echo "- **Data status:** ${DATA_STATUS:-not resolved} (not fed from dashboard/data.js)"
            echo "- **Target period:** ${{ steps.resolve_date.outputs.month }} ${{ steps.resolve_date.outputs.year }}"
            echo "- **Data source:** ${DATA_SOURCE:-not resolved}"
            echo "- **Unit tests:** ${{ steps.unit_tests.outcome }}"
            echo "- **Source check and pre-flight:** ${{ steps.source.outcome }}"
            echo "- **Deck build:** ${{ steps.build_deck.outcome }}"
            echo "- **Artifact upload:** ${{ steps.upload.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
