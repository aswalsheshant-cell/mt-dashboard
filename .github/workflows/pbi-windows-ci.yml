name: Power BI Windows CI Validation

on:
  push:
    branches:
      - main
    paths:
      - 'PowerBI/**'
      - 'scripts/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'PowerBI/**'
      - 'scripts/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-powerbi:
    name: Run Headless Tabular Editor & DAX Validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup Python environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pytest
          python -c "import pandas; import pytest; print(f'pandas={pandas.__version__}, pytest={pytest.__version__}')"

      - name: Install Tabular Editor 2 CLI (required)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The model-compile step needs Tabular Editor. A missing install fails the job instead of
          # letting it go green without compiling anything.
          $te = Get-Command "TabularEditor.exe" -ErrorAction SilentlyContinue
          if (-not $te -and -not (Test-Path "C:\Program Files (x86)\Tabular Editor\TabularEditor.exe")) {
            $headers = @{ "User-Agent" = "mt-dashboard-ci"; "Authorization" = "Bearer $env:GH_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/TabularEditor/TabularEditor/releases/latest" -Headers $headers
            $asset = $rel.assets | Where-Object { $_.name -match "Portable" -and $_.name -match "\.zip$" } | Select-Object -First 1
            if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1 }
            if (-not $asset) {
              Write-Host "::error::No .zip asset on Tabular Editor release $($rel.tag_name). Assets: $($rel.assets.name -join ', ')"
              exit 1
            }
            Write-Host "Downloading Tabular Editor $($rel.tag_name): $($asset.name)"
            $zip = Join-Path $env:RUNNER_TEMP "TabularEditor.zip"
            $dir = Join-Path $env:RUNNER_TEMP "TabularEditor"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe = Get-ChildItem -Path $dir -Filter "TabularEditor.exe" -Recurse | Select-Object -First 1
            if (-not $exe) { Write-Host "::error::TabularEditor.exe not found in $($asset.name)"; exit 1 }
            "TE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Tabular Editor ready at $($exe.FullName)"
          } else {
            Write-Host "Tabular Editor CLI already present."
          }

      - name: Run Core Data Validation Harness
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # A pwsh step fails only on its LAST native exit code, so the exit code
          # is checked right after the script runs. validate_data_integrity.py
          # checks dashboard/data.js and is required: a missing file fails the
          # step instead of being skipped. (eval_harness.py -- the retired
          # data_master.json verifier -- was removed 2026-09-26; its live checks
          # are covered by scripts/ci_validate_datajs.py and the pytest suite.)
          if (-not (Test-Path "tests/validate_data_integrity.py")) {
            Write-Host "::error::tests/validate_data_integrity.py not found (required validator)"
            exit 1
          }
          Write-Host "Running validate_data_integrity.py..." -ForegroundColor Green
          python tests/validate_data_integrity.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::validate_data_integrity.py failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: Run Article Uniqueness & Assortment Governance Pytest Suite
        shell: pwsh
        run: |
          Write-Host "Running article-level governance tests..." -ForegroundColor Cyan
          if (Test-Path "tests/test_article_uniqueness.py") {
            Write-Host "✓ Test file found at tests/test_article_uniqueness.py" -ForegroundColor Green
            if ((Test-Path "PowerBI/RawDataFolders/Primary_Derived_FY25/Primary_Article_Synthesized_FY25.csv") -or (Test-Path "data_mappings/Chain_Article_EAN_Mapping_CORRECTED_v2.csv")) {
              python -m pytest tests/test_article_uniqueness.py -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              Write-Host "⚠ Data files not found in CI environment (expected on fresh runners). Tests will skip gracefully." -ForegroundColor Yellow
              python -m pytest tests/test_article_uniqueness.py -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Host "Skipped: test_article_uniqueness.py not found" -ForegroundColor Yellow
          }

      - name: Execute Power BI Watch Folder & DAX Validation
        shell: pwsh
        run: |
          if (Test-Path ".\scripts\ci\test_powerbi_model.ps1") {
            Write-Host "Running Power BI model validation..." -ForegroundColor Green
            .\scripts\ci\test_powerbi_model.ps1 -RepoRoot $env:GITHUB_WORKSPACE -RequireModelCompile
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Power BI model validation failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }
          } else {
            Write-Host "⚠ test_powerbi_model.ps1 not found (optional for this environment)" -ForegroundColor Yellow
            Write-Host "Power BI model validation skipped" -ForegroundColor Cyan
          }

      - name: Upload Test Report Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: pbi-validation-failure-logs
          path: |
            PowerBI/RawDataFolders/
            PowerBI/CI/
            logs/
