name: Power BI Windows CI Validation

on:
  push:
    branches:
      - main
    paths:
      - 'PowerBI/**'
      - 'scripts/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'PowerBI/**'
      - 'scripts/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  validate-powerbi:
    name: Run Headless Tabular Editor & DAX Validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pytest

      - name: Ensure Tabular Editor CLI Available
        shell: pwsh
        run: |
          if (-not (Get-Command "TabularEditor.exe" -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Tabular Editor\TabularEditor.exe")) {
            Write-Host "Tabular Editor not found. Install via: choco install tabulareditor --yes" -ForegroundColor Yellow
            Write-Host "For now, proceeding with core validation checks..." -ForegroundColor Yellow
          } else {
            Write-Host "✓ Tabular Editor CLI is ready." -ForegroundColor Green
          }

      - name: Run Core Data Validation Harness
        shell: pwsh
        run: |
          Write-Host "Checking for Python validation scripts..." -ForegroundColor Cyan
          if (Test-Path "scripts/eval_harness.py") {
            python scripts/eval_harness.py
          }
          if (Test-Path "tests/validate_data_integrity.py") {
            python tests/validate_data_integrity.py
          }

      - name: Execute Power BI Watch Folder & DAX Validation
        shell: pwsh
        run: |
          .\scripts\ci\test_powerbi_model.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Upload Test Report Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pbi-validation-failure-logs
          path: |
            PowerBI/RawDataFolders/
            PowerBI/CI/
            logs/
