name: Monthly Central Zone PPT Generation

on:
  schedule:
    # Run on the 1st of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-central-zone-ppt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Generate Central Zone PowerPoint
        run: node scripts/build_central_zone_presentation.js

      - name: Upload PPT Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('Central_Zone_Leadership_Pack_*.pptx') != ''
        with:
          name: central-zone-leadership-pack
          path: Central_Zone_Leadership_Pack_*.pptx
          retention-days: 365

      - name: Prepare release metadata
        id: release
        if: hashFiles('Central_Zone_Leadership_Pack_*.pptx') != ''
        shell: bash
        run: |
          echo "tag=central-zone-ppt-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "generated=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Create Release with PPT
        if: hashFiles('Central_Zone_Leadership_Pack_*.pptx') != ''
        uses: softprops/action-gh-release@v1
        with:
          files: Central_Zone_Leadership_Pack_*.pptx
          tag_name: ${{ steps.release.outputs.tag }}
          body: |
            Central Zone Leadership Pack — Monthly Deliverable
            
            - Generated: ${{ steps.release.outputs.generated }}
            - Slides: 18
            - Coverage: Madhya Pradesh & Chhattisgarh
            - Source: dashboard/data.js (latest)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
