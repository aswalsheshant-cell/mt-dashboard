name: Data Engineering

on:
  push:
    paths:
      - "scripts/**"
      - "PowerBI/SeedData/**"
      - "dashboard/data.js"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "PowerBI/SeedData/**"
      - "dashboard/data.js"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl pyxlsb pytest

      - name: Syntax check — build and ingestion scripts
        run: |
          python -m py_compile scripts/build_dashboard_data.py
          python -m py_compile scripts/load_forecast_detail.py
          python -m py_compile scripts/validate_forecast_excel.py
          python -m py_compile scripts/load_promo_detail.py

      - name: Set up Node.js (for PowerPoint generation)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node dependencies
        run: npm install

      - name: Validate Central zone PowerPoint generator
        run: |
          node -c scripts/build_central_zone_presentation.js
          echo "✓ Central zone generator syntax valid"

      - name: Generate Central zone PowerPoint (monthly deliverable)
        run: node scripts/build_central_zone_presentation.js
        continue-on-error: true

      - name: Upload Central zone PowerPoint artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('Central_Zone_Leadership_Pack_*.pptx') != ''
        with:
          name: central-zone-pack
          path: Central_Zone_Leadership_Pack_*.pptx
          retention-days: 90

      - name: Run pytest (pipeline + chain consolidation + June fallback + disclosures + forecast schema)
        run: pytest scripts/test_pipeline.py scripts/test_chain_consolidation.py scripts/test_june_fallback.py scripts/test_dashboard_disclosures.py scripts/test_forecast_schema.py -v

      - name: Test MT channel reconciliation
        id: channel-recon
        run: |
          python scripts/mt_channel_reconciliation.py dashboard/data.js | tee channel_recon.txt
          if grep -q "BLOCKED" channel_recon.txt; then
            echo "::error::Channel reconciliation BLOCKED — merge blocked until resolved."
            exit 1
          fi
        continue-on-error: true

      - name: Run QC gate
        id: qc
        run: |
          python scripts/qc_dashboard.py --data dashboard/data.js | tee qc_report.txt
          if grep -q "✗ FAIL" qc_report.txt; then
            echo "::error::QC gate has FAIL items — merge blocked until resolved."
            exit 1
          fi
          if grep -q "⊘ BLOCKED" qc_report.txt; then
            echo "::warning::QC gate has BLOCKED items (data dependencies). Explicit approval required before merge."
          fi

      - name: Upload QC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-report
          path: qc_report.txt
          retention-days: 30
