name: Data Engineering

on:
  push:
    paths:
      - "scripts/**"
      - "PowerBI/SeedData/**"
      - "dashboard/data.js"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "PowerBI/SeedData/**"
      - "dashboard/data.js"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl pyxlsb pytest

      - name: Syntax check — build and ingestion scripts
        run: |
          python -m py_compile scripts/build_dashboard_data.py
          python -m py_compile scripts/load_forecast_detail.py
          python -m py_compile scripts/validate_forecast_excel.py

      - name: Run pytest (pipeline + chain consolidation + June fallback + disclosures + forecast schema)
        run: pytest scripts/test_pipeline.py scripts/test_chain_consolidation.py scripts/test_june_fallback.py scripts/test_dashboard_disclosures.py scripts/test_forecast_schema.py -v

      - name: Run QC gate
        id: qc
        run: |
          python scripts/qc_dashboard.py --data dashboard/data.js | tee qc_report.txt
          if grep -q "✗ FAIL" qc_report.txt; then
            echo "::error::QC gate has FAIL items — merge blocked until resolved."
            exit 1
          fi
          if grep -q "⊘ BLOCKED" qc_report.txt; then
            echo "::warning::QC gate has BLOCKED items (data dependencies). Explicit approval required before merge."
          fi

      - name: Upload QC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-report
          path: qc_report.txt
          retention-days: 30
