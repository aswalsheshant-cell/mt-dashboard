name: Data Integrity Validation

# Manual-only. This validates the data_master.json -> sync_data_js.py -> data.js
# pipeline, which is NOT the production path: build_dashboard_data.py is the
# ONLY generator of dashboard/data.js (see CLAUDE.md), deploy-pages.yml stages
# dashboard/* directly, and neither references data_master.json or
# sync_data_js.py. data_master.json was last updated 2026-08-26, predating the
# current single-generator architecture. Its automatic trigger fired on every
# real production data.js update and always failed, because sync_data_js.py
# regenerates a different, stale-derived data.js and that copy (not the real
# committed one) got checked against the baseline invariants. Left runnable via
# workflow_dispatch rather than deleted outright -- see docs/PROJECT_STATE.md
# for the recommended full retirement.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Master Data & Sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Validate data_master.json structure
        run: python scripts/ci_validate_master.py

      - name: Regenerate data.js
        run: |
          python scripts/sync_data_js.py
          test -f dashboard/data.js && echo "✅ data.js generated" || (echo "❌ data.js missing"; exit 1)

      - name: Validate data.js integrity
        run: python scripts/ci_validate_datajs.py

      - name: Validate data integrity assertions
        run: python tests/validate_data_integrity.py

  report:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    name: Report Results
    steps:
      - name: Status report
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ All validation checks passed"
          else
            echo "❌ Validation failed"
            exit 1
          fi
