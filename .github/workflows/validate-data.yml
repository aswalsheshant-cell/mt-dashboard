name: Data Integrity Validation

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - 'data_master.json'
      - 'dashboard/data.js'
      - 'scripts/sync_data_js.py'
  pull_request:
    branches: [main]
    paths:
      - 'data_master.json'
      - 'dashboard/data.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Master Data & Sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Validate data_master.json structure
        run: python scripts/ci_validate_master.py

      - name: Regenerate data.js
        run: |
          python scripts/sync_data_js.py
          test -f dashboard/data.js && echo "✅ data.js generated" || (echo "❌ data.js missing"; exit 1)

      - name: Validate data.js integrity
        run: python scripts/ci_validate_datajs.py

      - name: Validate data integrity assertions
        run: python tests/validate_data_integrity.py

  report:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    name: Report Results
    steps:
      - name: Status report
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ All validation checks passed"
          else
            echo "❌ Validation failed"
            exit 1
          fi
