name: Data Integrity Validation

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - 'data_master.json'
      - 'dashboard/data.js'
      - 'scripts/sync_data_js.py'
  pull_request:
    branches: [main]
    paths:
      - 'data_master.json'
      - 'dashboard/data.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Master Data & Sync
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Verify Python
        run: python3 --version

      - name: Install dependencies
        run: python3 -m pip install pandas openpyxl

      - name: Validate data_master.json structure
        run: python3 scripts/ci_validate_master.py

      - name: Regenerate data.js
        run: |
          python3 scripts/sync_data_js.py
          test -f dashboard/data.js && echo "✅ data.js generated" || (echo "❌ data.js missing"; exit 1)

      - name: Validate data.js integrity
        run: python3 scripts/ci_validate_datajs.py

      - name: Validate data integrity assertions
        run: python3 tests/validate_data_integrity.py

  report:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    name: Report Results
    steps:
      - name: Status report
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ All validation checks passed"
          else
            echo "❌ Validation failed"
            exit 1
          fi
