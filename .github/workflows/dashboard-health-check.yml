name: Dashboard Health Check
on:
  push:
    branches: [ main, claude/* ]
    paths:
      - 'dashboard/data.js'
      - 'dashboard/index.html'
      - 'scripts/build_dashboard_data.py'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  data-validation:
    runs-on: ubuntu-latest
    name: Validate Dashboard Data & Schema
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '20'

      - name: Run data health verification
        run: node scripts/verify_data_health.js
        continue-on-error: false

      - name: Validate JSON integrity
        run: |
          python3 << 'PYEOF'
          import json
          import re
          from pathlib import Path

          data_js = Path('dashboard/data.js').read_text()
          match = re.search(r'window\.DASH\s*=\s*(\{.*\});', data_js, re.DOTALL)
          if not match:
              print("❌ Cannot extract DASH object")
              exit(1)

          try:
              data = json.loads(match.group(1))
              print(f"✅ data.js is valid JSON ({len(data)} blocks)")
          except json.JSONDecodeError as e:
              print(f"❌ JSON parse error: {e}")
              exit(1)
          PYEOF

      - name: Check for regressions in primary data
        run: |
          python3 << 'PYEOF'
          import json
          import re
          from pathlib import Path

          data_js = Path('dashboard/data.js').read_text()
          match = re.search(r'window\.DASH\s*=\s*(\{.*\});', data_js, re.DOTALL)
          data = json.loads(match.group(1))

          # Baseline expectations
          checks = {
              "Primary chains > 0": len(data.get('primary', {}).get('by_chain', [])) > 0,
              "Offtake zones > 0": len(data.get('offtake', {}).get('by_zone', [])) > 0,
              # build_dashboard_data.py has always emitted offtake.total as a plain
              # number (the all-FY grand total NSV); per-FY totals live under
              # total_fy25/total_fy26/... separately. There has never been a nested
              # total object -- check the real contract, not an assumption that
              # never matched the generator (see scripts/verify_data_health.js).
              "Offtake total exists": isinstance(data.get('offtake', {}).get('total'), (int, float))
                                       and data['offtake']['total'] > 0,
              "Detail records > 0": len(data.get('detail_records', [])) > 0,
          }

          failed = [k for k, v in checks.items() if not v]
          for check, result in checks.items():
              status = "✅" if result else "❌"
              print(f"{status} {check}")

          if failed:
              print(f"\n❌ {len(failed)} regression(s) detected")
              exit(1)
          else:
              print(f"\n✅ All baseline checks passed")
          PYEOF

  html-validation:
    runs-on: ubuntu-latest
    name: Validate HTML Structure & Fixes
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Check for required fixes in HTML
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          html = Path('dashboard/index.html').read_text()

          fixes = {
              # Owner decision 2026-09-26: Unmapped Chain is shown, not filtered out
              # (the rows must add up to Primary). Marker comment in buildChannelDynamics.
              "Fix 1: Unmapped Chain visible": "Unmapped Chain stays visible",
              "Fix 2: FY Fallback Logic": "fallbackFy",
              "Fix 3: Real Store Counts (universe.by_chain)": "_uniStores[name]",
              "Fix 4: Canvas Creation": "createElement('canvas')",
              "Fix 5: Alert Controller": "AlertController.buildAlerts",
              # A failed alerts_feed.json load must not read as "all metrics healthy".
              "Fix 6: Alert feed load state": "window.alertsFeedStatus='error'",
              # CM2 is "not available" (–) where no expense rows exist, never NSV as "100%".
              "Fix 7: CM2 availability gate": "const cm2Avail=",
              # SKU quadrants are "Not available" without real Units / margin / store count.
              "Fix 8: SKU quadrant availability gate": "SKUs are not placed in a quadrant without them",
              # Wide tables scroll inside their card instead of widening the page.
              "Fix 9: grid columns can shrink": ".g2{grid-template-columns:repeat(2,minmax(0,1fr))}",
              # Header alert badge starts hidden; alert_controller.js sets it from the feed.
              "Fix 10: alert badge not hard-coded": 'class="alert-badge" style="display: none;',
              # Prior-FY comparison series is labelled with its own months (FY26 Apr-25..., not Apr-26).
              "Fix 11: prior-FY comparison label shifted": "const _pLblPrev="
          }

          # Patterns that must NOT come back.
          forbidden = {
              "Unmapped Chain hidden from the chain view": "filter(c=>c.name!=='Unmapped Chain')",
              "Alert feed load failure swallowed": ".then(d=>window.alertsFeed=d).catch(()=>{})",
              "CM2 shown as NSV when no expenses": "CM2 currently equals NSV (0 expenses matched)",
              "SKU quadrant default margin": "Gross_Margin_Pct??45",
              "SKU quadrant default store count": "stores_count||100",
              "Same month label on both comparison years": "yrPair=[`${_prevFY} ${_pLbl}`",
          }

          missing = []
          for fix_name, pattern in forbidden.items():
              if pattern in html:
                  print(f"❌ {fix_name}")
                  missing.append(fix_name)
          for fix_name, pattern in fixes.items():
              if pattern in html:
                  print(f"✅ {fix_name}")
              else:
                  print(f"❌ {fix_name}")
                  missing.append(fix_name)

          # alert_controller.js: the badge is outside <nav>; a nav-scoped selector never matches it.
          ctl = Path('dashboard/alert_controller.js').read_text()
          if "querySelector('nav .alert-badge')" in ctl:
              print("❌ Alert badge selector scoped to <nav> (badge never updates)")
              missing.append("Alert badge selector scoped to <nav>")

          if missing:
              print(f"\n❌ {len(missing)} fix(es) missing")
              exit(1)
          else:
              print(f"\n✅ All {len(fixes)} fixes verified")
          PYEOF

  notify-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [ data-validation, html-validation ]
    steps:
      - name: Log failure for agent inspection
        run: |
          echo "❌ Dashboard health check FAILED"
          echo "Issues detected - requires investigation"
          exit 1

  notify-on-success:
    runs-on: ubuntu-latest
    if: success()
    needs: [ data-validation, html-validation ]
    steps:
      - name: Log success
        run: |
          echo "✅ Dashboard health check PASSED"
          echo "All validations successful - deployment ready"
