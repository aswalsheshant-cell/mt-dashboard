name: Dashboard Unit Source Audit

on:
  push:
    branches:
      - codex/dashboard-unit-audit-*
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify the read-only auditor
        run: |
          python -m pip install pytest
          python -m pytest tests/test_dashboard_unit_audit.py tests/test_reconcile_offtake_html.py -q
      - name: Audit committed source files
        shell: bash
        run: |
          python scripts/audit_dashboard_units.py --repo-root . --out "$RUNNER_TEMP/dashboard-unit-audit.json"
          cat "$RUNNER_TEMP/dashboard-unit-audit.json"
      - name: Compare governed source Offtake with HTML months
        shell: bash
        run: |
          python scripts/reconcile_offtake_html.py \
            --audit-json "$RUNNER_TEMP/dashboard-unit-audit.json" \
            --html-data-js dashboard/data.js \
            --out "$RUNNER_TEMP/dashboard-offtake-reconciliation.json"
      - name: Preserve aggregate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dashboard-unit-source-audit
          path: |
            ${{ runner.temp }}/dashboard-unit-audit.json
            ${{ runner.temp }}/dashboard-offtake-reconciliation.json
          retention-days: 7

