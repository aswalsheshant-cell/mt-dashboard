name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  validate-test-and-deploy:
    name: Validate, Test & Deploy to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate JSON Schemas
        run: |
          if [ -d schemas ]; then
            npx ajv-cli validate -s schemas/compliance_metrics.schema.json -d dashboard/compliance_metrics.json -c ajv-formats || \
            npx ajv validate -s schemas/compliance_metrics.schema.json -d dashboard/compliance_metrics.json -c ajv-formats

            npx ajv-cli validate -s schemas/enriched_metrics.schema.json -d dashboard/enriched_metrics.json -c ajv-formats || \
            npx ajv validate -s schemas/enriched_metrics.schema.json -d dashboard/enriched_metrics.json -c ajv-formats

            npx ajv-cli validate -s schemas/generated_insights.schema.json -d dashboard/generated_insights.json -c ajv-formats || \
            npx ajv validate -s schemas/generated_insights.schema.json -d dashboard/generated_insights.json -c ajv-formats
          fi

      - name: Stage Artifacts for Testing & Deployment
        run: |
          mkdir -p _site
          cp -r dashboard/* _site/
          if [ -d schemas ]; then
            mkdir -p _site/schemas
            cp -r schemas/* _site/schemas/
          fi
          touch _site/.nojekyll

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Start Local Web Server
        run: |
          python3 -m http.server 8765 --directory _site &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8765/index.html > /dev/null; then
              echo "✓ Local test server running on port 8765"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E Smoke Suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: |
          npx playwright test tests/dashboard.spec.js --project=chromium --reporter=list

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "chore(deploy): publish dashboard to gh-pages [${{ github.sha }}]"
