name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate Schemas & Run E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Strict JSON Schema Validation
        run: |
          if [ -d schemas ]; then
            npx ajv validate -s schemas/compliance_metrics.schema.json -d dashboard/compliance_metrics.json -c ajv-formats
            npx ajv validate -s schemas/enriched_metrics.schema.json -d dashboard/enriched_metrics.json -c ajv-formats
            npx ajv validate -s schemas/generated_insights.schema.json -d dashboard/generated_insights.json -c ajv-formats
          fi

      - name: Install Playwright ${{ matrix.browser }} & OS Dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start Local Static Web Server
        run: |
          npx serve -s dashboard -l 8765 &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8765/index.html > /dev/null; then
              echo "✓ Local dashboard server is up on port 8765"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E Test Suite (${{ matrix.browser }})
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: |
          npx playwright test tests/dashboard.spec.js \
            --project=${{ matrix.browser }} \
            --reporter=list,html

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Prepare Site Artifacts
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage GitHub Pages Artifacts
        run: |
          mkdir -p _site
          cp -r dashboard/* _site/
          if [ -d schemas ]; then
            mkdir -p _site/schemas
            cp -r schemas/* _site/schemas/
          fi
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
