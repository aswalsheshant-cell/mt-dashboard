name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AJV for schema validation
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON schemas
        run: |
          echo "Validating sidecar JSON files against schemas..."
          if [ -f "schemas/compliance_metrics.schema.json" ] && [ -f "dashboard/compliance_metrics.json" ]; then
            ajv validate -s schemas/compliance_metrics.schema.json -d dashboard/compliance_metrics.json -c ajv-formats && echo "✓ Compliance metrics validated"
          fi
          if [ -f "schemas/enriched_metrics.schema.json" ] && [ -f "dashboard/enriched_metrics.json" ]; then
            ajv validate -s schemas/enriched_metrics.schema.json -d dashboard/enriched_metrics.json -c ajv-formats && echo "✓ Enriched metrics validated"
          fi
          if [ -f "schemas/generated_insights.schema.json" ] && [ -f "dashboard/generated_insights.json" ]; then
            ajv validate -s schemas/generated_insights.schema.json -d dashboard/generated_insights.json -c ajv-formats && echo "✓ Generated insights validated"
          fi

      - name: Stage GitHub Pages Artifacts
        run: |
          mkdir -p _site
          cp -r dashboard/* _site/
          if [ -d schemas ]; then
            mkdir -p _site/schemas
            cp -r schemas/* _site/schemas/
          fi
          touch _site/.nojekyll
          echo "✓ Staged files for deployment"
          ls -la _site/ | head -15

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
