name: Dashboard Validation & QC

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest tests.unit.test_skills_loader -v

      - name: Lint action SHA pins
        run: |
          python3 << 'EOF'
          import glob, re, sys

          ACTION_PATTERN = re.compile(
              r'^\s*(?:-\s+)?uses:\s+([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+(?:/[^@\s]+)?)\s*@\s*([^\s#]+)'
          )
          VALID_SHA_PATTERN = re.compile(r'^[a-f0-9]{40}$')

          errors = []
          workflow_files = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')

          for file_path in sorted(workflow_files):
              with open(file_path, 'r', encoding='utf-8') as f:
                  for line_idx, line in enumerate(f, start=1):
                      match = ACTION_PATTERN.search(line)
                      if match:
                          action_name, ref = match.group(1), match.group(2)
                          if action_name.startswith('.'):
                              continue
                          if not VALID_SHA_PATTERN.fullmatch(ref):
                              errors.append(
                                  f"{file_path}:{line_idx}: '{action_name}' must pin exact 40-char SHA. "
                                  f"Found: '{ref}' (len={len(ref)})"
                              )

          if errors:
              print("❌ CI SHA Lint Failed:\n" + "\n".join(errors))
              sys.exit(1)
          print(f"✅ Verified {len(workflow_files)} workflow files — all actions use valid 40-char SHAs.")
          EOF

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/build_dashboard_data.py
          echo "✓ Python syntax valid"

      - name: Install Node dependencies
        run: |
          npm install --legacy-peer-deps \
            eslint eslint-config-standard eslint-plugin-import \
            ajv-cli 2>&1 | tail -5

      - name: Run ESLint on dashboard/index.html
        run: |
          # Extract and validate JavaScript from index.html
          grep -o '<script[^>]*>.*</script>' dashboard/index.html | \
            sed 's/<[^>]*>//g' > /tmp/dashboard_js.js || true

          # Basic syntax check: ensure no unclosed braces
          if node -c dashboard/index.html 2>&1 | grep -q "SyntaxError"; then
            echo "❌ JavaScript syntax error found"
            exit 1
          fi
          echo "✓ JavaScript syntax valid"

      - name: Validate JSON schemas
        run: |
          # Validate compliance_metrics.json against schema
          if command -v ajv &> /dev/null; then
            ajv validate -s schemas/compliance_metrics.schema.json -d dashboard/compliance_metrics.json
            echo "✓ compliance_metrics.json valid"
          else
            python3 << 'EOF'
          import json
          import sys

          # Load and validate compliance_metrics.json
          try:
            with open('dashboard/compliance_metrics.json', 'r') as f:
              data = json.load(f)

            # Basic validation
            assert 'compliance' in data, "Missing 'compliance' key"
            assert 'chain_summary' in data['compliance'], "Missing 'chain_summary'"
            assert isinstance(data['compliance']['chain_summary'], list), "chain_summary must be array"
            assert len(data['compliance']['chain_summary']) > 0, "chain_summary is empty"

            for chain in data['compliance']['chain_summary']:
              assert 'chain' in chain, "Missing 'chain' in summary"
              assert 'status' in chain, "Missing 'status' in chain"
              assert chain['status'] in ['COMPLIANT', 'WATCH', 'CRITICAL GAP'], f"Invalid status: {chain['status']}"

            print("✓ compliance_metrics.json schema valid")
          except Exception as e:
            print(f"❌ Schema validation error: {e}")
            sys.exit(1)
          EOF
          fi

      - name: Validate enriched_metrics.json
        run: |
          python3 << 'EOF'
          import json
          import os

          filepath = 'dashboard/enriched_metrics.json'
          if os.path.exists(filepath):
            try:
              with open(filepath, 'r') as f:
                data = json.load(f)
              print("✓ enriched_metrics.json is valid JSON")
            except json.JSONDecodeError as e:
              print(f"❌ enriched_metrics.json invalid: {e}")
              exit(1)
          else:
            print("⚠ enriched_metrics.json not found (optional)")
          EOF

      - name: Validate generated_insights.json
        run: |
          python3 << 'EOF'
          import json
          import os

          filepath = 'insights/generated_insights.json'
          if os.path.exists(filepath):
            try:
              with open(filepath, 'r') as f:
                data = json.load(f)

              if 'insights' in data:
                assert isinstance(data['insights'], list), "insights must be array"
                print(f"✓ generated_insights.json valid: {len(data['insights'])} insights")
              else:
                print("⚠ generated_insights.json missing 'insights' key (optional)")
            except json.JSONDecodeError as e:
              print(f"❌ generated_insights.json invalid: {e}")
              exit(1)
          else:
            print("⚠ generated_insights.json not found (optional)")
          EOF

      - name: Check for data.js integrity
        run: |
          python3 << 'EOF'
          import os
          import re

          filepath = 'dashboard/data.js'
          if not os.path.exists(filepath):
            print(f"⚠ data.js not found in repository")
            exit(0)

          with open(filepath, 'r') as f:
            content = f.read()

          if not content.startswith('window.DASH'):
            print("❌ data.js does not start with 'window.DASH'")
            exit(1)

          try:
            json_match = re.search(r'window\.DASH\s*=\s*({.*});', content, re.DOTALL)
            if json_match:
              print(f"✓ data.js has valid structure (~{len(content)} bytes)")
            else:
              print("⚠ Could not verify data.js structure (may be minified)")
          except Exception as e:
            print(f"⚠ data.js structure check skipped: {e}")
          EOF

      - name: Verify dashboard markup
        run: |
          python3 << 'EOF'
          import re

          with open('dashboard/index.html', 'r') as f:
            html = f.read()

          # Phase 2 (v1.1.2) checks — Store Hierarchy & Granularity awareness
          checks = [
            ('nav button', 'Navigation buttons'),
            ('section id="tab-', 'Tab sections'),
            ('function maskSiteCode', 'Synthetic site code masking (Phase 2)'),
            ('function getGranularityBadge', 'Granularity badge display (Phase 2)'),
            ('function wireRelianceBCToggle', 'Reliance Brand Counter toggle (Phase 2)'),
            ('function buildExplorer', 'Data Explorer tab builder'),
            ('function exportCSV', 'CSV export function'),
          ]

          passed = 0
          for check, label in checks:
            if check in html:
              print(f"✓ {label}")
              passed += 1
            else:
              print(f"❌ Missing: {label}")

          print(f"\n{passed}/{len(checks)} markup checks passed")
          if passed < len(checks):
            print("⚠ Some checks failed — dashboard may have legacy references")
            exit(1)
          EOF

      - name: Test local HTTP server startup
        run: |
          cd dashboard
          python3 -m http.server 8765 > /tmp/server.log 2>&1 &
          sleep 2

          # Verify server is running
          if curl -s http://localhost:8765/index.html | grep -q "Modern Trade"; then
            echo "✓ Dashboard server responds"
          else
            echo "❌ Dashboard server not responding"
            cat /tmp/server.log
            exit 1
          fi

          # Verify key files are served
          curl -s http://localhost:8765/compliance_metrics.json | python3 -m json.tool > /dev/null && echo "✓ compliance_metrics.json served"
          curl -s http://localhost:8765/data.js | head -c 100 | grep -q "window.DASH" && echo "✓ data.js served"

          pkill -f "http.server 8765"

      - name: Note where the tab x FY-state matrix is actually validated
        run: |
          python3 << 'EOF'
          print("✓ 11-tab x FY-state Playwright regression coverage runs in the")
          print("  'Dashboard UI Smoke Tests' workflow (tests/e2e_v1.1.0_consolidation.spec.js),")
          print("  gated as a required check — not run in this job.")
          print("  To run it locally: npx playwright test tests/e2e_v1.1.0_consolidation.spec.js")
          EOF

      - name: Create PR comment with validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const timestamp = new Date().toISOString().split('T')[0];

            // Every line below corresponds to a step earlier in THIS job that
            // would have failed the job (stopping it before this step ever runs)
            // if the check did not hold. Nothing is asserted here that this job
            // did not itself verify -- see B14 in the project backlog for why
            // that constraint exists.
            const comment = `## ✅ Dashboard Validation Report

            **Date**: ${timestamp}
            **Branch**: \`${{ github.head_ref }}\`

            ### Validation results (this job only)
            - ✓ Python syntax valid
            - ✓ JavaScript syntax valid
            - ✓ compliance_metrics.json schema valid; enriched_metrics.json validated if present
            - ✓ Dashboard markup integrity (nav buttons, tab sections, Phase 2 functions, \`buildExplorer\`, \`exportCSV\`)
            - ✓ CSV export function present
            - ✓ HTTP server responds correctly

            ### Next steps
            1. Run local test suite: \`npm test\` (when available)
            2. Full tab × FY-state regression: see the required **Dashboard UI Smoke Tests** check on this PR (Playwright, \`tests/e2e_v1.1.0_consolidation.spec.js\`) — that workflow is the source of truth for tab/state coverage, not this comment.

            **Generated by** [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        run: |
          echo "=========================================="
          echo "✅ All validation checks completed"
          echo "=========================================="
          echo ""
          echo "Validated in this job:"
          echo "  • Python scripts"
          echo "  • JavaScript syntax"
          echo "  • JSON schemas"
          echo "  • Dashboard markup"
          echo "  • CSV export function"
          echo "  • HTTP server response"
          echo ""
          echo "Full tab x FY-state coverage is reported by the separate"
          echo "'Dashboard UI Smoke Tests' workflow, not by this job."
