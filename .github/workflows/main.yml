name: Development

on:
  push:
    branches: ["**"]

jobs:
  health-check:
    runs-on: ubuntu-latest
    # environment: Development  # removed — environment not configured in repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check — scripts
        run: python -m compileall scripts/ -q

      - name: Confirm dashboard assets present
        run: |
          test -f dashboard/index.html && echo "✓ index.html present"
          test -f dashboard/data.js    && echo "✓ data.js present"
