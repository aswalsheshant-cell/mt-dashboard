name: Development

on:
  push:
    branches: ["**"]

jobs:
  # On main branch: runs with environment gate so the deployment badge updates.
  health-check:
    runs-on: ubuntu-latest
    environment: Development
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check — scripts
        run: python -m compileall scripts/ -q
      - name: Confirm dashboard assets present
        run: |
          test -f dashboard/index.html && echo "✓ index.html present"
          test -f dashboard/data.js    && echo "✓ data.js present"

  # On feature branches: same checks but no environment gate, so no startup_failure.
  health-check-branch:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check — scripts
        run: python -m compileall scripts/ -q
      - name: Confirm dashboard assets present
        run: |
          test -f dashboard/index.html && echo "✓ index.html present"
          test -f dashboard/data.js    && echo "✓ data.js present"
