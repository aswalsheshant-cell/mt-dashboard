[pytest]
# Configure pytest to discover tests in both tests/ and scripts/
# (scripts/ contains pytest wrapper files that re-export tests from tests/)
testpaths = tests scripts
python_files = test_*.py pytest_*.py
python_classes = Test*
python_functions = test_*

# Ignore certain patterns
norecursedirs = .git .venv venv node_modules build dist

# Show extra test summary
addopts = -v --tb=short
