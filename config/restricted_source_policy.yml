# Restricted-source firewall policy (scripts/restricted_source_firewall.py).
# known_debt = restricted files already tracked on 2026-10-01, pinned by SHA-256.
# Adding a restricted file, or changing a listed one, fails tests/test_restricted_source_firewall.py.
# Removing them from Git or history is owner decision I-2; nothing here deletes data.
version: 1
owner_decision: 'I-2 (pending): containment (private repo) and any history purge are owner decisions; this policy never deletes files'
classification_source: docs/DATA_SECURITY_CLASSIFICATION.md
allowed_patterns:
- PowerBI/RawDataFolders/*/_README*
- PowerBI/RawDataFolders/*/_TEMPLATE*
- tests/fixtures/*
- test/fixtures/*
employee_column_patterns:
- \bemp(loyee)?[ _/]*(id|code|no)\b
- ^SO[ /]?(ASE)?[ _]*Name
- \bmobile\b
- \bphone\b
- \be-?mail\b
- \baadhaa?r\b
- ^PAN\b
- \bsalary\b|\bctc\b
restricted_path_patterns:
- pattern: PowerBI/RawDataFolders/*
  class: CUSTOMER_STORE_ARTICLE_RAW
- pattern: data/monthly/*
  class: CUSTOMER_STORE_ARTICLE_RAW
- pattern: data/raw_drops/*
  class: CUSTOMER_STORE_ARTICLE_RAW
- pattern: archive/*/data.json
  class: UNAGGREGATED_ARCHIVE
