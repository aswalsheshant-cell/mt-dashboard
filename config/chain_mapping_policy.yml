# Chain Mapping Policy — governed, append-only decision record
#
# Turns business-owner decisions returned on the dashboard's Commercial
# Analytics > Chain Mapping Health export ("Unmapped exception register" +
# "Proposed mappings — awaiting approval", both generated by
# mapping_health_block() in scripts/build_dashboard_data.py) into a durable,
# versioned record. Produced per .claude/skills/mapping-approval-governor's
# policy-schema.md.
#
# STATUS: THIS FILE IS NOT YET CONSUMED BY THE BUILD PIPELINE.
# scripts/dist_allocation_governance.py's DistAllocationGovernance.apply_overrides()
# reads PowerBI/SeedData/Masters/PrimaryAllocationOverride.csv at
# (Ship To Name x Brand x Month) grain, but is never CALLED from
# allocate_dist_primary() in scripts/build_dashboard_data.py -- confirmed by
# `grep -rn "apply_overrides(" .` returning only its own definition. The
# override CSV's rows are currently only COUNTED for a governance metric
# (alloc["governance"]["override_count"]), never applied to _Chain. This
# record exists so the approved decisions are not lost while that pipeline
# gap gets its own bounded, tested fix (see docs/FAILURE_MODE_REGISTER.md
# FM-19) -- do not treat a rule below as "live" until FM-19 is resolved and
# this file (or its exploded month-grain form) is actually wired in.
#
# Precedence this file occupies once FM-19 is resolved (per this repo's
# existing evidence hierarchy, documented in mapping_health_block()'s own
# "method" text and PowerBI's cont%-split methodology -- not invented here):
#   Direct billing (Chain name for Dashboard) > this approved-mapping tier >
#   exact cont%-sheet match > nearest-month cont%-sheet match (+/-3mo) >
#   Unmapped Chain
#
# FY GRAIN CAVEAT (verified in code, not assumed): mapping_health_block()'s
# exception/proposal aggregation (scripts/build_dashboard_data.py ~line 3184-3198)
# keys on (cust_code, ship_to) only and collects a `months` SET of month
# NAMES (e.g. "April") -- the per-row `fy` tag read at line 3183 is fetched
# but never added to that set or otherwise retained. The exported "Unmapped
# exception register" and "Proposed mappings" tables this policy is built
# from therefore carry NO machine-readable FY tag. `unmapped_chains_bridge_suggested.csv`'s
# own `months` column enumerates one full April-March cycle per distributor,
# consistent with FY26 (the repo's most recent fully-closed pre-agg FY per
# CLAUDE.md), but this is inference from pattern, not a verified field --
# VALID_FROM/VALID_TO below are therefore left UNRESOLVED rather than guessed.
# Confirming the exact FY (and re-deriving missing_mapping with fy/month
# retained through the aggregation) is part of FM-19's fix.

