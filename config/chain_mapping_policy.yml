open_findings:
  - id: FM-19
    summary: "PrimaryAllocationOverride.csv is schema-ready but apply_overrides() is dead code — never called from allocate_dist_primary(). Approved rows above have no live effect until this is wired in and tested."
  - id: FM-20
    summary: "Unmapped exception register's cumulative_pct can read >100% mid-list when later rows carry negative NSV (returns/credits) sorted to the tail — mathematically correct (net-of-returns cumulative always ends at exactly 100%) but reads as broken to a business reviewer; needs a disclosure caveat, not a formula change."
