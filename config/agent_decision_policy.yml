# Agent decision policy -- what an agent may decide alone, and what needs a human.
# Read by scripts/agent_governance.py. Change a rule here (with a reason in review),
# never inside the agent.
#
# STATUS: baseline built from docs/AI_ORCHESTRATOR_GOVERNANCE.md and the
# fmcg-decision-leader skill. Not yet reconciled to the LinkedIn posts on agent
# governance (they could not be opened from the cloud session).

version: 1

# Time: a control nobody re-reads drifts. `check` fails once today is past this date.
# Re-review the whole file (and the approvers list) and move the date forward.
review_by: "2027-01-04"

# Why each rule exists. Every rule below must cite one of these, so no rule is
# unexplained. CLAUDE.md Core Invariants are the source for INV-1, INV-2, INV-5.
invariants:
  INV-1: "Raw seed data and masters are never deleted or overwritten without human confirmation"
  INV-2: "Verified baselines and FY25/FY26 history survive every build"
  INV-3: "No agent creates or asserts a new financial number"
  INV-4: "main changes only through a human-backed, protected merge"
  INV-5: "No GitHub release or git tag is created"
  INV-6: "The rules cannot be changed by the agent they govern"
  INV-7: "A failed control is never overridden"
  INV-8: "Every agent action that changes state leaves checkable evidence"
  INV-9: "A human looks at what agents decided, often enough that oversight does not quietly lapse"

# Fail closed: an action_class not listed below needs a human.
default_level: HUMAN_APPROVAL

# Flip to true only after a human confirms GitHub branch protection on main
# (see docs/MAIN_BRANCH_PROTECTION_AUDIT.md). Until then merge_pr is BLOCKED.
main_branch_protection_confirmed: false

labels: [GO, GO WITH CONDITIONS, HOLD, ESCALATE, REJECT]
labels_needing_evidence: [GO, GO WITH CONDITIONS, REJECT]

# AUTO            agent may act; no log needed
# AUTO_LOG        agent may act; a decision record with evidence is mandatory
# HUMAN_APPROVAL  agent may only propose; a named approver must be on the record
# FORBIDDEN       never, even with approval from the agent's side
action_classes:
  read_only:                 {level: AUTO}
  draft_text:                {level: AUTO}
  run_validation:            {level: AUTO_LOG, invariant: INV-8}
  branch_commit:             {level: AUTO_LOG, invariant: INV-8}
  draft_pr:                  {level: AUTO_LOG, invariant: INV-8}
  merge_pr:                  {level: HUMAN_APPROVAL, blocked_until: main_branch_protection_confirmed, invariant: INV-4}
  modify_baseline:           {level: HUMAN_APPROVAL, invariant: INV-2}
  modify_financial_block:    {level: HUMAN_APPROVAL, invariant: INV-3}
  modify_master_data:        {level: HUMAN_APPROVAL, invariant: INV-1}
  change_incentive_rule:     {level: HUMAN_APPROVAL, invariant: INV-3}
  publish_external:          {level: HUMAN_APPROVAL, invariant: INV-3}
  log_review:                {level: HUMAN_APPROVAL, invariant: INV-9}
  override_failed_control:   {level: FORBIDDEN, invariant: INV-7}
  create_release_or_tag:     {level: FORBIDDEN, invariant: INV-5}

# Any path touched that matches one of these forces HUMAN_APPROVAL,
# whatever the action_class says.
protected_paths:
  - {path: config/baselines.json,            invariant: INV-2}
  - {path: dashboard/data.js,                invariant: INV-3}
  - {path: "PowerBI/SeedData/**",            invariant: INV-1}
  - {path: UniverseMT.csv,                   invariant: INV-1}
  - {path: Store_SO_Mapping.csv,             invariant: INV-1}
  - {path: "**/data_master.json",            invariant: INV-1}
  - {path: config/agent_decision_policy.yml, invariant: INV-6}

# Identity + least privilege: an actor not listed here is BLOCKED, and a listed
# actor may only use the action classes written next to its name.
agents:
  business-logic-agent:   {allowed: [read_only, draft_text]}
  insight-agent:          {allowed: [read_only, draft_text]}
  qc-agent:               {allowed: [read_only, draft_text, run_validation, branch_commit]}
  release-manager-agent:  {allowed: [read_only, run_validation, draft_pr, merge_pr]}
  claude-code:            {allowed: [read_only, draft_text, run_validation, branch_commit, draft_pr, log_review]}

# Humans who may approve a HUMAN_APPROVAL action. Listed by ROLE, not by name or email,
# so no personal data sits in the repo. An agent can never approve its own action.
# LIMIT: today this is a name in a file. A record could be written with this role typed
# in by an agent. Closing that needs the approval tied to a commit authored by the human's
# own git identity (planned; needs that identity from the owner).
approvers: [mt-analyst-lead]

# Boundary erosion: humans stop looking, and automatic decisions pile up unreviewed.
# `check` fails once this many AUTO_LOG decisions are logged since the last human review
# (a `log_review` record carrying an approver from the list above).
max_unreviewed_auto_decisions: 50

# Evidence must be checkable by the governance layer, not just typed by the agent:
#   {"type": "file",   "path": "<repo path>", "sha256": "<hash of that file>"}
#   {"type": "commit", "sha": "<git commit sha>"}
# A plain-text sentence is not evidence.
evidence_types: [file, commit]

required_fields: [id, ts, actor, action_class, label, rule, owner, validation_check]
