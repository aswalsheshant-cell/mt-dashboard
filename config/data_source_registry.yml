    last_validated: "2026-09-13"
    modification_allowed: false
    notes: >
      CORRECTED 2026-09-13 (previous entry said "no COGS source found" -- found on
      a deeper, targeted search: PowerBI/Reference/CM2_Provisional/). A COGS
      methodology exists (rate-card % on GMV/MRP sales, "Business rate card
      2026-07-24"), but SERIOUS AUTHENTICITY PROBLEM found: the rate card file
      itself is not in the repo (unverifiable), cm2_formula.csv's own
      "Approved_By: MT Automation" / "Approval_Date: 2026-08-30" predates and
      contradicts docs/FINANCE_DECISION_MEMO_GAP01_GAP02.md (dated 2026-09-05,
