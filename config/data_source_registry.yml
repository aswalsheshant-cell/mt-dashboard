    downstream_outputs: ["dashboard/data.js primary.* / detail_meta.fyx_primary", "PowerBI/PowerQuery/16_Fact_PrimaryArticle.pq"]
    last_validated: "2026-09-26 via scripts/reconcile_primary_baseline.py (tests/test_primary_baseline_reconciliation.py) -- FY26 Apr'25-Mar'26 Rs32,900.36L, Apr'25-Jun'26 Rs46,560.34L and Apr'25-Jul'26 Rs51,481.65L each match their documented figure exactly; all 17 files to Aug'26 total Rs55,139.95L (grows monthly, not a baseline)"
