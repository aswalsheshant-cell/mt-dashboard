    date_max: "2026-08"
    financial_years: ["FY26", "FY27"]
    important_columns: ["Chain", "Month", "Category", "Common Category", "Account Sales Rs L", "Honasa Sales Rs L", "Share %", "Relevant For Us"]
    business_owner: "MT leadership analytics (account share)"
    refresh_frequency: "Monthly, when the retailer files arrive"
    validation_status: VALIDATED
    source_priority: SOURCE_OF_TRUTH
    existing_pipeline: "scripts/build_account_share.py -> scripts/build_account_view.py -> data/account_share/Account_View.json -> scripts/build_nielsen_payload.py -> dashboards; PowerBI/SeedData/Account (scripts/build_nielsen_powerbi_seed.py)"
    downstream_outputs: ["Nielsen dashboard 'Account Share & Plan' tab", "dashboard/nielsen.js -> MT dashboard Market Share card", "PowerBI queries 53-55 and DAX 17"]
    last_validated: "2026-10-04"
