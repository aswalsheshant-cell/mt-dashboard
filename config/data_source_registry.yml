      HC/SC/BC that don't match this project's real taxonomy anywhere else, and
      a suspiciously exact Rs400 Cr "Forecast_Unallocated" pool row that matches
      the memo's own illustrative example number exactly). Treat as an
      UNVERIFIED METHODOLOGY TEMPLATE, not an approved or usable COGS source.
      Do not compute production CM2 from this until a human Finance sign-off
      and the real rate-card file are confirmed to exist.

