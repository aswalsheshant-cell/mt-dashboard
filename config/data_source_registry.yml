    grain: "invoice line (article grain, for Aug26_primary_detailed.csv)"
    date_min: "2026-08"
    date_max: "2026-08"
    financial_years: ["FY27"]
    primary_keys: ["Inv No.", "Article Code"]
    important_columns: ["Inv. Net value(LOC)", "Chain name", "PO Type", "brand / Division Desc.", "EAN No."]
    business_owner: "MT Analytics"
    refresh_frequency: "One-off until Aug'26 is folded into the regular Primary_Article_Monthly watch folder"
    validation_status: PARTIAL
    source_priority: SOURCE_OF_TRUTH
    fallback_source: null
    existing_pipeline: "scripts/aug26_data_readiness_gate.py (governed distributor-to-chain allocation + exception tracking for this exact file -- DO NOT re-derive chain splits with a naive groupby, see BL-14)"
    downstream_outputs: ["data/monthly/Aug26_chain_summary.csv", "data/monthly/Aug26_zone_summary.csv", "data/monthly/Aug26_metrics.json (all three cross-checked 2026-09-13, agree to the cent)"]
    last_validated: "2026-09-13 -- re-ran scripts/aug26_data_readiness_gate.py against the CURRENT complete Aug'26 offtake file: 81.4% value coverage (was 42% in the 2026-09-09 baseline record, which used an incomplete offtake upload). Lulu: CONFIRMED PRIMARY_SOURCE_MISSING (checked against secondary evidence and pooled-distributor evidence -- genuinely absent, not a mapping artifact)."
    modification_allowed: false
    notes: >
      CAVEAT: PowerBI/RawDataFolders/Primary_Aug26_FY27.csv (customer-grain)
      sums to ~Rs38.72 Cr; Aug26_primary_detailed.csv (article-grain, the one
      the readiness gate consumes) sums to Rs36.58 Cr, corroborated three
      independent ways (chain_summary.csv, zone_summary.csv, metrics.json).
      The ~Rs2.1 Cr gap between the two files is an UNRESOLVED SOURCE_CONFLICT
      (see docs/DATA_LINEAGE.md) -- not picked as "whichever passes"; flagged,
      not silently resolved. Use Aug26_primary_detailed.csv until the
      discrepancy is explained.
      "Chain name" (lowercase n) is a THIRD schema variant of the Primary
      file family -- added as an alias in scripts/aug26_data_readiness_gate.py
      PRIMARY_SCHEMA_ALIASES on 2026-09-13.

  chain_allocation_tool:
    business_name: "Distributor -> Chain allocation (governed logic, reusable)"
    source_path: "scripts/aug26_data_readiness_gate.py (allocate_primary(), build_chain_mapping_audit(), recheck_exceptions()); scripts/build_dashboard_data.py (load_chain_allocation_weights(), apply_chain_allocation() -- the production-build equivalent)"
    source_type: "Python function, not a static dataset"
    grain: "n/a"
    date_min: null
    date_max: null
    financial_years: []
    primary_keys: []
    important_columns: []
    business_owner: "Analytics Engineering"
    refresh_frequency: "n/a"
    validation_status: VALIDATED
    source_priority: SOURCE_OF_TRUTH
    fallback_source: null
    existing_pipeline: "n/a -- this IS the pipeline"
    downstream_outputs: ["Allocated_Chain column on any primary file it is run against"]
    last_validated: "2026-09-13"
    modification_allowed: false
    notes: >
      THIS IS THE FIX FOR "raw distributor billing used as chain primary
      without checking for existing allocation logic". Direct rows keep their
      own chain; Dist. rows are split using REAL secondary-offtake evidence
      (article-level ratio first, then distributor+brand ratio), never a
      naive groupby on the raw billing-customer name. A chain with genuinely
      no evidence anywhere lands in an explicit exception register
      (TRACKED_EXCEPTION_CHAINS) with a reasoned status (MAPPING_GAP /
      PRIMARY_SOURCE_MISSING / SECONDARY_SOURCE_MISSING / UNRESOLVED) rather
      than silently being dropped or silently reported as zero.

