# Data Source Registry
#
# Points to EXISTING datasets already produced by this repo's pipelines -- it
# does not duplicate them. Added 2026-09-13 to close a real, demonstrated gap:
# docs/AI_ORCHESTRATOR_READINESS.md (2026-08-07) already flagged "no
# reverse-tracing infrastructure" and "no tool wrapper" as open items; this
# registry plus scripts/data_catalog.py is that next increment, not a
# replacement for anything.
#
# What this repo ALREADY has that this file does not duplicate:
#   - docs/BUSINESS_LOGIC_REGISTRY.md   -- business rules (BL-01..BL-13), owners,
#                                          Finance-approval status. Authoritative
#                                          for RULES. This file is authoritative
#                                          for WHERE DATA LIVES.
#   - config/analytics_config.json      -- thresholds, RAG bands, per-layer
#                                          readiness gates (the `readiness` block
#                                          is itself a coarse availability matrix
#                                          for derived analytical layers).
#   - config/baselines.json             -- protected/frozen KPI values, checked
#                                          by tests/test_baseline_invariants.py.
#   - docs/PROJECT_STATE.md             -- current phase, blockers, regression
#                                          baseline. Read this FIRST on resume.
#
# modification_allowed: false means "this dataset's historical values must not
# be silently changed" (frozen_history / approved_current in baselines.json's
# vocabulary) -- it does NOT mean the registry ENTRY is immutable; extend entries
# freely as new months/sources are discovered.

schema_version: "1.0"
updated: "2026-09-21"

datasets:

  offtake_preagg_fy25_fy26:
    business_name: "Offtake NSV -- pre-aggregated workbooks (FY25 + FY26)"
    source_path: "dashboard/data.js (offtake.monthly_fy26 / offtake.months_fy26 / offtake.total_fy26)"
    source_type: "generated JSON (baked from source workbooks by scripts/build_dashboard_data.py; raw workbooks are gitignored)"
    grain: "month x zone (see offtake.zone_monthly_fy26 for the zone cut)"
    date_min: "2024-04"
    date_max: "2026-03"
    financial_years: ["FY25", "FY26"]
    primary_keys: ["month"]
    important_columns: ["monthly_fy26", "months_fy26", "total_fy26", "zone_monthly_fy26"]
    business_owner: "MT Analytics"
    refresh_frequency: "Only on a full rebuild via build_dashboard_data.py (no --offtake-patch mode covers this pre-FY27 window)"
    validation_status: VALIDATED
    source_priority: SOURCE_OF_TRUTH
    fallback_source: null
    existing_pipeline: "scripts/build_dashboard_data.py (full build only)"
    downstream_outputs: ["dashboard/index.html Executive Cockpit / Inventory & Supply Health tabs", "config/baselines.json offtake_fy26_total check"]
    last_validated: "2026-09-13 (this session: offtake.monthly_fy26 sums to total_fy26 exactly, Rs31,119.87L)"
    modification_allowed: false
    notes: >
      THIS IS THE FIX FOR THE "Aug'25 Offtake is unavailable" FAILURE MODE.
      Offtake_Monthly/ (the raw watch folder) only starts Apr'26 because that
      folder is for the FY27+ --offtake-patch mechanism (see
      offtake_article_fy27_patch entry below) -- it was never meant to hold
      FY25/FY26 history. That history already lives here. Confirmed 2026-09-13:
      offtake.monthly_fy26[offtake.months_fy26.indexOf('Aug-25')] = 2435.71 (Rs
      24.36 Cr). A search that stops at Offtake_Monthly/ and concludes "no
      Aug'25 data" is searching the wrong dataset for that period.

  offtake_article_fy27_patch:
    business_name: "Offtake NSV -- article-level FY27+ monthly patch"
    source_path: "PowerBI/RawDataFolders/Offtake_Monthly/offtake_store_article_<Mon>_<YY>.csv"
    source_type: "CSV, one file per month, store x article grain"
    grain: "month x store x article x chain"
    date_min: "2026-04"
    date_max: "DISCOVER AT RUNTIME -- see scripts/data_catalog.py:get_latest_available('offtake'); as of 2026-09-13 the newest file present is offtake_store_article_Aug_26.csv"
    financial_years: ["FY27"]
    primary_keys: ["Month", "Site Code", "Article", "Chain Name"]
    important_columns: ["NSV", "Sales Qty", "Brand", "Category", "Sub_category", "Chain Name", "Description as per Fountain"]
    business_owner: "MT Analytics"
    refresh_frequency: "Monthly, on new file drop"
    validation_status: VALIDATED
    source_priority: SOURCE_OF_TRUTH
    fallback_source: "offtake_preagg_fy25_fy26 for any month before FY27"
    existing_pipeline: "scripts/build_dashboard_data.py --offtake-patch"
    downstream_outputs: ["dashboard/data.js offtake.total_fyNN / monthly_fyNN / months_fyNN"]
    last_validated: "2026-09-13 (Jul'26 Rs36.21 Cr ex-RBC matches independently-supplied benchmark; Aug'26 Rs39.75 Cr ex-RBC computed fresh)"
    modification_allowed: false
    notes: >
      CRITICAL BUSINESS RULE (see docs/BUSINESS_LOGIC_REGISTRY.md BL-07,
      corrected 2026-09-13): rows where Store Type == "Brand Counter" must be
      EXCLUDED before reporting an offtake total. Filter on Store Type, NEVER
      on Chain Name alone -- Chain Name only forks into "Reliance" vs.
      "Reliance Brand Counter" from Jul'26 onward; in Apr-Jun'26 both BC and
      non-BC rows share Chain Name "Reliance" and only Store Type
      distinguishes them (confirmed 2026-09-13: a Chain-Name-only filter
      silently keeps ~Rs4-5 Cr/month of real BC rows in Apr-Jun'26 mixed into
      the total). Store-Type-filtered ex-BC series: Apr 35.89 / May 40.19 /
      Jun 38.40 / Jul 36.21 / Aug 39.75 Cr -- Jul'26 matches the independently
      supplied Rs36.18 Cr benchmark.

  primary_article_monthly:
