    downstream_outputs: []
    last_validated: "2026-09-13"
    modification_allowed: false
    notes: >
      Methodology found: "logistics rate applies to NSV" per cm2_formula.csv,
      with Apr+May-26 = Rs275.53L and Jun-26 = Rs170.45L given as computed
