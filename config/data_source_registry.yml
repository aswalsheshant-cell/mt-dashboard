    notes: >
      Lulu and More cover only categories and stores where Honasa sells, so white space is read inside that scope; Wellness lists all
      categories. More Retail has a scope break before and after Jun 26, so MoM uses Jun-Aug only (dashed lines on charts). Lulu has
      store-level state and a city readable from the store name; More has DC city only; Wellness has none. Dmart and Reliance appear only as
      quarterly figures typed from the review deck. Store_City_Corrections.csv (Lulu 9260 -> Thrissur) is applied in the store master build.
      UniverseMT.csv supplied again is identical to the repo copy and has no city column.
      Reliance (RIL_BA_Store_MS_-_Aug26.xlsb): RRL = Reliance's own category sales, HCL = Honasa, gross sales in Rs lakh as supplied (our NSV
      is about 0.45 of it, so compare shares, not rupees). Sheet "Article MS Source" = Reliance stores outside the brand counters (Nov 25-Aug 26,
      zone and state, no store or city) -> chain "Reliance Retail"; sheet "BA Store" = the staffed brand-counter stores (Jan-Aug 26, store, city) ->
      chain "Reliance Brand Counter", counts only, kept apart and never added to Reliance Retail. "RRL Others" (categories outside the file's own
      pivots) is left out, as the file does. Ties to the workbook's Aug26 Check sheet and TOP Category MS pivot are QC checks in the builder.
      Our sales above the account's category (item classed differently, e.g. Reliance Perfume) keep their sales in the totals and have a blank share.
      A category is flagged (white space, proven elsewhere) only when it is at least 0.5% of our own sales across the chains and not "Other"
      (column Relevant For Us); the rest are shown for size only.

