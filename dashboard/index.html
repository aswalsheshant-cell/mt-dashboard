// One tab to rank/compare Chain, Brand, Sub-category, Range, Pack Size or
// Article side by side (FY-over-FY, YoY, contribution %) instead of hunting
// across separate tabs. Chain/Brand come from the chain-allocated Primary
// source (FY25 vs FY26); Sub-category/Range/Pack Size/Article come from the
// article-level detail (REC), which only spans FY26/FY27 -- so the year
// pair shown adapts to whichever two FYs are actually present for that
// dimension.
let cmpDim='Chain';
function buildComparison(){
  const s=document.getElementById('tab-comparison');
  const dims=['Chain','Brand','SubCategory','Range','PackSize','Article'];
  const dimLab={Chain:'Chain',Brand:'Brand',SubCategory:'Sub-category',Range:'Range',PackSize:'Pack Size',Article:'Article'};
  const btns=dims.map(d=>`<button class="fbtn ${d===cmpDim?'':'ghost'}" data-dim="${d}" style="margin:0 8px 10px 0">${dimLab[d]}</button>`).join('');
  const active=activeChipsHtml();

  let rows, yrPair, source;
  if(cmpDim==='Chain'||cmpDim==='Brand'){
    if(fyUnsupported()){
      // FYs beyond the pre-agg window (FY27's Apr'26+) still have exact
      // chain/brand aggregates in the article-wise primary (fyx_primary) --
      // show those real numbers instead of a blank state when loaded.
      const fp=FPX(fyTag());
      if(fp){
        const arr27=cmpDim==='Chain'?consolidateChains(fp.by_chain):fp.by_brand;
        source=`article-wise primary, chain-allocated (${fyTag()} YTD: ${fp.months_covered.join(' & ')})`;
        rows=arr27.filter(x=>x.nsv>0).map(x=>({name:x.name,a:null,b:x.nsv,yoy:null}));
        yrPair=['–',fyTag()];
      } else {
        s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2><div style="margin:0 0 14px">${btns}</div>${fyNoDataNote('the chain/brand Primary source')}${catDrillCardHtml('cmpCatDrill')}`;
        wireCmpButtons(s); renderCatDrillChart('cmpCatDrill',recFilter()); return;
      }
    } else {
      source='Primary (chain-level, secondary-allocated for Distributors)';
      const arr=cmpDim==='Chain'?D.primary.by_chain:D.primary.by_brand;
      rows=arr.filter(x=>(x.fy26||0)>0||(x.fy25||0)>0).map(x=>({name:x.name,a:x.fy25,b:x.fy26,yoy:x.yoy}));
      yrPair=['FY25','FY26'];
    }
  } else {
    source='article-level primary detail (File 2)';
    const recs=recFilter(cmpDim);   // ignore this dimension's own filter so you can still compare across it
    const fys=[...new Set(recs.map(r=>r.FY))].sort();
    const [fyA,fyB]=fys.length>=2?[fys[fys.length-2],fys[fys.length-1]]:[null,fys[0]];
    const m={};
    recs.forEach(r=>{ (m[r[cmpDim]]??={})[r.FY]=(m[r[cmpDim]]?.[r.FY]||0)+r.NSV; });
    rows=Object.entries(m).map(([name,v])=>{
      const a=fyA?(v[fyA]||0):null, b=v[fyB]||0;
      return {name, a, b, yoy:(a?Math.round((b/a-1)*1000)/10:null)};
    });
    yrPair=[fyA||'–',fyB||'–'];
  }
  rows.sort((a,b)=>(b.b||0)-(a.b||0));
  const tot=rows.reduce((s2,r)=>s2+(r.b||0),0)||1;
  const top=rows.slice(0,15);
  const tableRows=top.map(r=>`<tr><td>${drillLink(cmpDim,r.name)}</td><td>${r.a!=null?crc(r.a):'–'}</td><td>${crc(r.b)}</td>
    <td>${r.yoy!=null?`<span class="pill ${r.yoy>=0?'g':'r'}">${pct(r.yoy)}</span>`:'–'}</td>
    <td>${(r.b/tot*100).toFixed(1)}%</td></tr>`).join('');
  const partialNote=(yrPair[1]==='FY27')?`<p class="drillhint" style="margin:4px 0 0">FY27 is a partial year
     (Apr'26 onward only) — YoY vs a full FY26 will read sharply negative even where the run-rate is flat or
     growing. Compare monthly averages, not full-year totals, for a fair read.</p>`:'';
  s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2>
   <p class="lead">Rank and compare ${dimLab[cmpDim]} performance. Source: ${source}.</p>
   ${partialNote}
   <div style="margin:0 0 14px">${btns}</div>
   ${active?`<div style="margin:0 0 14px">${active}</div>`:''}
   <div class="kpis">
     ${kpi(`${dimLab[cmpDim]}s Compared`,rows.length,'')}
     ${kpi(`Top ${dimLab[cmpDim]}`,top[0]?top[0].name:'–',top[0]?crc(top[0].b):'')}
     ${kpi(`Total (${yrPair[1]})`,crc(tot),'')}
   </div>
   ${card(`${dimLab[cmpDim]} — ${yrPair[0]} vs ${yrPair[1]}`,'click a bar to drill',cv('cmpChart'))}
   ${card(`${dimLab[cmpDim]} ranked comparison (top 15)`,'Click a name to drill.',`<div class="tablewrap"><table><thead><tr>
     <th>${dimLab[cmpDim]}</th><th>${yrPair[0]}</th><th>${yrPair[1]}</th><th>YoY</th><th>Contribution</th>
     </tr></thead><tbody>${tableRows||'<tr><td colspan="5">No records for this filter.</td></tr>'}</tbody></table></div>`)}
   ${catDrillCardHtml('cmpCatDrill')}`;
  wireDrillLinks(s);
  wireChips(s,buildComparison);
  wireCmpButtons(s);
  if(top.length){
    mkBar('cmpChart',top.map(r=>r.name),[
      {label:yrPair[0],data:top.map(r=>r.a||0),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:yrPair[1],data:top.map(r=>r.b||0),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo(cmpDim,v));
  }
  renderCatDrillChart('cmpCatDrill',recFilter());
}

    cmpDim=b.dataset.dim; destroyCharts(); buildComparison();

/* ---------------- DATA EXPLORER (drill-down + cascading filters) ---------------- */
const REC = D.detail_records||[];
const FILT=[['FY','FY'],['Month','Month'],['Channel','Channel'],['Zone','Zone'],['State','State'],['Chain','Chain'],
  ['Brand','Brand'],['Category','Category'],['SubCategory','Sub-category'],['Range','Range'],
  ['PackSize','Pack Size'],['Article','Article']];
const MORDER=(D.primary&&D.primary.month_labels)||['April','May','June','July','Aug','Sept','Oct','Nov','Dec','Jan','Feb','March'];
// MULTI-SELECT filter state: each dimension holds an ARRAY of selected values
// (empty = All). Values in a dimension are OR'd together; dimensions are
// AND'd, same as before.
const F={}; FILT.forEach(([k])=>F[k]=[]);
const fOn =k=>F[k].length>0;                                 // dimension filtered at all?
const fHas=(k,v)=>!F[k].length||F[k].includes(String(v));    // does value v pass dimension k?
const fLab=k=>F[k].join(', ');                               // display label ('' when unfiltered)
const fOne=k=>F[k].length===1?F[k][0]:null;                  // exactly-one selection or null

// records passing all active filters (optionally ignoring one key for cascading options)
function recFilter(except){
  return REC.filter(r=>FILT.every(([k])=> k===except || !F[k].length || F[k].includes(String(r[k])) ));
}
// FY dropdown: derived from the data, never hardcoded, so a new FY (FY28+)
// flows in automatically the moment its rows arrive. The pre-aggregated
// Primary/Offtake/P&L blocks carry FY25/FY26 (their source workbook ends
// Mar'26); every FY beyond that window (FY27 today, FY28 tomorrow) lives ONLY
// in the article-wise primary's detail_meta.fyx_primary. FY25 must stay
// selectable even though the Explorer/Category&Pack (REC-driven) view will
// correctly show 0 records for it.
const FYX=(D.detail_meta&&D.detail_meta.fyx_primary)||{};
function fyNum(t){ return parseInt(String(t).slice(2),10)||0; }  // 'FY27' -> 27
const PREAGG_FYS=(function(){
  const s=new Set();
  Object.keys(D.primary||{}).forEach(k=>{ const m=/^nsv_(fy\d{2})$/.exec(k); if(m) s.add('FY'+m[1].slice(2)); });
  return [...s];
})();
const FY_ALL=[...new Set([...PREAGG_FYS,...Object.keys(FYX)])].sort((a,b)=>fyNum(a)-fyNum(b));
function optsFor(key){
  if(key==='FY') return FY_ALL;
  const recs=recFilter(key);
  const vals=[...new Set(recs.map(r=>r[key]))];
  if(key==='Month') vals.sort((a,b)=>MORDER.indexOf(a)-MORDER.indexOf(b));
  else{
    const contrib={};
    recs.forEach(r=>{const v=r[key];contrib[v]=(contrib[v]||0)+(r.NSV||0);});
    vals.sort((a,b)=>(contrib[b]||0)-(contrib[a]||0)||String(a).localeCompare(String(b)));
  }
  return vals;
}
function renderFilterBar(){
  const fb=document.getElementById('filterbar');
  const anyActive=FILT.some(([k])=>F[k].length);
  fb.innerHTML = FILT.map(([k,lab])=>{
    const opts=optsFor(k), sel=F[k];
    return `<label class="fl"><span>${lab}</span><select data-k="${k}" title="Pick a value to add it; pick it again to remove it. Multiple values are OR'd.">
      <option value="">${sel.length?`${sel.length} selected — clear`:'All'}</option>
      ${opts.map(v=>{const s=String(v).replace(/"/g,'&quot;');const on=sel.includes(String(v));
        return `<option value="${s}">${on?'✓ ':''}${v}</option>`;}).join('')}
    </select></label>`;
  }).join('')
  + `<button class="fbtn ghost" id="fReset">↺ Reset filters</button>`
  + `<details class="pagedl"><summary class="fbtn">⭳ Download Page</summary>
       <div class="chartdl-menu" style="min-width:170px">
         <button data-pagefmt="pdf">📄 PDF</button>
         <button data-pagefmt="png">🖼 PNG Image</button>
       </div></details>`
  + `<span class="fcount" id="fCount">${anyActive?'Filtered · ':''}${num(recFilter().length)} records</span>`
  + (anyActive?`<span style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px">${activeChipsHtml()}</span>`:'');
  // multi-select via native dropdowns: picking an option TOGGLES it in/out of
  // the selection (✓ marks selected ones); the first line clears the dimension.
  fb.querySelectorAll('select').forEach(sel=>{
    sel.onchange=()=>{
      const k=sel.dataset.k, v=sel.value;
      if(v==='') F[k]=[];
      else{ const i=F[k].indexOf(v); if(i>=0) F[k].splice(i,1); else F[k].push(v); }
      if(k==='Category'&&!F[k].length) catChartDrill=null;
      onFilterChange();
    };
  });
  document.getElementById('fReset').onclick=()=>{FILT.forEach(([k])=>F[k]=[]);catChartDrill=null;onFilterChange();};
  fb.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{
    F[b.dataset.k]=F[b.dataset.k].filter(x=>x!==b.dataset.v);
    if(b.dataset.k==='Category'&&!F.Category.length) catChartDrill=null;
    onFilterChange();

}

// cross-tab drill-down: click any chart bar/segment/table-row on ANY tab to
// set that one filter and re-render the SAME tab narrowed to it -- drilling
// into "Dmart" on the Primary tab shows Dmart's own Primary view, not a jump
// to a different tab. The Data Explorer tab is still there whenever you want
// the raw row-level records for whatever's currently filtered.
function drillTo(key,value){
  if(!FILT.some(([k])=>k===key) || value==null) return;
  F[key]=[String(value)];   // drill = FOCUS on the clicked value (replaces the dimension's selection)
  onFilterChange();
}
function drillLink(key,label){
  return `<span class="drill" data-k="${key}" data-v="${String(label).replace(/"/g,'&quot;')}" title="Filter this view to ${label}">${label}</span>`;
}
function wireDrillLinks(root){
  root.querySelectorAll('.drill').forEach(el=>el.onclick=()=>drillTo(el.dataset.k, el.dataset.v));
}
// active-filter chips, reusable on any tab that reads recFilter() live (Explorer,
// Category & Pack, Performance & Comparison). rebuildFn re-renders the CURRENT
// tab in place when a chip is removed, instead of jumping to Explorer.
function activeChipsHtml(){
  return FILT.flatMap(([k,lab])=>F[k].map(v=>
    `<span class="fchip">${lab}: ${v} <b data-k="${k}" data-v="${String(v).replace(/"/g,'&quot;')}" title="remove this value">✕</b></span>`)).join(' ');
}
function wireChips(root,rebuildFn){
  root.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{
    F[b.dataset.k]=F[b.dataset.k].filter(x=>x!==b.dataset.v);
    if(b.dataset.k==='Category'&&!F.Category.length) catChartDrill=null;
    renderFilterBar();
    destroyCharts();
    (rebuildFn||buildExplorer)();
  });
}
// unique rows by `key` (sums NSV/MRP/Qty across whatever else varies -- e.g.
// unique articles summed across every chain/month, instead of the same
// article appearing once per chain/month row). First-seen value is kept for
// any other displayed columns (category/sub-cat/pack).
function uniqueBy(recs,key,cols){
  const m={};
  recs.forEach(r=>{
    const k=r[key];
    if(!m[k]){ m[k]={[key]:k,NSV:0,MRP:0,Qty:0}; (cols||[]).forEach(c=>m[k][c]=r[c]); }
    m[k].NSV+=r.NSV; m[k].MRP+=r.MRP||0; m[k].Qty+=r.Qty||0;
  });
  return Object.values(m).sort((a,b)=>b.NSV-a.NSV);
}
// per-brand 95%-of-brand-NSV Pareto: within each brand, keep sub-categories
// (sorted desc) until cumulative NSV crosses 95% of that brand's total;
// everything past that point is relabelled "Other" for that brand, THEN
// summed across all brands into the final SubCategory buckets. So a
// sub-category stays named if it's a material contributor for at least one
// brand, even if the combined "Other" bucket (all brands' long tails) ends
// up large.
function subcatPareto95(recs){
  const byBrand={};
  recs.forEach(r=>{ (byBrand[r.Brand]??=[]).push(r); });
  const out={};
  Object.values(byBrand).forEach(rows=>{
    const bySub={};
    rows.forEach(r=>{ bySub[r.SubCategory]=(bySub[r.SubCategory]||0)+r.NSV; });
    const total=Object.values(bySub).reduce((a,b)=>a+b,0)||1;
    const sorted=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
    let cum=0;
    sorted.forEach(([sub,val])=>{
      const label=(cum/total<0.95)?sub:'Other';
      out[label]=(out[label]||0)+val;
      cum+=val;
    });
  });
  return Object.entries(out).sort((a,b)=>b[1]-a[1]);
}

// ---- FY/Month filter-awareness for tabs backed by PRE-AGGREGATED blocks ----
// (D.primary, D.offtake, D.pnl, D.universe, D.promo) which only carry FY25 vs
// FY26 (they don't have FY26-27 actuals -- only the article-level detail/REC
// and the Forecast tab's TY target do). These helpers let every such tab obey
// the global FY/Month filter instead of always showing both years regardless
// of what's selected -- and show an honest empty state for FY27 rather than
// silently ignoring the filter.
function fyKey(){ const v=fOne('FY'); return v ? 'fy'+v.slice(2) : null; }  // exactly ONE FY selected -> "fy26"; none/multi -> null
function fyTag(){ return fOne('FY')||null; }                               // exactly ONE FY selected -> "FY27"; none/multi -> null
// FYs beyond the pre-aggregated window (FY27's Apr'26+ onward) exist ONLY in
// the article-wise primary (File 2) -- the other report blocks' source workbook
// ends Mar'26. FPX(tag) returns the exact chain-allocated aggregates for any
// such FY ('FY27', 'FY28', ...), or null if that FY isn't loaded.
function FPX(tag){ const f=FYX[tag]; return f&&f.nsv!=null?f:null; }
function FP27(){ return FPX('FY27'); }                                     // legacy alias for the current beyond-window FY
function fyBeyondPreagg(tag){ return PREAGG_FYS.indexOf(tag)<0; }          // this FY lives only in the article primary
function fyUnsupported(){ return F.FY.length>0 && F.FY.every(fyBeyondPreagg); }  // every selected FY is beyond the pre-agg window
function fyNoDataNote(where){

}

    data:{labels,datasets:[{data,borderColor:C.teal,backgroundColor:C.teal+'22',fill:true,tension:.32,borderWidth:2.4,pointRadius:2}]},
    options:{onClick:(e,els)=>{if(els.length){F.Month=[String(labels[els[0].index])];onFilterChange();}},
      plugins:{legend:{display:false},..._labelOpts(true),tooltip:{callbacks:{label:c=>crc(c.parsed.y)}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>crc(v)}},x:{grid:{display:false}}}}}));
}
// ---- Configurable Explorer chart gallery: each card has a live METRIC
// (NSV/MRP/Qty) + CHART-TYPE (Bar/Column/Line/Area/Donut/Pie) dropdown, keeps
// click-to-filter, and stays sorted high->low. Reuses recFilter()/MORDER/crc/
// qtyFmt/_labelOpts/PAL and the same expCharts cleanup + chartdl PNG/CSV/Excel
// menu as the other Explorer charts. Native <select> = no z-index/overlap.
const GAL_DIMS=[  // [canvasId, record field, title]  -- all fields exist in detail_records
  ['galChain','Chain','NSV by Chain'],['galBrand','Brand','NSV by Brand'],
  ['galCat','Category','NSV by Category'],['galSub','SubCategory','NSV by Sub-Category'],
  ['galPack','PackSize','NSV by Net Weight'],['galRange','Range','NSV by Range'],
  ['galZone','Zone','NSV by Zone'],['galState','State','NSV by State'],
  ['galChan','Channel','NSV by Channel'],
  ['galArt','Article','Top 15 Products by NSV'],['galMonth','Month','NSV Trend Monthly'],
];
const GAL_DIM_OF=Object.fromEntries(GAL_DIMS.map(([id,dim])=>[id,dim]));
const GAL_METRICS=[['NSV','NSV'],['MRP','MRP Value'],['Qty','Quantity']];
const GAL_TYPES=[['barh','Bar'],['bar','Column'],['line','Line'],['area','Area'],['doughnut','Donut'],['pie','Pie']];
const galState={};
function galDefault(dim){
  if(dim==='Month') return {metric:'NSV',type:'line'};
  if(dim==='Category'||dim==='Channel'||dim==='Zone') return {metric:'NSV',type:'doughnut'};
  return {metric:'NSV',type:'barh'};
}
function galGet(id,dim){ return galState[id]||(galState[id]=galDefault(dim)); }
function galControls(id,dim){
  const st=galGet(id,dim);
  const opt=(list,cur)=>list.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('');
  return `<span style="display:inline-flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)">
    <label>Metric <select data-gal="metric" data-id="${id}" style="font-family:inherit;font-size:12px;padding:2px 4px">${opt(GAL_METRICS,st.metric)}</select></label>
    <label>Chart <select data-gal="type" data-id="${id}" style="font-family:inherit;font-size:12px;padding:2px 4px">${opt(GAL_TYPES,st.type)}</select></label></span>`;
}
function galCardHtml(id,dim,title){ return card(title,galControls(id,dim),cv(id,dim!=='Month'&&dim!=='Chain')); }
function galAgg(recs,dim,metric){
  const m={};recs.forEach(r=>{ m[r[dim]]=(m[r[dim]]||0)+(Number(r[metric])||0); });
  let e=Object.entries(m).filter(x=>x[0]!=='undefined'&&x[0]!=='null'&&x[0]!=='');
  if(dim==='Month') e.sort((a,b)=>MORDER.indexOf(a[0])-MORDER.indexOf(b[0]));
  else e.sort((a,b)=>b[1]-a[1]);
  if(dim==='Article') e=e.slice(0,15);
  else if(dim!=='Month') e=e.slice(0,15);   // keep categorical charts readable
  return e;
}
function renderGal(id){
  const dim=GAL_DIM_OF[id]; const st=galGet(id,dim);
  const e=galAgg(recFilter(),dim,st.metric);
  const labels=e.map(x=>x[0]),data=e.map(x=>x[1]);
  const fmt=st.metric==='Qty'?(v=>qtyFmt(v)):(v=>crc(v));
  const isFilterDim=FILT.some(([k])=>k===dim);
  const onClick=isFilterDim?(ev,els)=>{if(els.length){F[dim]=[String(labels[els[0].index])];onFilterChange();}}:undefined;
  const t=st.type;
  let cfg;
  if(t==='doughnut'||t==='pie'){
    cfg={type:t,data:{labels,datasets:[{data,backgroundColor:PAL,borderColor:'#fff',borderWidth:2}]},
      options:{cutout:t==='doughnut'?'58%':0,onClick,plugins:{legend:{position:'right'},..._labelOpts(true),
        tooltip:{callbacks:{label:c=>{const tot=c.dataset.data.reduce((a,b)=>a+b,0);return `${c.label}: ${fmt(c.parsed)} (${tot?(c.parsed/tot*100).toFixed(0):0}%)`;}}}}}};
  } else if(t==='line'||t==='area'){
    cfg={type:'line',data:{labels,datasets:[{data,borderColor:C.teal,backgroundColor:C.teal+'22',fill:t==='area',tension:.32,borderWidth:2.4,pointRadius:2}]},
      options:{onClick,plugins:{legend:{display:false},..._labelOpts(true),tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
        scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>fmt(v)}},x:{grid:{display:false}}}}};
  } else {
    const horiz=(t==='barh');
    cfg={type:'bar',data:{labels,datasets:[{data,backgroundColor:C.teal,borderRadius:4}]},
      options:{indexAxis:horiz?'y':'x',onClick,plugins:{legend:{display:false},..._labelOpts(true),
        tooltip:{callbacks:{label:c=>fmt(horiz?c.parsed.x:c.parsed.y)}}},
        scales:horiz?{x:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>fmt(v)}},y:{grid:{display:false}}}
                    :{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>fmt(v)}},x:{grid:{display:false}}}}};
  }
  expCharts.push(new Chart(document.getElementById(id),cfg));
}
function wireGallery(section){
  section.addEventListener('change',ev=>{
    const sel=ev.target.closest('select[data-gal]'); if(!sel) return;
    const id=sel.dataset.id, dim=GAL_DIM_OF[id];
    galGet(id,dim)[sel.dataset.gal]=sel.value;
    const ex=Chart.getChart(id); if(ex){ const i=expCharts.indexOf(ex); if(i>=0) expCharts.splice(i,1); ex.destroy(); }
    renderGal(id);
  });
}
function buildExplorer(){
  expDestroy();
  const recs=recFilter();
  const s=document.getElementById('tab-explorer');
  const nsv=recs.reduce((a,r)=>a+r.NSV,0),mrp=recs.reduce((a,r)=>a+r.MRP,0),qty=recs.reduce((a,r)=>a+r.Qty,0);
  const active=activeChipsHtml();
  const rep=(D.detail_meta&&D.detail_meta.representative)
    ? `<div class="repbanner"><b>Representative data.</b> Drill-down runs on <code>detail_records</code> whose Chain/Brand/Zone/Channel/Month/FY totals match the real primary; Category, Sub-category, Pack Size and Article are taxonomy placeholders until the granular source feeds <code>build_dashboard_data.py</code>.</div>` : '';
  const cap=400, shown=recs.slice(0,cap);
  const trows=shown.map(r=>`<tr><td>${r.Month}</td><td>${r.FY}</td><td>${r.Channel}</td><td>${r.Zone}</td>
     <td>${r.Chain}</td><td>${r.Brand}</td><td>${r.Category}</td><td>${r.SubCategory}</td><td>${r.Range}</td><td>${r.PackSize}</td>
     <td>${r.Article}</td><td>${crc(r.NSV)}</td><td>${crc(r.MRP)}</td><td>${qtyFmt(r.Qty)}</td></tr>`).join('');
  // SIS channel check — always the SIS slice (ignores the Channel filter, respects the others)
  const isRep=!!(D.detail_meta&&D.detail_meta.representative);
  const ct=(D.detail_meta&&D.detail_meta.channel_totals)||null;
  // Prefer the EXACT channel_totals (computed from the full un-capped source)
  // over summing detail_records, since detail_records may be capped for size.
  // Dedicated 2-decimal formatters for this card so Lakh/Cr always align exactly
  // (e.g. Rs 250.17 L = Rs 2.50 Cr, Rs 236 L = Rs 2.36 Cr, Gap = Rs 14.16 L).
  const lac2=v=>'₹'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' L';
  const cr2=v=>'₹'+(v/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' Cr';
  let sis26;
  if (ct && !isRep){
    sis26=(ct.FY26&&ct.FY26.SIS)||0;
  } else {
    const sisR=recFilter('Channel').filter(r=>String(r.Channel).toUpperCase()==='SIS');
    sis26=sisR.filter(r=>r.FY==='FY26').reduce((a,r)=>a+r.NSV,0);
  }
  // SIS FY26 Primary — final confirmed figure only. Full investigation /
  // audit trail (superseded reference values, resolution record) lives in
  // PowerBI/docs/SIS_Reconciliation.md, not on the live dashboard.
  const sisCard=isRep?'':card('SIS — Primary (FY26)','',
    `<div class="val" style="font-size:24px">${cr2(sis26)}</div><div class="sub">${lac2(sis26)}</div>`);

  s.innerHTML=`<h2 class="sec">Data Explorer</h2>
   <p class="lead">Filter, drill down and click any chart to slice. All cards, charts and the table below update live. Values ₹ Crore unless noted.</p>
   ${rep}
   ${active?`<div style="margin:0 0 14px">${active}</div>`:''}
   <div class="kpis">
     ${kpi('NSV (filtered)',crc(nsv),`${num(recs.length)} records`)}
     ${kpi('MRP Value',crc(mrp),'gross basis')}
     ${kpi('Quantity',qtyFmt(qty),'')}
     ${kpi('Realisation',mrp?((nsv/mrp)*100).toFixed(0)+'%':'–','NSV ÷ MRP')}
   </div>
   ${sisCard}
   <p class="lead" style="font-size:13px;margin:6px 0 8px"><b>Custom charts</b> — each card below has its own
     <b>Metric</b> (NSV / MRP / Qty) and <b>Chart type</b> (Bar / Column / Line / Area / Donut / Pie) picker; bars stay
     sorted high→low, and clicking a chart still filters the whole view. Use the ⭳ on any card for PNG / CSV / Excel.</p>
   <div class="grid g2">${GAL_DIMS.slice(0,2).map(([id,dim,t])=>galCardHtml(id,dim,t)).join('')}</div>
   <div class="grid g3">${GAL_DIMS.slice(2,8).map(([id,dim,t])=>galCardHtml(id,dim,t)).join('')}</div>
   <div class="grid g3">${GAL_DIMS.slice(8).map(([id,dim,t])=>galCardHtml(id,dim,t)).join('')}</div>
   ${catDrillCardHtml('exCatDrill')}
   ${card(`Detail records${recs.length>cap?` — showing first ${cap} of ${num(recs.length)}`:` (${num(recs.length)})`}`,'Reflects all active filters.',
     `<div style="margin:-4px 0 10px"><button class="fbtn ghost" id="exExport">⭳ Export ALL filtered records (CSV)</button></div>
      <div class="tablewrap"><table><thead><tr>
      <th>Month</th><th>FY</th><th>Channel</th><th>Zone</th><th>Chain</th><th>Brand</th><th>Category</th>
      <th>Sub-cat</th><th>Range</th><th>Pack</th><th>Article</th><th>NSV</th><th>MRP</th><th>Qty</th>
      </tr></thead><tbody>${trows||'<tr><td colspan="14">No records for this filter.</td></tr>'}</tbody></table></div>`)}`;
  if(recs.length){ GAL_DIMS.forEach(([id])=>renderGal(id)); }
  wireGallery(s);
  renderCatDrillChart('exCatDrill',recs);
  s.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{F[b.dataset.k]='';if(b.dataset.k==='Category')catChartDrill=null;onFilterChange();});
  const ex=document.getElementById('exExport'); if(ex) ex.onclick=()=>exportCSV(recs);
}
function exportCSV(recs){
  const cols=['Month','FY','Channel','Zone','Chain','Brand','Category','SubCategory','Range','PackSize','Article','NSV','MRP','Qty'];
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[cols.join(',')].concat(recs.map(r=>cols.map(c=>esc(r[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='mt_detail_filtered.csv';a.click();
}
/* ---------------- nav ---------------- */
const TABS=[['explorer','Data Explorer'],['overview','Overview'],['primary','Primary'],['offtake','Offtake'],
  ['reliance-bc','Reliance Brand Counter'],
  ['pnl','P&L'],['category','Category & Pack'],['forecast','Forecast'],['promo','Promo & Trade Spend'],
  ['share','Market Share'],['distribution','Distribution'],['comparison','Performance & Comparison'],
  ['insights','Insights & Way Forward']];
const BUILD={explorer:buildExplorer,overview:buildOverview,primary:buildPrimary,offtake:buildOfftake,
  'reliance-bc':buildRelianceBC,
  pnl:buildPnl,category:buildCategory,forecast:buildForecast,promo:buildPromo,share:buildShare,
  distribution:buildDistribution,comparison:buildComparison,insights:buildInsights};
let currentTab='overview';
function show(id){
  currentTab=id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
  document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id==='tab-'+id));
  // every tab always rebuilds from the CURRENT filter state (no stale cache) --
  // this is what makes the global FY/Month/Chain/... filter bar apply dashboard-wide,
  // not just on the Data Explorer. Deferred one tick: drillTo() is invoked from
  // INSIDE a Chart.js onClick handler, and destroying that same chart synchronously
  // (before Chart.js finishes its own internal afterEvent/tooltip processing for
  // this click) throws "Cannot read properties of undefined (reading 'handleEvent')".
  // Letting the current event loop turn finish first avoids that.
  setTimeout(()=>{
    destroyCharts();
    BUILD[id]();
    window.scrollTo({top:0,behavior:'smooth'});
  },0);
}
(function init(){
  document.getElementById('hTitle').textContent=D.meta.title;
  document.getElementById('hPeriod').textContent=D.meta.period;
  document.getElementById('foot').innerHTML=`${D.meta.unit_note}<br>Source: ${D.meta.source}`;
  const nav=document.getElementById('nav');
  TABS.forEach(([id,lab])=>{const b=el('button',null,lab);b.dataset.t=id;b.onclick=()=>show(id);nav.appendChild(b);});
  renderFilterBar();
  show('overview');
})();
</script>

  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
