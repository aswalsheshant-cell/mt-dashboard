<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MT Leadership Dashboard — Honasa / Mamaearth</title>
<script src="chart.umd.js"></script>
<style>
  :root{
    --teal:#2D9B7F; --teal-d:#1f7a63; --bg:#F4F1EC; --card:#ffffff;
    --ink:#1F2933; --muted:#6b7682; --line:#e4e0d8;
    --green:#1E8E3E; --red:#C0392B; --amber:#C77D17; --blue:#2b6cb0;
    --shadow:0 1px 3px rgba(31,41,51,.08),0 1px 2px rgba(31,41,51,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Aptos','Segoe UI',Calibri,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;padding:18px 26px}
  header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px}
  header p{margin:3px 0 0;font-size:13px;opacity:.92}
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px 60px}
  nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
      display:flex;gap:2px;overflow-x:auto;padding:0 10px;box-shadow:var(--shadow)}
  nav button{background:none;border:0;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);
      cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button.active{color:var(--teal-d);border-bottom-color:var(--teal)}
  section{display:none;padding-top:22px}
  section.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  h2.sec{font-size:17px;margin:6px 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:5px;line-height:1.1}
  .kpi .sub{font-size:12px;margin-top:4px;color:var(--muted)}
  .up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:880px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h3{margin:0 0 2px;font-size:14px}
  .card .note{margin:0 0 12px;font-size:12px;color:var(--muted)}
  .chartbox{position:relative;height:300px}
  .chartbox.sm{height:240px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--teal);color:#fff;font-weight:600;position:sticky;top:0}
  tbody tr:hover{background:#faf8f4}
  .tablewrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.g{background:#e6f4ea;color:var(--green)}.pill.r{background:#fce8e6;color:var(--red)}
  .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .icard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
  .icard.risk{border-left-color:var(--red)}.icard.win{border-left-color:var(--green)}.icard.watch{border-left-color:var(--amber)}
  .icard .tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .icard.risk .tag{color:var(--red)}.icard.win .tag{color:var(--green)}.icard.watch .tag{color:var(--amber)}
  .icard h4{margin:4px 0 6px;font-size:14.5px}
  .icard p{margin:0;font-size:13px;color:#374151;line-height:1.5}
  .wf{counter-reset:wf}
  .wf li{margin:0 0 10px;font-size:13.5px;line-height:1.5;padding-left:6px}
  .wf li b{color:var(--teal-d)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:24px}
  .badge{display:inline-block;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px;font-size:11.5px;margin-top:8px}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;box-shadow:var(--shadow)}
  nav{position:static;box-shadow:none}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;
      padding:10px 14px;border-top:1px solid var(--line);background:#fbfaf7}
  .filterbar .fl{display:flex;flex-direction:column;gap:2px}
  .filterbar .fl span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .filterbar select{font-family:inherit;font-size:12.5px;color:var(--ink);background:#fff;
      border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:104px;max-width:180px}
  .filterbar select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .fbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--teal);
      border:0;border-radius:8px;padding:8px 14px;cursor:pointer;align-self:flex-end}
  .fbtn:hover{background:var(--teal-d)}
  .fbtn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
  .fcount{font-size:12px;color:var(--muted);align-self:center;margin-left:auto}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:#e6f4ef;color:var(--teal-d);
      border:1px solid #bfe3d6;border-radius:16px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip b{cursor:pointer}
  .repbanner{background:#fff7e6;border:1px solid #f0d8a8;color:#8a5a00;border-radius:10px;
      padding:9px 13px;font-size:12.5px;margin:0 0 14px}
  .drill{cursor:pointer;border-bottom:1px dashed var(--teal-d)}
  .drill:hover{color:var(--teal-d);font-weight:700}
  .drillhint{font-size:11px;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Modern Trade Leadership Dashboard</h1>
  <p id="hSub">Honasa / Mamaearth — Primary · Offtake · P&amp;L · Category &amp; Pack · Forecast · Promo · Market Share · Distribution</p>
  <span class="badge" id="hPeriod"></span>
</header>
<div class="topbar">
  <nav id="nav"></nav>
  <div id="filterbar" class="filterbar"></div>
</div>
<div class="wrap">
  <section id="tab-explorer"></section>
  <section id="tab-overview"></section>
  <section id="tab-primary"></section>
  <section id="tab-offtake"></section>
  <section id="tab-pnl"></section>
  <section id="tab-category"></section>
  <section id="tab-forecast"></section>
  <section id="tab-promo"></section>
  <section id="tab-share"></section>
  <section id="tab-distribution"></section>
  <section id="tab-comparison"></section>
  <section id="tab-insights"></section>
</div>
<footer id="foot"></footer>

<script src="data.js?v=20260703-3"></script>
<script>
const D = window.DASH;
const C = {teal:'#2D9B7F',teald:'#1f7a63',blue:'#2b6cb0',amber:'#C77D17',red:'#C0392B',
           green:'#1E8E3E',grey:'#9aa4ad',purple:'#6b5b95',sand:'#cbb994'};
const PAL=[C.teal,C.blue,C.amber,C.purple,C.green,C.red,C.sand,C.grey];
Chart.defaults.font.family="'Aptos','Segoe UI',Calibri,sans-serif";
Chart.defaults.font.size=12; Chart.defaults.color='#475467';
Chart.defaults.plugins.legend.labels.boxWidth=12;
Chart.defaults.plugins.legend.labels.usePointStyle=true;
Chart.defaults.maintainAspectRatio=false;

const cr = v => v==null?'–':(v/100).toLocaleString('en-IN',{maximumFractionDigits:1});
const crc = v => '₹'+cr(v)+' Cr';
const pct = v => v==null?'–':(v>0?'+':'')+v.toFixed(1)+'%';
const num = v => v==null?'–':Math.round(v).toLocaleString('en-IN');
const cls = v => v==null?'':(v>=0?'up':'down');
const arrow = v => v==null?'':(v>=0?'▲':'▼');
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

function kpi(lab,val,sub){return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}
function card(title,note,inner,extraCls){return `<div class="card"><h3>${title}</h3>${note?`<p class="note">${note}</p>`:''}${inner}</div>`;}
function cv(id,sm){return `<div class="chartbox${sm?' sm':''}"><canvas id="${id}"></canvas></div>`;}

let charts=[];
function destroyCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }
// shared click-to-drill: any chart passed an onClick(label) callback gets a
// pointer cursor + a click handler that resolves the clicked label and drills.
function _drillOpts(onClick){
  return onClick ? {onClick:(e,els,chart)=>{if(els.length) onClick(chart.data.labels[els[0].index]);},
    onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default';}} : {};
}
function mkBar(id,labels,datasets,opts={},onClick){
  charts.push(new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets},
    options:Object.assign({plugins:{legend:{display:datasets.length>1,position:'top'},
      tooltip:{callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${opts.money===false?num(c.parsed.y??c.parsed.x):crc(c.parsed.y??c.parsed.x)}`}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>opts.money===false?num(v):'₹'+cr(v)}},
              x:{grid:{display:false}}}},_drillOpts(onClick),opts.cfg||{})}));
}
function mkBarH(id,labels,data,color,money=true,onClick){
  charts.push(new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets:[{data,backgroundColor:color||C.teal,borderRadius:4}]},
    options:Object.assign({indexAxis:'y',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>money?crc(c.parsed.x):num(c.parsed.x)}}},
      scales:{x:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>money?'₹'+cr(v):num(v)}},y:{grid:{display:false}}}},_drillOpts(onClick))}));
}
function mkLine(id,labels,datasets,onClick){
  charts.push(new Chart(document.getElementById(id),{type:'line',
    data:{labels,datasets:datasets.map((d,i)=>Object.assign({borderColor:PAL[i],backgroundColor:PAL[i]+'22',
      tension:.32,borderWidth:2.4,pointRadius:2,fill:d.fill??false,borderDash:d.dash||[]},d))},
    options:Object.assign({plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${crc(c.parsed.y)}`}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>'₹'+cr(v)}},x:{grid:{display:false}}}},_drillOpts(onClick))}));
}
function mkDonut(id,labels,data,money=true,onClick){
  charts.push(new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:PAL,borderColor:'#fff',borderWidth:2}]},
    options:Object.assign({cutout:'58%',plugins:{legend:{position:'right'},
      tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);
        return `${c.label}: ${money?crc(c.parsed):num(c.parsed)} (${(c.parsed/t*100).toFixed(0)}%)`;}}}}},_drillOpts(onClick))}));
}

/* ---------------- OVERVIEW ---------------- */
function buildOverview(){
  const p=D.primary,o=D.offtake,f=D.forecast,u=D.universe;
  const s=document.getElementById('tab-overview');
  const fy=fyKey(), isTY=/TY target/i.test(f.method||'');
  const yrLab={fy25:'FY25',fy26:'FY26'};
  const primOk=fy!=='fy27', offOk=fy!=='fy27';
  let chains=p.by_chain, brands=p.by_brand, channels=p.by_channel;
  if(F.Chain) chains=chains.filter(c=>c.name===F.Chain);
  if(F.Brand) brands=brands.filter(b=>b.name===F.Brand);
  if(F.Channel) channels=channels.filter(c=>c.name===F.Channel);
  const primYr=fy&&primOk?fy:'fy26', offYr=fy&&offOk?fy:'fy26';
  const dimNote=dimUnsupportedNote(['Category','SubCategory','Range','PackSize','Article'],'the Overview aggregates (see Category & Pack)');
  s.innerHTML = `<h2 class="sec">Executive Overview</h2>
   <p class="lead">${fy?`${yrLab[fy]||F.FY} (filtered)`:D.meta.period} · Modern Trade · All values ₹ Crore unless noted.</p>
   ${dimNote}
   <div class="kpis">
     ${primOk? kpi(`Primary NSV (${yrLab[primYr]})`,crc(chains.reduce((a,c)=>a+(c[primYr]||0),0)),fy?'filtered scope':`<span class="${cls(p.yoy)}">${arrow(p.yoy)} ${pct(p.yoy)} YoY</span> vs ${crc(p.nsv_fy25)}`)
       : kpi('Primary NSV','No FY27 actuals',`use ${yrLab.fy26} or see Forecast`)}
     ${offOk? kpi(`Offtake (${yrLab[offYr]})`,crc(o['total_'+offYr]||0),fy?'filtered scope':`<span class="${cls(o.yoy)}">${arrow(o.yoy)} ${pct(o.yoy)} YoY</span> sell-out`)
       : kpi('Offtake','No FY27 actuals','use FY26 or see Forecast')}
     ${kpi('Active MT Stores',num(u.active_stores),`${num(u.total_stores)} in universe`)}
     ${kpi('Chains Tracked',chains.length,`${p.n_brands} brands${F.Chain?' · filtered':''}`)}
     ${kpi(isTY?'FY27 (TY) Target':'FY27 Forecast',crc(f.fy27_forecast),
       isTY?'business TY target':`@ ${f.growth_assumption_pct}% planning growth`)}
   </div>
   <div class="grid g2">
     ${card('Primary vs Offtake — monthly trend (FY24-25 → FY25-26)','Sell-in (primary) tracks sell-out (offtake); gaps flag inventory build-up or refill need. <span class="drillhint">Click a chain/channel/brand chart on any tab to filter this view.</span>',cv('ovTrend'))}
     ${card(`Channel split (${yrLab[primYr]} primary)`,'MT is the core; EB2B &amp; SIS are emerging. · click to drill',cv('ovChannel',true))}
   </div>
   <div class="grid g2">
     ${card(`Top chains by primary NSV (${yrLab[primYr]})`,'click a bar to drill',cv('ovChains'))}
     ${card(`Brand portfolio mix (${yrLab[primYr]} primary)`,'click to drill',cv('ovBrand',true))}
   </div>`;
  mkLine('ovTrend',o.months,[
    {label:'Offtake (sell-out)',data:o.monthly,borderColor:C.amber,backgroundColor:C.amber+'22'},
    {label:'Primary FY25-26',data:[...Array(12).fill(null),...p.monthly_fy26],borderColor:C.teal,backgroundColor:C.teal+'22'},
    {label:'Primary FY24-25',data:[...p.monthly_fy25,...Array(12).fill(null)],borderColor:C.blue,dash:[5,4]},
  ]);
  mkDonut('ovChannel',channels.map(c=>c.name),channels.map(c=>c[primYr]),true,v=>drillTo('Channel',v));
  const tc=chains.slice(0,8);
  mkBarH('ovChains',tc.map(c=>c.name),tc.map(c=>c[primYr]),C.teal,true,v=>drillTo('Chain',v));
  const bb=brands.filter(b=>(b[primYr]||0)>1);
  mkDonut('ovBrand',bb.map(b=>b.name),bb.map(b=>b[primYr]),true,v=>drillTo('Brand',v));
}

/* ---------------- PRIMARY ---------------- */
function buildPrimary(){
  const p=D.primary,s=document.getElementById('tab-primary'),qc=D.chain_allocation_qc;
  if(fyUnsupported()){ s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>${fyNoDataNote('the Primary source (Primary_FY202426_10.xlsx)')}`; return; }
  const fy=fyKey(), yrs=fy?[fy]:['fy25','fy26'], last=yrs[yrs.length-1], yrLab={fy25:'FY25',fy26:'FY26'};
  let chains=p.by_chain, zones=p.by_zone, brands=p.by_brand, channels=p.by_channel;
  if(F.Chain) chains=chains.filter(c=>c.name===F.Chain);
  if(F.Zone) zones=zones.filter(z=>z.name===F.Zone);
  if(F.Brand) brands=brands.filter(b=>b.name===F.Brand);
  if(F.Channel) channels=channels.filter(c=>c.name===F.Channel);
  let mLabels=p.month_labels, m25=p.monthly_fy25, m26=p.monthly_fy26;
  if(F.Month){
    const i=p.month_labels.indexOf(F.Month);
    if(i>=0){ mLabels=[F.Month]; m25=[p.monthly_fy25[i]]; m26=[p.monthly_fy26[i]]; }
  }
  const rows=chains.filter(c=>c[last]>0).map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${cr(c.fy25)}</td><td>${cr(c.fy26)}</td>
     <td><span class="pill ${c.yoy>=0?'g':'r'}">${pct(c.yoy)}</span></td></tr>`).join('');
  const qcNote=qc?`<p class="note" style="margin:0 0 16px">
     <b>Chain-level, not distributor-level:</b> Distributor-billed primary is split across the
     chains each ship-to actually serves, weighted by that chain's share of the ship-to's own
     secondary/offtake billing (same method as the Power BI model's Ship-to allocation) —
     ${qc.allocated_coverage_pct}% of Distributor primary (${crc(qc.chain_allocated_total)})
     is allocated this way; the remainder (no matching Ship-To × Brand × Month allocation entry,
     mainly FY24-25) keeps its original single-chain tag.</p>`:'';
  const dimNote=dimUnsupportedNote(['Category','SubCategory','Range','PackSize','Article'],'this source (see the Category & Pack tab for those)');
  s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>
   <p class="lead">Billed NSV from Honasa to MT chains. ${fy?`${yrLab[fy]} only (filtered).`:'FY24-25 vs FY25-26, ₹ Crore.'}</p>
   ${dimNote}
   ${qcNote}
   <div class="kpis">
     ${fy? kpi(`Primary NSV ${yrLab[fy]}`,crc(chains.reduce((a,c)=>a+(c[fy]||0),0)),F.Chain||F.Zone||F.Brand||F.Channel?'filtered scope':'') :
       kpi('Primary NSV FY26',crc(p.nsv_fy26),`<span class="${cls(p.yoy)}">${arrow(p.yoy)} ${pct(p.yoy)}</span> YoY`)}
     ${!fy? kpi('Primary NSV FY25',crc(p.nsv_fy25),'base year') :
       kpi('Gross MRP Value',crc(p.mrp_fy26),'FY26 MRP basis (MRP not split by FY25/27)')}
     ${!fy? kpi('Gross MRP Value FY26',crc(p.mrp_fy26),'at MRP basis') : ''}
     ${kpi('Active Chains',chains.filter(c=>c[last]>0).length,`${p.n_brands} brands`)}
   </div>
   <div class="grid g2">
     ${card('Monthly NSV — FY24-25 vs FY25-26'+(F.Month?` (filtered to ${F.Month})`:''),'Calendar-aligned Apr→Mar. Click a month to drill.',cv('prMonth'))}
     ${card('By zone'+(fy?` (${yrLab[fy]})`:' (FY25 vs FY26)'),'click to drill',cv('prZone',true))}
   </div>
   <div class="grid g2">
     ${card('By channel'+(fy?` (${yrLab[fy]})`:''),'click to drill',cv('prChan',true))}
     ${card('By brand'+(fy?` (${yrLab[fy]})`:' (FY26)'),'click to drill',cv('prBrand',true))}
   </div>
   ${card(`Chain-wise primary &amp; YoY (${yrLab[last]})`,'Sorted by NSV — chain-level (secondary-allocated for Distributor primary), not distributor-name-wise. Click a chain to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>Chain</th><th>FY25 (₹Cr)</th><th>FY26 (₹Cr)</th><th>YoY</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No chains for this filter.</td></tr>'}</tbody></table></div>`)}`;
  wireDrillLinks(s);
  mkLine('prMonth',mLabels,[
    {label:'FY24-25',data:m25,borderColor:C.blue,dash:[5,4]},
    {label:'FY25-26',data:m26,borderColor:C.teal,backgroundColor:C.teal+'22',fill:true}],v=>drillTo('Month',v));
  if(fy){
    mkBarH('prZone',zones.map(z=>z.name),zones.map(z=>z[fy]),C.teal,true,v=>drillTo('Zone',v));
  } else {
    mkBar('prZone',zones.map(z=>z.name),[
      {label:'FY25',data:zones.map(z=>z.fy25),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:'FY26',data:zones.map(z=>z.fy26),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo('Zone',v));
  }
  mkDonut('prChan',channels.map(c=>c.name),channels.map(c=>c[last]),true,v=>drillTo('Channel',v));
  const bb=brands.filter(b=>b[last]>0.5);
  mkBarH('prBrand',bb.map(b=>b.name),bb.map(b=>b[last]),C.purple,true,v=>drillTo('Brand',v));
}

/* ---------------- OFFTAKE ---------------- */
function buildOfftake(){
  const o=D.offtake,p=D.primary,s=document.getElementById('tab-offtake');
  if(fyUnsupported()){ s.innerHTML=`<h2 class="sec">Offtake (Sell-out)</h2>${fyNoDataNote('the Offtake master file')}`; return; }
  const fy=fyKey();                       // null = both years, else 'fy25'/'fy26'
  const yrs=fy?[fy]:['fy25','fy26'];
  const yrLab={fy25:'FY25',fy26:'FY26'};
  let zones=o.by_zone, states=o.by_state, chains=o.by_chain;
  if(F.Zone){ zones=zones.filter(z=>z.name===F.Zone); states=states.filter(r=>r.zone===F.Zone); }
  if(F.Chain){ chains=chains.filter(c=>c.name===F.Chain); }
  const mAbbr=m=>String(m).slice(0,3).toLowerCase();
  let months=o.months, monthly=o.monthly;
  // o.months are "Apr-24".."Mar-26" (3-letter abbrev + 2-digit year); F.Month
  // is a full month name ("April".."March") from the article-level detail --
  // match on the first 3 letters, and only within whichever FY is selected.
  const mIdx=o.months.map((m,i)=>i).filter(i=>{
    if(F.Month && mAbbr(o.months[i])!==mAbbr(F.Month)) return false;

/* ---------------- PERFORMANCE & COMPARISON ---------------- */
// One tab to rank/compare Chain, Brand, Sub-category, Range, Pack Size or
// Article side by side (FY-over-FY, YoY, contribution %) instead of hunting
// across separate tabs. Chain/Brand come from the chain-allocated Primary
// source (FY25 vs FY26); Sub-category/Range/Pack Size/Article come from the
// article-level detail (REC), which only spans FY26/FY27 -- so the year
// pair shown adapts to whichever two FYs are actually present for that
// dimension.
let cmpDim='Chain';
function buildComparison(){
  const s=document.getElementById('tab-comparison');
  const dims=['Chain','Brand','SubCategory','Range','PackSize','Article'];
  const dimLab={Chain:'Chain',Brand:'Brand',SubCategory:'Sub-category',Range:'Range',PackSize:'Pack Size',Article:'Article'};
  const btns=dims.map(d=>`<button class="fbtn ${d===cmpDim?'':'ghost'}" data-dim="${d}" style="margin:0 8px 10px 0">${dimLab[d]}</button>`).join('');
  const active=activeChipsHtml();

  let rows, yrPair, source;
  if(cmpDim==='Chain'||cmpDim==='Brand'){
    if(fyUnsupported()){
      s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2><div style="margin:0 0 14px">${btns}</div>${fyNoDataNote('the chain/brand Primary source')}`;
      wireCmpButtons(s); return;
    }
    source='Primary (chain-level, secondary-allocated for Distributors)';
    const arr=cmpDim==='Chain'?D.primary.by_chain:D.primary.by_brand;
    rows=arr.filter(x=>(x.fy26||0)>0||(x.fy25||0)>0).map(x=>({name:x.name,a:x.fy25,b:x.fy26,yoy:x.yoy}));
    yrPair=['FY25','FY26'];
  } else {
    source='article-level primary detail (File 2)';
    const recs=recFilter(cmpDim);   // ignore this dimension's own filter so you can still compare across it
    const fys=[...new Set(recs.map(r=>r.FY))].sort();
    const [fyA,fyB]=fys.length>=2?[fys[fys.length-2],fys[fys.length-1]]:[null,fys[0]];
    const m={};
    recs.forEach(r=>{ (m[r[cmpDim]]??={})[r.FY]=(m[r[cmpDim]]?.[r.FY]||0)+r.NSV; });
    rows=Object.entries(m).map(([name,v])=>{
      const a=fyA?(v[fyA]||0):null, b=v[fyB]||0;
      return {name, a, b, yoy:(a?Math.round((b/a-1)*1000)/10:null)};
    });
    yrPair=[fyA||'–',fyB||'–'];
  }
  rows.sort((a,b)=>(b.b||0)-(a.b||0));
  const tot=rows.reduce((s2,r)=>s2+(r.b||0),0)||1;
  const top=rows.slice(0,15);
  const tableRows=top.map(r=>`<tr><td>${drillLink(cmpDim,r.name)}</td><td>${r.a!=null?cr(r.a):'–'}</td><td>${cr(r.b)}</td>
    <td>${r.yoy!=null?`<span class="pill ${r.yoy>=0?'g':'r'}">${pct(r.yoy)}</span>`:'–'}</td>
    <td>${(r.b/tot*100).toFixed(1)}%</td></tr>`).join('');
  const partialNote=(yrPair[1]==='FY27')?`<p class="drillhint" style="margin:4px 0 0">FY27 is a partial year
     (Apr'26 onward only) — YoY vs a full FY26 will read sharply negative even where the run-rate is flat or
     growing. Compare monthly averages, not full-year totals, for a fair read.</p>`:'';
  s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2>
   <p class="lead">Rank and compare ${dimLab[cmpDim]} performance. Source: ${source}.</p>
   ${partialNote}
   <div style="margin:0 0 14px">${btns}</div>
   ${active?`<div style="margin:0 0 14px">${active}</div>`:''}
   <div class="kpis">
     ${kpi(`${dimLab[cmpDim]}s Compared`,rows.length,'')}
     ${kpi(`Top ${dimLab[cmpDim]}`,top[0]?top[0].name:'–',top[0]?crc(top[0].b):'')}
     ${kpi(`Total (${yrPair[1]})`,crc(tot),'')}
   </div>
   ${card(`${dimLab[cmpDim]} — ${yrPair[0]} vs ${yrPair[1]}`,'click a bar to drill',cv('cmpChart'))}
   ${card(`${dimLab[cmpDim]} ranked comparison (top 15)`,'Click a name to drill.',`<div class="tablewrap"><table><thead><tr>
     <th>${dimLab[cmpDim]}</th><th>${yrPair[0]} (₹Cr)</th><th>${yrPair[1]} (₹Cr)</th><th>YoY</th><th>Contribution</th>
     </tr></thead><tbody>${tableRows||'<tr><td colspan="5">No records for this filter.</td></tr>'}</tbody></table></div>`)}`;
  wireDrillLinks(s);
  wireChips(s,buildComparison);
  wireCmpButtons(s);
  if(top.length){
    mkBar('cmpChart',top.map(r=>r.name),[
      {label:yrPair[0],data:top.map(r=>r.a||0),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:yrPair[1],data:top.map(r=>r.b||0),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo(cmpDim,v));
  }
}
function wireCmpButtons(root){
  root.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{
    cmpDim=b.dataset.dim; destroyCharts(); buildComparison();
  });
}

const REC = D.detail_records||[];
const FILT=[['FY','FY'],['Month','Month'],['Channel','Channel'],['Zone','Zone'],['Chain','Chain'],
  ['Brand','Brand'],['Category','Category'],['SubCategory','Sub-category'],['Range','Range'],
  ['PackSize','Pack Size'],['Article','Article']];
const MORDER=(D.primary&&D.primary.month_labels)||['April','May','June','July','Aug','Sept','Oct','Nov','Dec','Jan','Feb','March'];
const F={}; FILT.forEach(([k])=>F[k]='');

// records passing all active filters (optionally ignoring one key for cascading options)
function recFilter(except){
  return REC.filter(r=>FILT.every(([k])=> k===except || !F[k] || String(r[k])===String(F[k]) ));
}
// FY dropdown: fixed at FY25/FY26/FY27, not just whatever REC (File 2's
// article-level detail, which only carries FY26-27) happens to contain --
// FY25 lives in the pre-aggregated Primary/Offtake/P&L blocks, so it must
// stay selectable even though the Explorer/Category&Pack (REC-driven) view
// will correctly show 0 records for it.
const FY_ALL=['FY25','FY26','FY27'];
function optsFor(key){
  if(key==='FY') return FY_ALL;
  const vals=[...new Set(recFilter(key).map(r=>r[key]))];
  if(key==='Month') vals.sort((a,b)=>MORDER.indexOf(a)-MORDER.indexOf(b));
  else vals.sort((a,b)=>String(a).localeCompare(String(b)));
  return vals;
}
function renderFilterBar(){
  const fb=document.getElementById('filterbar');
  const anyActive=FILT.some(([k])=>F[k]);
  fb.innerHTML = FILT.map(([k,lab])=>{
    const opts=optsFor(k), cur=F[k];
    return `<label class="fl"><span>${lab}</span><select data-k="${k}">
      <option value="">All</option>
      ${opts.map(v=>{const s=String(v).replace(/"/g,'&quot;');return `<option value="${s}" ${String(v)===String(cur)?'selected':''}>${v}</option>`;}).join('')}
    </select></label>`;
  }).join('')
  + `<button class="fbtn ghost" id="fReset">↺ Reset filters</button>`
  + `<span class="fcount" id="fCount">${anyActive?'Filtered · ':''}${num(recFilter().length)} records</span>`;
  fb.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{F[sel.dataset.k]=sel.value;onFilterChange();});
  document.getElementById('fReset').onclick=()=>{FILT.forEach(([k])=>F[k]='');onFilterChange();};
}
function onFilterChange(){ renderFilterBar(); show(currentTab||'overview'); }

// cross-tab drill-down: click any chart bar/segment/table-row on ANY tab to
// set that one filter and re-render the SAME tab narrowed to it -- drilling
// into "Dmart" on the Primary tab shows Dmart's own Primary view, not a jump
// to a different tab. The Data Explorer tab is still there whenever you want
// the raw row-level records for whatever's currently filtered.
function drillTo(key,value){
  if(!FILT.some(([k])=>k===key) || value==null) return;
  F[key]=String(value);
  onFilterChange();
}
function drillLink(key,label){
  return `<span class="drill" data-k="${key}" data-v="${String(label).replace(/"/g,'&quot;')}" title="Filter this view to ${label}">${label}</span>`;
}
function wireDrillLinks(root){
  root.querySelectorAll('.drill').forEach(el=>el.onclick=()=>drillTo(el.dataset.k, el.dataset.v));
}
// active-filter chips, reusable on any tab that reads recFilter() live (Explorer,
// Category & Pack, Performance & Comparison). rebuildFn re-renders the CURRENT
// tab in place when a chip is removed, instead of jumping to Explorer.
function activeChipsHtml(){
  return FILT.filter(([k])=>F[k]).map(([k,lab])=>
    `<span class="fchip">${lab}: ${F[k]} <b data-k="${k}" title="clear">✕</b></span>`).join(' ');
}
function wireChips(root,rebuildFn){
  root.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{
    F[b.dataset.k]='';
    renderFilterBar();
    destroyCharts();
    (rebuildFn||buildExplorer)();
  });
}
// unique rows by `key` (sums NSV/MRP/Qty across whatever else varies -- e.g.
// unique articles summed across every chain/month, instead of the same
// article appearing once per chain/month row). First-seen value is kept for
// any other displayed columns (category/sub-cat/pack).
function uniqueBy(recs,key,cols){
  const m={};
  recs.forEach(r=>{
    const k=r[key];
    if(!m[k]){ m[k]={[key]:k,NSV:0,MRP:0,Qty:0}; (cols||[]).forEach(c=>m[k][c]=r[c]); }
    m[k].NSV+=r.NSV; m[k].MRP+=r.MRP||0; m[k].Qty+=r.Qty||0;
  });
  return Object.values(m).sort((a,b)=>b.NSV-a.NSV);
}
// per-brand 95%-of-brand-NSV Pareto: within each brand, keep sub-categories
// (sorted desc) until cumulative NSV crosses 95% of that brand's total;
// everything past that point is relabelled "Other" for that brand, THEN
// summed across all brands into the final SubCategory buckets. So a
// sub-category stays named if it's a material contributor for at least one
// brand, even if the combined "Other" bucket (all brands' long tails) ends
// up large.
function subcatPareto95(recs){
  const byBrand={};
  recs.forEach(r=>{ (byBrand[r.Brand]??=[]).push(r); });
  const out={};
  Object.values(byBrand).forEach(rows=>{
    const bySub={};
    rows.forEach(r=>{ bySub[r.SubCategory]=(bySub[r.SubCategory]||0)+r.NSV; });
    const total=Object.values(bySub).reduce((a,b)=>a+b,0)||1;
    const sorted=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
    let cum=0;
    sorted.forEach(([sub,val])=>{
      const label=(cum/total<0.95)?sub:'Other';
      out[label]=(out[label]||0)+val;
      cum+=val;
    });
  });
  return Object.entries(out).sort((a,b)=>b[1]-a[1]);
}

// ---- FY/Month filter-awareness for tabs backed by PRE-AGGREGATED blocks ----
// (D.primary, D.offtake, D.pnl, D.universe, D.promo) which only carry FY25 vs

}

let expCharts=[];
function expDestroy(){expCharts.forEach(c=>c.destroy());expCharts=[];}
function grp(recs,key){const m={};recs.forEach(r=>m[r[key]]=(m[r[key]]||0)+r.NSV);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function expBarH(id,key,entries){

      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>crc(c.parsed.x)}}},
      scales:{x:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>'₹'+cr(v)}},y:{grid:{display:false}}}}}));
}
function expDonut(id,key,entries){
  const labels=entries.map(e=>e[0]),data=entries.map(e=>e[1]);
  expCharts.push(new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:PAL,borderColor:'#fff',borderWidth:2}]},
    options:{cutout:'58%',onClick:(e,els)=>{if(els.length){F[key]=labels[els[0].index];onFilterChange();}},
      plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);
        return `${c.label}: ${crc(c.parsed)} (${(c.parsed/t*100).toFixed(0)}%)`;}}}}}}));
}
function expLine(id,recs){
  const m={};recs.forEach(r=>m[r.Month]=(m[r.Month]||0)+r.NSV);
  const labels=MORDER.filter(x=>x in m),data=labels.map(x=>m[x]);

    options:{onClick:(e,els)=>{if(els.length){F.Month=labels[els[0].index];onFilterChange();}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>crc(c.parsed.y)}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>'₹'+cr(v)}},x:{grid:{display:false}}}}}));
}
function buildExplorer(){
  expDestroy();
  const recs=recFilter();
  const s=document.getElementById('tab-explorer');
  const nsv=recs.reduce((a,r)=>a+r.NSV,0),mrp=recs.reduce((a,r)=>a+r.MRP,0),qty=recs.reduce((a,r)=>a+r.Qty,0);

  const rep=(D.detail_meta&&D.detail_meta.representative)
    ? `<div class="repbanner"><b>Representative data.</b> Drill-down runs on <code>detail_records</code> whose Chain/Brand/Zone/Channel/Month/FY totals match the real primary; Category, Sub-category, Pack Size and Article are taxonomy placeholders until the granular source feeds <code>build_dashboard_data.py</code>.</div>` : '';
  const cap=400, shown=recs.slice(0,cap);
  const trows=shown.map(r=>`<tr><td>${r.Month}</td><td>${r.FY}</td><td>${r.Channel}</td><td>${r.Zone}</td>
     <td>${r.Chain}</td><td>${r.Brand}</td><td>${r.Category}</td><td>${r.SubCategory}</td><td>${r.Range}</td><td>${r.PackSize}</td>
     <td>${r.Article}</td><td>${cr(r.NSV)}</td><td>${cr(r.MRP)}</td><td>${num(r.Qty)}</td></tr>`).join('');
  // SIS channel check — always the SIS slice (ignores the Channel filter, respects the others)
  const isRep=!!(D.detail_meta&&D.detail_meta.representative);
  const ct=(D.detail_meta&&D.detail_meta.channel_totals)||null;
  // Prefer the EXACT channel_totals (computed from the full un-capped source)
  // over summing detail_records, since detail_records may be capped for size.
  // Dedicated 2-decimal formatters for this card so Lakh/Cr always align exactly
  // (e.g. Rs 250.17 L = Rs 2.50 Cr, Rs 236 L = Rs 2.36 Cr, Gap = Rs 14.16 L).
  const lac2=v=>'₹'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' L';
  const cr2=v=>'₹'+(v/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' Cr';
  let sis26;
  if (ct && !isRep){
    sis26=(ct.FY26&&ct.FY26.SIS)||0;
  } else {
    const sisR=recFilter('Channel').filter(r=>String(r.Channel).toUpperCase()==='SIS');
    sis26=sisR.filter(r=>r.FY==='FY26').reduce((a,r)=>a+r.NSV,0);
  }
  // SIS FY26 Primary — final confirmed figure only. Full investigation /
  // audit trail (superseded reference values, resolution record) lives in
  // PowerBI/docs/SIS_Reconciliation.md, not on the live dashboard.
  const sisCard=isRep?'':card('SIS — Primary (FY26)','',
    `<div class="val" style="font-size:24px">${cr2(sis26)}</div><div class="sub">${lac2(sis26)}</div>`);

  s.innerHTML=`<h2 class="sec">Data Explorer</h2>
   <p class="lead">Filter, drill down and click any chart to slice. All cards, charts and the table below update live. Values ₹ Crore unless noted.</p>
   ${rep}
   ${active?`<div style="margin:0 0 14px">${active}</div>`:''}
   <div class="kpis">
     ${kpi('NSV (filtered)',crc(nsv),`${num(recs.length)} records`)}
     ${kpi('MRP Value',crc(mrp),'gross basis')}
     ${kpi('Quantity',num(qty),'units')}
     ${kpi('Realisation',mrp?((nsv/mrp)*100).toFixed(0)+'%':'–','NSV ÷ MRP')}
   </div>
   ${sisCard}
   <div class="grid g2">
     ${card('NSV by Chain — click to filter','',cv('exChain'))}
     ${card('NSV by Brand — click to filter','',cv('exBrand',true))}
   </div>
   <div class="grid g3">
     ${card('By Category','',cv('exCat',true))}
     ${card('By Channel','',cv('exChan',true))}
     ${card('By Zone','',cv('exZone',true))}
   </div>
   ${card('NSV by Month (Apr→Mar) — click to filter','',cv('exMonth'))}
   ${card(`Detail records${recs.length>cap?` — showing first ${cap} of ${num(recs.length)}`:` (${num(recs.length)})`}`,'Reflects all active filters.',
     `<div style="margin:-4px 0 10px"><button class="fbtn ghost" id="exExport">⭳ Export filtered CSV</button></div>
      <div class="tablewrap"><table><thead><tr>
      <th>Month</th><th>FY</th><th>Channel</th><th>Zone</th><th>Chain</th><th>Brand</th><th>Category</th>
      <th>Sub-cat</th><th>Range</th><th>Pack</th><th>Article</th><th>NSV(₹Cr)</th><th>MRP(₹Cr)</th><th>Qty</th>
      </tr></thead><tbody>${trows||'<tr><td colspan="14">No records for this filter.</td></tr>'}</tbody></table></div>`)}`;
  if(recs.length){
    expBarH('exChain','Chain',grp(recs,'Chain').slice(0,12));
    expDonut('exBrand','Brand',grp(recs,'Brand'));
    expDonut('exCat','Category',grp(recs,'Category'));
    expDonut('exChan','Channel',grp(recs,'Channel'));
    expDonut('exZone','Zone',grp(recs,'Zone'));
    expLine('exMonth',recs);
  }
  s.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{F[b.dataset.k]='';onFilterChange();});
  const ex=document.getElementById('exExport'); if(ex) ex.onclick=()=>exportCSV(recs);
}
function exportCSV(recs){
  const cols=['Month','FY','Channel','Zone','Chain','Brand','Category','SubCategory','Range','PackSize','Article','NSV','MRP','Qty'];
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[cols.join(',')].concat(recs.map(r=>cols.map(c=>esc(r[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='mt_detail_filtered.csv';a.click();
}

  ['pnl','P&L'],['category','Category & Pack'],['forecast','Forecast'],['promo','Promo & Trade Spend'],
  ['share','Market Share'],['distribution','Distribution'],['comparison','Performance & Comparison'],

  pnl:buildPnl,category:buildCategory,forecast:buildForecast,promo:buildPromo,share:buildShare,
  distribution:buildDistribution,comparison:buildComparison,insights:buildInsights};
let currentTab='overview';
function show(id){
  currentTab=id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
  document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id==='tab-'+id));
  // every tab always rebuilds from the CURRENT filter state (no stale cache) --
  // this is what makes the global FY/Month/Chain/... filter bar apply dashboard-wide,
  // not just on the Data Explorer. Deferred one tick: drillTo() is invoked from
  // INSIDE a Chart.js onClick handler, and destroying that same chart synchronously
  // (before Chart.js finishes its own internal afterEvent/tooltip processing for
  // this click) throws "Cannot read properties of undefined (reading 'handleEvent')".
  // Letting the current event loop turn finish first avoids that.
  setTimeout(()=>{
    destroyCharts();
    BUILD[id]();
    window.scrollTo({top:0,behavior:'smooth'});
  },0);
}

  const nav=document.getElementById('nav');
  TABS.forEach(([id,lab])=>{const b=el('button',null,lab);b.dataset.t=id;b.onclick=()=>show(id);nav.appendChild(b);});
