// Same-period guard for FY-on-FY comparisons built directly from
// detail_records (buildComparison()'s article-level dimension branch).
// Comparing full-FY totals when one side is a partial year (e.g. FY26 full
// 12mo vs FY27 YTD 5mo) reads as an opposite-direction, misleading YoY --
// exactly the failure mode same_period_block() in build_dashboard_data.py
// exists to prevent server-side, just not applied to this client-side path.
// When fyA/fyB cover the same months (including the common full-year vs
// full-year case), this is a no-op: sharedMonths is null and recs pass
// through unchanged. Extracted as its own function so it can be tested with
// fixtures independent of live data (tests/test_fy_same_period_guard.js).
function sameFYPeriodGuard(recs,fyA,fyB){
  if(!fyA) return {recs,sharedMonths:null};
  const monA=new Set(recs.filter(r=>r.FY===fyA).map(r=>r.Month));
  const monB=new Set(recs.filter(r=>r.FY===fyB).map(r=>r.Month));
  const same=monA.size===monB.size&&[...monA].every(mo=>monB.has(mo));
  if(same) return {recs,sharedMonths:null};
  const sharedMonths=new Set([...monA].filter(mo=>monB.has(mo)));
  return {recs:recs.filter(r=>sharedMonths.has(r.Month)),sharedMonths};
}

function computePVMMetrics(){
  // Reads the real article-grain decomposition from D.pvm (pvm_block).
  // This previously returned delta*0.6 / delta*-0.3 / delta*0.7 -- fixed
  // ratios with no analysis behind them, charted under a "Price-Volume-Mix"
  // title. Returns null when D.pvm is absent so the caller can say so rather
  // than draw an invented split.
  const pv=D.pvm; if(!pv||!pv.buckets) return null;
  const by={}; pv.buckets.forEach(b=>{by[b.driver]=b.value;});
  return {
    volume_effect: by['Volume']??0,
    price_effect: by['Price']??0,
    new_effect: by['New articles']??0,
    lost_effect: by['Discontinued']??0,
    total_delta_nsv: pv.delta,
    asp: pv.asp||{},
    recon: pv.reconciliation||{}
  };
}

function computeChannelHealth(){
  // by_chain is an ARRAY on both blocks. This used Object.keys() over it, so
  // every "chain" was an array index ('0','1','2'…) and each row was
  // mislabelled. It also read primary[c]['nsv_'+fy] and offtake[c].total,
  // neither of which exists on these rows -- offtake was therefore always 0,
  // the ratio always 0, and every chain came back "Overstocked".
  // Index by name, use keys that exist, and compare the SAME window on both
  // sides so sell-out vs sell-in is like for like.
  const SP=(D.detail_meta&&D.detail_meta.same_period)||null;
  const fy=fyKey();                                    // 'fy26' | 'fy27' | ''
  const spKey=SP?String(SP.curr_fy).toLowerCase():null;
  const useSP=!!(SP&&SP.by_chain&&(!fy||fy===spKey));   // SP covers the current FY
  const offKey=useSP?spKey:fy;
  const off={};
  ((D.offtake&&D.offtake.by_chain)||[]).forEach(r=>{
    if(!r||r.name==null) return;
    off[r.name]=(offKey&&r[offKey]!=null)?r[offKey]:r.value;
  });
  const pri={};
  if(useSP) SP.by_chain.forEach(r=>{ if(r&&r.name!=null) pri[r.name]=r.curr; });
  else ((D.primary&&D.primary.by_chain)||[]).forEach(r=>{
    if(!r||r.name==null) return;
    pri[r.name]=fy?r[fy]:r.value;
  });
  const names=[...new Set([...Object.keys(pri),...Object.keys(off)])];
  return names.map(c=>{
    const p=pri[c]||0, o=off[c]||0;
    // Both sides must be real before a ratio means anything.
    const ratio=(p>0&&o>0)?o/p:null;
    return{
      chain:c, primary:p, offtake:o, health_ratio:ratio,
      status:ratio==null?'No data':ratio>1.15?'Selling out faster than billed'
             :ratio<0.85?'Billed ahead of sell-out':'Balanced',
      color:ratio==null?'var(--muted)':(ratio>1.15||ratio<0.85)?'var(--amber)':'var(--green)'
    };
  }).filter(x=>x.health_ratio!=null)
    .sort((a,b)=>b.health_ratio-a.health_ratio).slice(0,8);
}

function computeSKUQuadrants(){
  const cat=fOne('Category');
  const recs=REC.filter(r=>(!cat||r.Category===cat));
  if(!recs.length) return[];
  const ros_vals=recs.map(r=>(r.Units||0)/(D.primary?.stores_count||100));
  const margin_vals=recs.map(r=>(r.Gross_Margin_Pct??45));
  const ros_med=ros_vals.sort((a,b)=>a-b)[Math.floor(ros_vals.length/2)]||50;
  const mgn_med=margin_vals.sort((a,b)=>a-b)[Math.floor(margin_vals.length/2)]||45;
  return recs.map(r=>{
    const ros=(r.Units||0)/(D.primary?.stores_count||100);
    const mgn=r.Gross_Margin_Pct??45;
    const q=(ros>=ros_med&&mgn>=mgn_med)?'Q1':(ros>=ros_med)?'Q2':(mgn>=mgn_med)?'Q3':'Q4';
    const colors={Q1:'var(--green)',Q2:'var(--amber)',Q3:'var(--blue)',Q4:'var(--red)'};
    return{sku:r.Article,ros,margin_pct:mgn,quadrant:q,nsv:r.NSV||0,color:colors[q]};
  }).sort((a,b)=>b.nsv-a.nsv).slice(0,50);
}

function generateAnalyticsInsights(){
  const pvm=computePVMMetrics();      // may be null when D.pvm is absent
  const health=computeChannelHealth();
  const insights=[];
  // volume_effect is a RUPEE amount in Lakh. It was previously divided by 1000
  // and printed with a % sign, so a Rs 38.44 Cr volume effect read as "+3.8%".
  if(pvm&&pvm.volume_effect>0){
    const share=pvm.total_delta_nsv?Math.round(pvm.volume_effect/pvm.total_delta_nsv*1000)/10:null;
    insights.push({type:'win',title:'Volume growth',
      text:`Volume added ${crc(pvm.volume_effect)} of the ${crc(pvm.total_delta_nsv)} change`
           +(share!=null?` (${share}% of it)`:'')+`, on the same articles at last year's prices.`});
  }
  if(pvm&&pvm.asp&&pvm.asp.pure_price_change_pct!=null&&pvm.asp.pure_price_change_pct<0){
    insights.push({type:'risk',title:'Realisation slipping on existing range',
      text:`Like-for-like price is ${pct(pvm.asp.pure_price_change_pct)} even though blended ASP is `
           +`${pct(pvm.asp.blended_change_pct)} — the ASP lift is mix and new range, not pricing.`});
  }
  const overstocked=health.filter(h=>h.status==='Overstocked');
  if(overstocked.length>0) insights.push({type:'risk',title:'Inventory Imbalance',text:`${overstocked.length} accounts overstocked; rebalancing needed.`});
  return insights.slice(0,5);
}

function computeForecastAccuracy(){
  // Measured month by month against the target, over the months that have BOTH
  // a target and an actual. This previously read D.forecast.target -- a key that
  // does not exist -- and fell back to a hardcoded 1050 against a full-FY
  // primary total, which is what produced "3% accuracy, -97% bias" on screen.
  const T=D.targets, m=T&&T.measures&&T.measures[T.basis];
  const rows=(m&&m.monthly)||[];
  const pairs=rows.filter(r=>r&&r.actual!=null&&r.target!=null&&r.target!==0);
  if(!pairs.length) return{accuracy:null,wmape:null,bias:null,bias_status:null,
    n_months:0,basis:null,note:'No month has both a target and an actual in this build.'};
  const sumA=pairs.reduce((s,r)=>s+r.actual,0);
  const sumT=pairs.reduce((s,r)=>s+r.target,0);
  const sumE=pairs.reduce((s,r)=>s+Math.abs(r.target-r.actual),0);
  const wmape=sumA?Math.round(sumE/sumA*1000)/10:null;
  const bias=sumA?Math.round((sumT-sumA)/sumA*1000)/10:null;
  return{
    accuracy:wmape==null?null:Math.max(0,Math.round((100-wmape)*10)/10),
    wmape, bias,
    bias_status:bias==null?null:bias>5?'Target set above actual':bias<-5?'Target set below actual':'On plan',
    n_months:pairs.length, basis:T.basis,
    note:`Target vs actual on the ${T.basis} basis, over ${pairs.length} month(s) with both.`
  };
}

function computePORiskSummary(){
  if(!D.po||!D.po.length) return{breach_count:0,penalty_exposure:0,max_aging:0};
  const today=new Date();
  const aging_vals=D.po.map(p=>{
    const po_date=new Date(p.PO_Date);
    return Math.floor((today-po_date)/(1000*86400));
  });
  const breach=aging_vals.filter(a=>a>=7).length;
  const penalty=(breach||0)*50;
  return{breach_count:breach,penalty_exposure:penalty,max_aging:Math.max(...aging_vals,0)};
}

/* ---------------- DATA EXPLORER (drill-down + cascading filters) ---------------- */
const REC = D.detail_records||[];
const FILT=[['FY','FY'],['Month','Month'],['Channel','Channel'],['Zone','Zone'],['State','State'],['Chain','Chain'],
  ['Brand','Brand'],['Category','Category'],['SubCategory','Sub-category'],['Range','Range'],
  ['PackSize','Pack Size'],['Article','Article']];
const MORDER=(D.primary&&D.primary.month_labels)||['April','May','June','July','Aug','Sept','Oct','Nov','Dec','Jan','Feb','March'];
// MULTI-SELECT filter state: each dimension holds an ARRAY of selected values
// (empty = All). Values in a dimension are OR'd together; dimensions are
// AND'd, same as before.
const F={}; FILT.forEach(([k])=>F[k]=[]);
const fOn =k=>F[k].length>0;                                 // dimension filtered at all?
const fHas=(k,v)=>!F[k].length||F[k].includes(String(v));    // does value v pass dimension k?
const fLab=k=>F[k].join(', ');                               // display label ('' when unfiltered)
const fOne=k=>F[k].length===1?F[k][0]:null;                  // exactly-one selection or null

// records passing all active filters (optionally ignoring one key for cascading options)
function recFilter(except){
  return REC.filter(r=>FILT.every(([k])=> k===except || !F[k].length || F[k].includes(String(r[k])) ));
}
// FY dropdown: derived from the data, never hardcoded, so a new FY (FY28+)
// flows in automatically the moment its rows arrive. The pre-aggregated
// Primary/Offtake/P&L blocks carry FY25/FY26 (their source workbook ends
// Mar'26); every FY beyond that window (FY27 today, FY28 tomorrow) lives ONLY
// in the article-wise primary's detail_meta.fyx_primary. FY25 must stay
// selectable even though the Explorer/Category&Pack (REC-driven) view will
// correctly show 0 records for it.
const FYX=(D.detail_meta&&D.detail_meta.fyx_primary)||{};
function fyNum(t){ return parseInt(String(t).slice(2),10)||0; }  // 'FY27' -> 27
// Display label: 'FY25' -> "FY25"; 'FY26' -> "FY26"; 'FY27' -> "FY27" (simpler, clearer for business use)
function fyDispLabel(tag){
  if(tag==null||tag==='') return '';
  if(String(tag).match(/^fy\d{2}$/i)) return String(tag).toUpperCase();
  return String(tag);
}
const PREAGG_FYS=(function(){
  const s=new Set();
  Object.keys(D.primary||{}).forEach(k=>{ const m=/^nsv_(fy\d{2})$/.exec(k); if(m) s.add('FY'+m[1].slice(2)); });
  return [...s];
})();
const FY_ALL=[...new Set([...PREAGG_FYS,...Object.keys(FYX)])].sort((a,b)=>fyNum(a)-fyNum(b));
function optsFor(key){
  if(key==='FY') return FY_ALL;
  const recs=REC;  // Use full REC instead of recFilter(key) to ensure all unique values appear (e.g., Central zone from any FY)
  const vals=[...new Set(recs.map(r=>r[key]))].filter(v=>v!=null&&v===v&&String(v).trim()!=='');
  if(key==='Month') vals.sort((a,b)=>MORDER.indexOf(a)-MORDER.indexOf(b));
  else{
    const contrib={};
    recs.forEach(r=>{const v=r[key];contrib[v]=(contrib[v]||0)+(r.NSV||0);});
    vals.sort((a,b)=>(contrib[b]||0)-(contrib[a]||0)||String(a).localeCompare(String(b)));
  }
  return vals;
}
function renderFilterBar(){
  const fb=document.getElementById('filterbar');
  const anyActive=FILT.some(([k])=>F[k].length);
  fb.innerHTML = FILT.map(([k,lab])=>{
    const opts=optsFor(k), sel=F[k];
    return `<label class="fl" for="filter-${k}"><span>${lab}</span><select id="filter-${k}" name="filter-${k}" aria-label="Filter by ${attrEsc(lab)}" data-k="${k}" title="Pick a value to add it; pick it again to remove it. Multiple values are OR'd.">
      <option value="">${sel.length?`${sel.length} selected — clear`:'All'}</option>
      ${opts.map(v=>{const s=String(v).replace(/"/g,'&quot;');const on=sel.includes(String(v));
        const disp=k==='FY'?fyDispLabel(v):v;
        return `<option value="${s}">${on?'✓ ':''}${disp}</option>`;}).join('')}
    </select></label>`;
  }).join('')
  + `<button class="fbtn ghost" id="fReset">↺ Reset filters</button>`
  + `<details class="pagedl"><summary class="fbtn">⭳ Download Page</summary>
       <div class="chartdl-menu" style="min-width:170px">
         <button data-pagefmt="pdf">📄 PDF</button>
         <button data-pagefmt="png">🖼 PNG Image</button>
       </div></details>`
  + `<span class="fcount" id="fCount">${anyActive?'Filtered · ':''}${num(recFilter().length)} records</span>`
  + (anyActive?`<span style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px">${activeChipsHtml()}</span>`:'');
  // multi-select via native dropdowns: picking an option TOGGLES it in/out of
  // the selection (✓ marks selected ones); the first line clears the dimension.
  fb.querySelectorAll('select').forEach(sel=>{
    sel.onchange=()=>{
      const k=sel.dataset.k, v=sel.value;
      if(v==='') F[k]=[];
      else{ const i=F[k].indexOf(v); if(i>=0) F[k].splice(i,1); else F[k].push(v); }
      if(k==='Category'&&!F[k].length) catChartDrill=null;
      onFilterChange();
    };
  });
  document.getElementById('fReset').onclick=()=>{FILT.forEach(([k])=>F[k]=[]);catChartDrill=null;Object.keys(_drillStates).forEach(k=>delete _drillStates[k]);onFilterChange();};
  fb.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{
    F[b.dataset.k]=F[b.dataset.k].filter(x=>x!==b.dataset.v);
    if(b.dataset.k==='Category'&&!F.Category.length) catChartDrill=null;
    onFilterChange();
  });
}
function onFilterChange(){ renderFilterBar(); show(currentTab||'overview'); }

// cross-tab drill-down: click any chart bar/segment/table-row on ANY tab to
// set that one filter and re-render the SAME tab narrowed to it -- drilling
// into "DMart" on the Primary tab shows DMart's own Primary view, not a jump
// to a different tab. The Data Explorer tab is still there whenever you want
// the raw row-level records for whatever's currently filtered.
function drillTo(key,value){
  if(!FILT.some(([k])=>k===key) || value==null) return;
  F[key]=[String(value)];   // drill = FOCUS on the clicked value (replaces the dimension's selection)
  onFilterChange();
}
function drillLink(key,label){
  if(label==null||label!==label) return '–';
  return `<span class="drill" data-k="${key}" data-v="${String(label).replace(/"/g,'&quot;')}" title="Filter this view to ${label}">${label}</span>`;
}
function wireDrillLinks(root){
  root.querySelectorAll('.drill').forEach(el=>el.onclick=()=>drillTo(el.dataset.k, el.dataset.v));
}
// active-filter chips, reusable on any tab that reads recFilter() live (Explorer,
// Category & Pack, Performance & Comparison). rebuildFn re-renders the CURRENT
// tab in place when a chip is removed, instead of jumping to Explorer.
function activeChipsHtml(){
  return FILT.flatMap(([k,lab])=>F[k].map(v=>
    `<span class="fchip">${lab}: ${k==='FY'?fyDispLabel(v):v} <b data-k="${k}" data-v="${String(v).replace(/"/g,'&quot;')}" title="remove this value">✕</b></span>`)).join(' ');
}
function wireChips(root,rebuildFn){
  root.querySelectorAll('.fchip b').forEach(b=>b.onclick=()=>{
    F[b.dataset.k]=F[b.dataset.k].filter(x=>x!==b.dataset.v);
    if(b.dataset.k==='Category'&&!F.Category.length) catChartDrill=null;
    renderFilterBar();
    destroyCharts();
    (rebuildFn||buildExplorer)();
  });
}
// unique rows by `key` (sums NSV/MRP/Qty across whatever else varies -- e.g.
// unique articles summed across every chain/month, instead of the same
// article appearing once per chain/month row). First-seen value is kept for
// any other displayed columns (category/sub-cat/pack).
function uniqueBy(recs,key,cols){
  const m={};
  recs.forEach(r=>{
    const k=r[key];
    if(!m[k]){ m[k]={[key]:k,NSV:0,MRP:0,Qty:0}; (cols||[]).forEach(c=>m[k][c]=r[c]); }
    m[k].NSV+=r.NSV; m[k].MRP+=r.MRP||0; m[k].Qty+=r.Qty||0;
  });
  return Object.values(m).sort((a,b)=>b.NSV-a.NSV);
}
// per-CATEGORY 95%-of-category-NSV Pareto (Governed Presentation Hierarchy,
// 2026-09-13): within EACH Category independently, keep sub-categories
// (sorted NSV desc, name asc on ties -- deterministic regardless of object
// iteration order) until cumulative NSV crosses 95% of that CATEGORY's own
// total; the rest are relabelled "Others" for that Category, THEN summed
// across every Category into the final SubCategory buckets shown in the
// chart. So a sub-category stays named if it's a material contributor
// within its OWN parent Category, even if the combined "Others" bucket
// (every Category's long tail) ends up large. Negative/zero sub-category
// NSV (returns, MRN) can never be a "major" contributor and always falls
// into that Category's Others -- but its SIGNED value is preserved in the
// Others total (grouping is presentation, never a value change: nothing is
// deleted, zeroed or abs()'d). Previously grouped per-Brand instead of
// per-Category; corrected because the business rule is "contribution to
// the PARENT CATEGORY", not to the brand that happens to sell it.
function subcatPareto95(recs){
  const byCat={};
  recs.forEach(r=>{ (byCat[r.Category]??=[]).push(r); });
  const out={};
  Object.values(byCat).forEach(rows=>{
    const bySub={};
    rows.forEach(r=>{ const k=r.SubCategory; if(k==null||k!==k)return; bySub[k]=(bySub[k]||0)+r.NSV; });
    const entries=Object.entries(bySub).sort((a,b)=>(b[1]-a[1])||String(a[0]).localeCompare(String(b[0])));
    const posTotal=entries.reduce((a,[,v])=>a+(v>0?v:0),0);
    let cum=0;
    entries.forEach(([sub,val])=>{
      const isMajor=val>0 && posTotal>0 && (cum/posTotal)<0.95;
      const label=isMajor?sub:'Others';
      out[label]=(out[label]||0)+val;
      if(isMajor) cum+=val;
    });
  });
  return Object.entries(out).sort((a,b)=>(b[1]-a[1])||String(a[0]).localeCompare(String(b[0])));
}
// ---- 95%-cumulative-contribution grouping for a flat list (e.g. Brand),
// used where a raw bar/donut of every item would bury the handful that
// actually matter under a long tail of near-invisible slivers (Governed
// Presentation Hierarchy, 2026-09-13). Deterministic: value desc, then name
// asc on ties -- never depends on object/array iteration order. Negative or
// zero items can never be a "major" contributor and always land in the tail
// bucket, WITH their sign preserved in tailValue (grouping is presentation
// only -- nothing is deleted, zeroed or abs()'d). `major` holds the SAME
// object references passed in, so any existing filter/drill logic on them
// keeps working unchanged; only the chart-display array is grouped.
function cumulative95Group(items,nameKey,valueKey,tailLabel){
  const sorted=[...items].sort((a,b)=>(b[valueKey]-a[valueKey])||String(a[nameKey]).localeCompare(String(b[nameKey])));
  const posTotal=sorted.reduce((a,x)=>a+(x[valueKey]>0?x[valueKey]:0),0);
  const major=[],tailMembers=[]; let cum=0;
  sorted.forEach(x=>{
    const v=x[valueKey];
    if(v>0 && posTotal>0 && (cum/posTotal)<0.95){ major.push(x); cum+=v; }
    else tailMembers.push(x);
  });
  const tailValue=tailMembers.reduce((a,x)=>a+x[valueKey],0);
  return {major,tailMembers,tailLabel,tailValue,tailCount:tailMembers.length};
}

// ---- Category -> Sub-category drill-down chart, reusable on EVERY tab ----
// Driven off REC (article-level detail), filtered by whatever's currently
// active (recFilter()) -- so it works even on tabs whose own native data
// (D.offtake/D.pnl/D.universe/D.promo) has no Category dimension at all.
// Click a Category bar to drill into its Sub-categories in place; "All
// Categories" backs out. If a Category filter is already active, it opens
// straight into that category's sub-categories.
let catChartDrill=null;
function catDrillCardHtml(canvasId){
  const cat=catChartDrill||fOne('Category');
  const backBtn=cat?`<button class="fbtn ghost" id="${canvasId}Back" style="margin:0 0 10px">← All Categories</button>`:'';
  const title=cat?`Sub-categories of "${cat}"`:'NSV by Category — click a bar to drill into Sub-category';
  const note=cat?'Click a sub-category to filter this view; ← to go back up to Category.':'Click a bar to see that Category\'s Sub-category split.';
  return card(title,note,`${backBtn}${cv(canvasId,true)}`);
}
function renderCatDrillChart(canvasId,recs){
  const backBtn=document.getElementById(canvasId+'Back');
  if(backBtn) backBtn.onclick=()=>{ catChartDrill=null; F.Category=[]; renderFilterBar(); show(currentTab); };
  const cat=catChartDrill||fOne('Category');
  let labels,data,onClick;
  if(cat){
    const sub=grp(recs.filter(r=>r.Category===cat),'SubCategory');
    labels=sub.map(x=>x[0]); data=sub.map(x=>x[1]);
    onClick=v=>drillTo('SubCategory',v);
  } else {
    const c=grp(recs,'Category');
    labels=c.map(x=>x[0]); data=c.map(x=>x[1]);
    onClick=v=>{ catChartDrill=v; show(currentTab); };
  }
  if(labels.length) mkBarH(canvasId,labels,data,C.teal,true,onClick);
}

// ---- FY/Month filter-awareness for tabs backed by PRE-AGGREGATED blocks ----
// (D.primary, D.offtake, D.pnl, D.universe, D.promo) which only carry FY25 vs
// FY26 (they don't have FY26-27 actuals -- only the article-level detail/REC
// and the Forecast tab's TY target do). These helpers let every such tab obey
// the global FY/Month filter instead of always showing both years regardless
// of what's selected -- and show an honest empty state for FY27 rather than
// silently ignoring the filter.
function fyKey(){ const v=fOne('FY'); return v ? 'fy'+v.slice(2) : null; }  // exactly ONE FY selected -> "fy26"; none/multi -> null
function fyTag(){ return fOne('FY')||null; }                               // exactly ONE FY selected -> "FY27"; none/multi -> null
// FYs beyond the pre-aggregated window (FY27's Apr'26+ onward) exist ONLY in
// the article-wise primary (File 2) -- the other report blocks' source workbook
// ends Mar'26. FPX(tag) returns the exact chain-allocated aggregates for any
// such FY ('FY27', 'FY28', ...), or null if that FY isn't loaded.
function FPX(tag){ const f=FYX[tag]; return f&&f.nsv!=null?f:null; }
function FP27(){ return FPX('FY27'); }                                     // legacy alias for the current beyond-window FY
function fyBeyondPreagg(tag){ return PREAGG_FYS.indexOf(tag)<0; }          // this FY lives only in the article primary
function fyUnsupported(){ return F.FY.length>0 && F.FY.every(fyBeyondPreagg); }  // every selected FY is beyond the pre-agg window
function fyNoDataNote(where){
  return `<div class="fynote"><b>${fLab('FY')} actuals not available</b> — ${where} — source ends Mar'26,
    so this section is intentionally blank instead of showing stale ${fyDispLabel('FY26')} numbers.
    See <b>Forecast</b> for the ${fyDispLabel('FY27')} target.</div>`;
}
function monthUnsupportedNote(what){
  return fOn('Month') ? `<p class="drillhint" style="margin:4px 0 0">Month = ${fLab('Month')} doesn't narrow
    ${what} (this source isn't cross-tabbed by month × ${what.toLowerCase()}).</p>` : '';
}
function dimUnsupportedNote(dims,source){
  const active=dims.filter(d=>fOn(d));
  if(!active.length) return '';
  return `<p class="drillhint" style="margin:4px 0 0">${active.map(d=>`${d}=${fLab(d)}`).join(', ')}
    ${active.length>1?"don't":"doesn't"} apply here — ${source} has no ${active.join('/')} breakdown.</p>`;
}

let expCharts=[];
function expDestroy(){expCharts.forEach(c=>c.destroy());expCharts=[];}
function grp(recs,key){const m={};recs.forEach(r=>{const k=r[key];if(k==null||k!==k)return;m[k]=(m[k]||0)+r.NSV;});
  // value desc, name asc on ties -- deterministic regardless of object iteration order
  return Object.entries(m).sort((a,b)=>(b[1]-a[1])||String(a[0]).localeCompare(String(b[0])));}
function expBarH(id,key,entries){
  const labels=entries.map(e=>e[0]),data=entries.map(e=>e[1]);
  expCharts.push(new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets:[{data,backgroundColor:C.teal,borderRadius:4}]},
    options:{indexAxis:'y',onClick:(e,els)=>{if(els.length){F[key]=[String(labels[els[0].index])];onFilterChange();}},
      plugins:{legend:{display:false},..._labelOpts(true),tooltip:{callbacks:{label:c=>crc(c.parsed.x)}}},
      scales:{x:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>crc(v)}},y:{grid:{display:false}}}}}));
}
function expDonut(id,key,entries){
  const labels=entries.map(e=>e[0]),data=entries.map(e=>e[1]);
  expCharts.push(new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:PAL,borderColor:'#fff',borderWidth:2}]},
    options:{cutout:'58%',onClick:(e,els)=>{if(els.length){F[key]=[String(labels[els[0].index])];onFilterChange();}},
      plugins:{legend:{position:'right'},..._labelOpts(true),tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);
        return `${c.label}: ${crc(c.parsed)} (${(c.parsed/t*100).toFixed(0)}%)`;}}}}}}));
}
function expLine(id,recs){
  const m={};recs.forEach(r=>m[r.Month]=(m[r.Month]||0)+r.NSV);
  const labels=MORDER.filter(x=>x in m),data=labels.map(x=>m[x]);
  expCharts.push(new Chart(document.getElementById(id),{type:'line',
    data:{labels,datasets:[{data,borderColor:C.teal,backgroundColor:C.teal+'22',fill:true,tension:.32,borderWidth:2.4,pointRadius:2}]},
    options:{onClick:(e,els)=>{if(els.length){F.Month=[String(labels[els[0].index])];onFilterChange();}},
      plugins:{legend:{display:false},..._labelOpts(true),tooltip:{callbacks:{label:c=>crc(c.parsed.y)}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>crc(v)}},x:{grid:{display:false}}}}}));
}
// ---- Configurable Explorer chart gallery: each card has a live METRIC
// (NSV/MRP/Qty) + CHART-TYPE (Bar/Column/Line/Area/Donut/Pie) dropdown, keeps
// click-to-filter, and stays sorted high->low. Reuses recFilter()/MORDER/crc/
// qtyFmt/_labelOpts/PAL and the same expCharts cleanup + chartdl PNG/CSV/Excel
// menu as the other Explorer charts. Native <select> = no z-index/overlap.
const GAL_DIMS=[  // [canvasId, record field, title]  -- all fields exist in detail_records
  ['galChain','Chain','NSV by Chain'],['galBrand','Brand','NSV by Brand'],
  ['galCat','Category','NSV by Category'],['galSub','SubCategory','NSV by Sub-Category'],
  ['galPack','PackSize','NSV by Net Weight'],['galRange','Range','NSV by Range'],
  ['galZone','Zone','NSV by Zone'],['galState','State','NSV by State'],
  ['galChan','Channel','NSV by Channel'],
  ['galArt','Article','Top 15 Products by NSV'],['galMonth','Month','NSV Trend Monthly'],
];
const GAL_DIM_OF=Object.fromEntries(GAL_DIMS.map(([id,dim])=>[id,dim]));
const GAL_METRICS=[['NSV','NSV'],['MRP','MRP Value'],['Qty','Quantity']];
const GAL_TYPES=[['barh','Bar'],['bar','Column'],['line','Line'],['area','Area'],['doughnut','Donut'],['pie','Pie']];
const galState={};
function galDefault(dim){
  if(dim==='Month') return {metric:'NSV',type:'line'};
  if(dim==='Category'||dim==='Channel'||dim==='Zone') return {metric:'NSV',type:'doughnut'};
  return {metric:'NSV',type:'barh'};
}
function galGet(id,dim){ return galState[id]||(galState[id]=galDefault(dim)); }
function galControls(id,dim){
  const st=galGet(id,dim);
  const opt=(list,cur)=>list.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('');
  return `<span style="display:inline-flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)">
    <label for="gal-${id}-metric">Metric <select id="gal-${id}-metric" name="gal-${id}-metric" aria-label="Metric for chart ${id}" data-gal="metric" data-id="${id}" style="font-family:inherit;font-size:12px;padding:2px 4px">${opt(GAL_METRICS,st.metric)}</select></label>
    <label for="gal-${id}-type">Chart <select id="gal-${id}-type" name="gal-${id}-type" aria-label="Chart type for chart ${id}" data-gal="type" data-id="${id}" style="font-family:inherit;font-size:12px;padding:2px 4px">${opt(GAL_TYPES,st.type)}</select></label></span>`;
}
function galCardHtml(id,dim,title){ return card(title,galControls(id,dim),cv(id,dim!=='Month'&&dim!=='Chain')); }
const _GAL_MONTH_SEP='␟';
function _fyMonthSortKey(fy,month){
  const fyNum=parseInt(String(fy).replace(/\D/g,''),10)||0;
  return fyNum*12+MORDER.indexOf(month);
}
function galAgg(recs,dim,metric){
  if(dim==='Month'){
    // Grouping by month NAME alone silently sums every FY present in recs
    // into one bucket -- when recs spans >1 FY (the default no-FY-filter
    // view), April/May/... (which have BOTH a full FY26 year and a partial
    // FY27 year) come out roughly double the months FY27 hasn't reached yet
    // (Sept-March, FY26 only), producing a fake "cliff" in the trend that
    // is a mixed-period artifact, not a real month-on-month drop. Group by
    // FY+Month instead whenever more than one FY is present, in true
    // chronological order, so distinct fiscal years never get summed
    // together on one x-axis point.
    const fys=new Set(recs.map(r=>r.FY).filter(Boolean));
    const m={};
    recs.forEach(r=>{
      const key=fys.size>1?(r.FY+_GAL_MONTH_SEP+r.Month):r.Month;
      m[key]=(m[key]||0)+(Number(r[metric])||0);
    });
    let e=Object.entries(m).filter(x=>x[0]!=='undefined'&&x[0]!=='null'&&x[0]!=='');
    if(fys.size>1){
      e.sort((a,b)=>{
        const [fyA,moA]=a[0].split(_GAL_MONTH_SEP), [fyB,moB]=b[0].split(_GAL_MONTH_SEP);
        return _fyMonthSortKey(fyA,moA)-_fyMonthSortKey(fyB,moB);
      });
    } else {
      e.sort((a,b)=>MORDER.indexOf(a[0])-MORDER.indexOf(b[0]));
    }
    return e;
  }
  const m={};recs.forEach(r=>{ m[r[dim]]=(m[r[dim]]||0)+(Number(r[metric])||0); });
  let e=Object.entries(m).filter(x=>x[0]!=='undefined'&&x[0]!=='null'&&x[0]!=='');
  e.sort((a,b)=>b[1]-a[1]);
  e=e.slice(0,15);   // keep categorical charts readable
  return e;
}
function renderGal(id){
  const dim=GAL_DIM_OF[id]; const st=galGet(id,dim);
  const e=galAgg(recFilter(),dim,st.metric);
  // For Month, a key may be "FY26␟April" (multi-FY view) -- split it into
  // the raw month (used to filter, since F.Month only ever holds a plain
  // month name) and a display label that still shows which FY it's from.
  const isMultiFyMonth=dim==='Month'&&e.some(x=>x[0].includes(_GAL_MONTH_SEP));
  const monthOf=k=>isMultiFyMonth?k.split(_GAL_MONTH_SEP)[1]:k;
  const labels=e.map(x=>isMultiFyMonth?x[0].split(_GAL_MONTH_SEP).reverse().join(' '):x[0]);
  const data=e.map(x=>x[1]);
  const fmt=st.metric==='Qty'?(v=>qtyFmt(v)):(v=>crc(v));
  const isFilterDim=FILT.some(([k])=>k===dim);
  const onClick=isFilterDim?(ev,els)=>{if(els.length){F[dim]=[String(monthOf(e[els[0].index][0]))];onFilterChange();}}:undefined;
  const t=st.type;
  let cfg;
  if(t==='doughnut'||t==='pie'){

// Helper: Mask synthetic site codes for user-friendly display in tables
function maskSiteCode(siteCode, zone){
  if(!siteCode) return '–';
  if(siteCode==='PAN_INDIA_DUMMY') return 'National / Pan-India Central';
  if(siteCode&&siteCode.startsWith('REL_REGIONAL_')){
    const zoneLabel=(zone||'Consolidated').replace(/_/g,' ');
    return `Reliance ${zoneLabel} Consolidated`;
  }
  if(siteCode==='SITE_UNASSIGNED') return 'Unassigned / Aggregated';
  return siteCode; // Return as-is if not a synthetic code
}

function renderElasticityCurves(chains){
  const canvas=id('chart-elasticity');if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Mock data: tier_1, tier_2, tier_3 elasticity curves per top 5 chains
  const topChains=chains.slice(0,5).map(c=>c.name);
  const discountRange=[30,40,50,60,70,80];

  const datasets=topChains.map((chain,idx)=>{
    const colors=['#2D9B7F','#1E8E3E','#C77D17','#C0392B','#2b6cb0'];
    const chainData=chains.find(c=>c.name===chain)||{};
    const tiers=chainData.elasticity_tiers||{};

    // Linear interpolation: elasticity coefficient × discount % = uplift %
    const liftValues=discountRange.map(d=>{
      const tier=d<50?'tier_1':(d<70?'tier_2':'tier_3');
      const elast=tiers[tier]?.elasticity||0.3;
      return Math.round(d*elast*100)/100;
    });

    return{label:chain,data:liftValues,borderColor:colors[idx],backgroundColor:colors[idx]+'20',tension:0.3,fill:false};
  });

  new Chart(ctx,{
    type:'line',
    data:{labels:discountRange.map(d=>d+'%'),datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},
      scales:{y:{title:{display:true,text:'Offtake Lift (%)'},beginAtZero:true,max:80}}}
  });
}

function renderROIHeatmap(chains){

}

function renderWaterfall(chains){
  const canvas=id('chart-waterfall');if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Decomposition by discount tier, read from correlations.by_chain[].elasticity_tiers
  // -- the same real source the elasticity / heatmap / scatter charts on this
  // tab already use. The previous version drew a constant 100 "Baseline Offtake"
  // plus Math.random() "Promo Uplift (+)" and "Dilution Risk (-)" series: those
  // were invented and changed on every page load.
  const top=chains.slice(0,5);
  const tierNames=[...new Set(top.flatMap(c=>Object.keys(c.elasticity_tiers||{})))].sort();
  const colors=['#2D9B7F','#1E8E3E','#C77D17','#C0392B','#2b6cb0'];
  const datasets=tierNames.map((t,i)=>({
    label:t+' avg lift %',
    data:top.map(c=>Number(((c.elasticity_tiers||{})[t]||{}).avg_lift)||0),
    backgroundColor:colors[i%colors.length]
  }));
  const anyLift=datasets.some(d=>d.data.some(v=>v>0));

  new Chart(ctx,{
    type:'bar',
    data:{labels:top.map(c=>c.name),datasets},
    options:{indexAxis:'x',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true},
        title:{display:!anyLift,text:'No measured uplift in source — promo master carries no lift values'}},
      scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,title:{display:true,text:'Avg lift % by discount tier'}}}}
  });
}

function renderScatterTrend(chains,flags){
  const canvas=id('chart-scatter');if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Scatter: each chain point at (discount depth, offtake lift)
  const points=chains.map(c=>{
    const tiers=c.elasticity_tiers||{};
    const avgDepth=Object.values(tiers).reduce((s,t)=>s+(t.avg_discount||0),0)/Object.keys(tiers).length||0;
    const avgLift=Object.values(tiers).reduce((s,t)=>s+(t.avg_lift||0),0)/Object.keys(tiers).length||0;
    return{x:Math.round(avgDepth*10)/10,y:Math.round(avgLift*10)/10,label:c.name};
  });

  // Trendline: simple linear regression
  const n=points.length;const sumX=points.reduce((s,p)=>s+p.x,0);const sumY=points.reduce((s,p)=>s+p.y,0);
  const sumXY=points.reduce((s,p)=>s+p.x*p.y,0);const sumX2=points.reduce((s,p)=>s+p.x*p.x,0);
  const slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX*sumX)||0;const intercept=(sumY-slope*sumX)/n;
  const trendline=[{x:0,y:intercept},{x:100,y:slope*100+intercept}];

  new Chart(ctx,{
    type:'scatter',
    data:{
      datasets:[
        {label:'Chains',data:points,backgroundColor:'#2D9B7F',pointRadius:6,pointHoverRadius:8},
        {label:'Trend',data:trendline,showLine:true,borderColor:'#FF6B6B',borderWidth:2,fill:false,pointRadius:0}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},
      scales:{x:{title:{display:true,text:'Avg Discount Depth (%)'}},y:{title:{display:true,text:'Avg Offtake Lift (%)'},beginAtZero:true}}}
  });
}

function exportOfftakeCorrelations(){
  const corr=D.correlations||{};
  const chains=corr.by_chain||[];

  const csv=['Chain,Tier,Avg Discount %,Avg Lift %,Elasticity,Count'];
  chains.forEach(c=>{
    const tiers=c.elasticity_tiers||{};
    Object.entries(tiers).forEach(([tier,data])=>{
      csv.push(`${c.name},${tier},${data.avg_discount||0},${data.avg_lift||0},${data.elasticity||0},${data.count||0}`);
    });
  });

  // Anomalies
  csv.push('');csv.push('Chain,Month,Discount %,Lift %,Flag,Severity');
  (corr.anomaly_flags||[]).forEach(f=>{
    csv.push(`${f.chain},${f.month},${f.discount_depth||0},${f.offtake_lift||0},${f.flag},${f.severity}`);
  });

  const blob=new Blob([csv.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`offtake_correlation_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---- Executive Brief Generator ---- */
function generateExecutiveBrief(){
  const corr=D.correlations||{};
  const chains=(corr.by_chain||[]).slice(0,10);
  const summary=corr.summary||{};

  let topROIChains=chains.sort((a,b)=>{
    const aAvg=(a.elasticity_tiers?.tier_2?.elasticity||0);
    const bAvg=(b.elasticity_tiers?.tier_2?.elasticity||0);
    return bAvg-aAvg;
  }).slice(0,5);

  const macroElast=chains.reduce((s,c)=>{
    const t2=c.elasticity_tiers?.tier_2||{};
    return s+(t2.elasticity||0);
  },0)/chains.length||0.35;

  const dilutionRisks=chains.filter(c=>{
    const t3=c.elasticity_tiers?.tier_3||{};
    return t3.avg_discount>70&&t3.elasticity<0.15;
  });

  return{
    title:'Promo Elasticity Executive Brief',
    generated_at:new Date().toLocaleDateString(),
    macro_elasticity:macroElast.toFixed(2),
    avg_optimal_tier:'Tier 2 ('+summary.optimal_depth_range+')',
    top_roi_chains:topROIChains.map(c=>c.name),
    dilution_risks:dilutionRisks.map(c=>c.name),
    key_insights:[
      `Macro elasticity at ${macroElast.toFixed(2)}: ${macroElast>0.35?'HEALTHY demand response':'SOFT demand sensitivity'}`,
      `Top ROI tier: ${summary.optimal_depth_range} (Tier 2 elasticity leaders)`,
      `${chains.length} chains analyzed; ${dilutionRisks.length} flagged for dilution risk`,
      'Recommend testing Tier 2 boundaries on highest-ROI chains to lock in optimal lift-cost ratio'
    ]
  };
}
