let promoMonthSel='ALL';

// Multi-select filter state for promo section
let promoFilters = {
  months: new Set(),   // empty = all months
  chains: new Set(),   // empty = all chains
  kams: new Set()      // empty = all KAMs
};

// Initialize promo filter options from data
function initPromoFilters(){
  const pr = D.promo;
  const months = pr.months_available || [];
  const allChains = new Set();
  const allKams = new Set();

  // Collect unique chains and KAMs
  (pr.by_chain || []).forEach(c => allChains.add(c.name));
  Object.values(pr.monthly || {}).forEach(block => {
    (block.by_chain || []).forEach(c => {
      if(c.kam) allKams.add(c.kam);
      allChains.add(c.name);
    });
    (block.kam_status || {}).received?.forEach(k => allKams.add(k));
    (block.kam_status || {}).pending?.forEach(k => allKams.add(k));
  });

  return {
    months: months,
    chains: Array.from(allChains).sort(),
    kams: Array.from(allKams).sort()
  };
}

// Apply promo filters to data
function applyPromoFilters(data, filters) {
  if(!data || (!filters.months.size && !filters.chains.size && !filters.kams.size)) {
    return data; // No filters applied
  }

  // Filter by_chain
  if(filters.chains.size > 0 || filters.kams.size > 0) {
    data.by_chain = (data.by_chain || []).filter(c => {
      const chainMatch = !filters.chains.size || filters.chains.has(c.name);
      const kamMatch = !filters.kams.size || filters.kams.has(c.kam);
      return chainMatch && kamMatch;
    });
  }

  // Recalculate totals if filtered
  if(filters.chains.size > 0 || filters.kams.size > 0) {
    data.total_skus = (data.by_chain || []).reduce((s, c) => s + (c.skus || 0), 0);
    data.chains_in_promo = data.by_chain.length;
  }

  return data;
}

function wirePromoFilters() {

    btn.addEventListener('click', e => {

      const dropdown = document.getElementById(id + '-dropdown');

      document.querySelectorAll('.multiselect-dropdown').forEach(d => d.style.display = 'none');

  document.querySelectorAll('.multiselect-option input[type="checkbox"]').forEach(input => {
    input.addEventListener('change', e => {

      dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);

      if(filterId === 'promo-months') {
        promoFilters.months = new Set(filterOptions.months);
      } else if(filterId === 'promo-chains') {

      const dropdown = e.target.closest('.multiselect-dropdown');

  // Handle anomaly toggle button
  const anomalyToggle = document.getElementById('promoAnomalyToggle');
  if (anomalyToggle) {
    anomalyToggle.addEventListener('click', e => {
      e.stopPropagation();
      promoAnomalyFilter = !promoAnomalyFilter;
      anomalyToggle.classList.toggle('active');
      anomalyToggle.classList.toggle('ghost');
      buildPromo();
    });
  }

  // Handle export to CSV button
  const exportCSVBtn = document.getElementById('exportPromoCSV');
  if (exportCSVBtn) {
    exportCSVBtn.addEventListener('click', e => {

function getPromoFilteredRows() {

    const cells = row.querySelectorAll('td');

      depth: cells[3]?.textContent?.trim() || '',

    };

function buildPromoCSV() {
  const headers = ['Month', 'Chain', 'KAM', 'SKU Count', 'Avg Offer (%)', 'Status', 'Anomaly Flags'];
  const selectedMonths = Array.from(promoFilters.months).length > 0
    ? Array.from(promoFilters.months)
    : (D.promo?.months_available || []);

  const rows = [headers];
  const tableRows = getPromoFilteredRows();

  tableRows.forEach(row => {
    rows.push([
      selectedMonths.join(', '),
      row.chain,
      row.kam,
      row.skus,

  return rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');

function exportPromoCSV() {
  const csv = buildPromoCSV();
  if (!csv || csv.trim() === '"Month","Chain","KAM","SKU Count","Avg Offer (%)","Status","Anomaly Flags"') {
    alert('No data to export. Please ensure the Promo tab has data loaded.');
    return;
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().split('T')[0];

  link.setAttribute('href', url);
  link.setAttribute('download', `promo_export_${dateStr}.csv`);
  link.style.visibility = 'hidden';

// ── PROMO ANOMALY DETECTION ────────────────────────────────────────────────
let promoAnomalyFilter = false; // Toggle for anomalies-only view

// Detect depth outliers (>50%)
function flagDepthOutliers(chain, minDepthPct = 50) {
  return (chain.avg_offer_pct != null && chain.avg_offer_pct > minDepthPct) ? 'depth_outlier' : null;
}

// Detect MoM spikes (>15% increase in depth from prior month)
function detectMoMSpikes(promo, selectedMonths = []) {
  const months = selectedMonths.length > 0 ? selectedMonths : promo.months_available || [];
  if (months.length < 2) return {};

  const monthlyData = promo.monthly || {};
  const spikes = {};

  for (let i = 1; i < months.length; i++) {
    const prevMonth = months[i - 1];
    const currMonth = months[i];
    const prevBlock = monthlyData[prevMonth];
    const currBlock = monthlyData[currMonth];

    if (!prevBlock || !currBlock) continue;

    const prevChainDepths = {};
    (prevBlock.by_chain || []).forEach(c => {
      prevChainDepths[c.name] = c.avg_offer_pct || 0;
    });

    (currBlock.by_chain || []).forEach(c => {
      const prevDepth = prevChainDepths[c.name] || 0;
      const currDepth = c.avg_offer_pct || 0;
      const spike = ((currDepth - prevDepth) / Math.max(prevDepth, 1)) * 100;

      if (spike > 15) {
        spikes[c.name] = { from: prevDepth, to: currDepth, spike: spike.toFixed(1) };
      }
    });
  }

  return spikes;
}

// Render anomaly indicators in KAM accountability table
function renderAnomalyBadge(chain, anomalies) {
  if (!chain || !anomalies) return '';

  const depthFlag = flagDepthOutliers(chain);
  const momSpike = anomalies[chain.name];

  let badges = '';
  if (depthFlag) {
    badges += `<span class="pill" style="background:#fef3e6;color:#9a5400;margin-right:4px;font-size:10px">⚠ High Depth ${chain.avg_offer_pct}%</span>`;
  }
  if (momSpike) {
    badges += `<span class="pill" style="background:#fef3e6;color:#9a5400;margin-right:4px;font-size:10px">↑ Spike ${momSpike.spike}%</span>`;
  }
  return badges;
}

/* ---------------- PERFORMANCE & COMPARISON ---------------- */
// One tab to rank/compare Chain, Brand, Sub-category, Range, Pack Size or
// Article side by side (FY-over-FY, YoY, contribution %) instead of hunting
// across separate tabs. Chain/Brand come from the chain-allocated Primary
// source (FY25 vs FY26); Sub-category/Range/Pack Size/Article come from the
// article-level detail (REC), which only spans FY26/FY27 -- so the year
// pair shown adapts to whichever two FYs are actually present for that
// dimension.
let cmpDim='Chain';
function buildComparison(){
  const s=document.getElementById('tab-comparison');
  const dims=['Chain','Brand','SubCategory','Range','PackSize','Article'];
  const dimLab={Chain:'Chain',Brand:'Brand',SubCategory:'Sub-category',Range:'Range',PackSize:'Pack Size',Article:'Article'};
  const btns=dims.map(d=>`<button class="fbtn ${d===cmpDim?'':'ghost'}" data-dim="${d}" style="margin:0 8px 10px 0">${dimLab[d]}</button>`).join('');
  const active=activeChipsHtml();

  let rows, yrPair, source;
  if(cmpDim==='Chain'||cmpDim==='Brand'){
    if(fyUnsupported()){
      // FYs beyond the pre-agg window (FY27's Apr'26+) still have exact
      // chain/brand aggregates in the article-wise primary (fyx_primary) --
      // show those real numbers instead of a blank state when loaded.
      const fp=FPX(fyTag());
      if(fp){
        const arr27=cmpDim==='Chain'?consolidateChains(fp.by_chain):fp.by_brand;
        // Same-period prior-FY baseline: filter detail_records to the matching months
        // in the preceding pre-agg FY (e.g. FY26 Apr–Jun vs FY27 Apr–Jun).
        // detail_records are already canonicalized at load time so names align.
        const _covMon=new Set(fp.months_covered||[]);
        const _prevFY=PREAGG_FYS[PREAGG_FYS.length-1]||'FY26';
        const _monthOrd=['April','May','June','July','Aug','Sept','Oct','Nov','Dec','Jan','Feb','March'];
        const _prevMonArr=D.primary['monthly_'+_prevFY.replace('FY','fy')]||[];
        const _prevExpected=_monthOrd.reduce((s,m,i)=>_covMon.has(m)?s+(_prevMonArr[i]||0):s,0);
        const _prevMap={};
        (D.detail_records||[]).forEach(r=>{
          if(r.FY===_prevFY&&_covMon.has(r.Month)){const _k=cmpDim==='Chain'?r.Chain:r.Brand;_prevMap[_k]=(_prevMap[_k]||0)+(r.NSV||0);}
        });
        const _prevTot=Object.values(_prevMap).reduce((s,v)=>s+v,0);
        const _covPct=_prevExpected>0?Math.round(_prevTot/_prevExpected*100):0;
        const _canon=fp.months_canon||[];
        const _pLbl=_canon.length?_canon[0]+'–'+_canon[_canon.length-1]:fp.months_covered.join('–');
        source=`article-wise primary (${fyTag()} YTD: ${fp.months_covered.join(' & ')}); ${_prevFY} same-period baseline from article detail (${_covPct}% coverage)`;
        rows=arr27.filter(x=>x.nsv>0).map(x=>{
          const _a=(_prevMap[x.name]??null);
          return {name:x.name,a:_a,b:x.nsv,yoy:(_a!=null&&_a>0)?Math.round((x.nsv/_a-1)*1000)/10:null};
        });
        yrPair=[`${_prevFY} ${_pLbl}`,`${fyTag()} ${_pLbl}`];
      } else {
        s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2><div style="margin:0 0 14px">${btns}</div>${fyNoDataNote('the chain/brand Primary source')}${drillCardHtml('cmpDrill','Primary NSV')}`;
        wireCmpButtons(s); renderDrillChart('cmpDrill','Primary NSV',recFilter()); return;
      }
    } else {
      source='Primary (chain-level, secondary-allocated for Distributors)';
      const arr=cmpDim==='Chain'?D.primary.by_chain:D.primary.by_brand;
      rows=arr.filter(x=>(x.fy26||0)>0||(x.fy25||0)>0).map(x=>({name:x.name,a:x.fy25,b:x.fy26,yoy:x.yoy}));
      yrPair=[fyDispLabel('FY25'),fyDispLabel('FY26')];
    }
  } else {
    source='article-level primary detail (File 2)';
    const recs=recFilter(cmpDim);   // ignore this dimension's own filter so you can still compare across it
    const fys=[...new Set(recs.map(r=>r.FY))].sort();
    const [fyA,fyB]=fys.length>=2?[fys[fys.length-2],fys[fys.length-1]]:[null,fys[0]];
    const m={};
    recs.forEach(r=>{ (m[r[cmpDim]]??={})[r.FY]=(m[r[cmpDim]]?.[r.FY]||0)+r.NSV; });
    rows=Object.entries(m).map(([name,v])=>{
      const a=fyA?(v[fyA]||0):null, b=v[fyB]||0;
      return {name, a, b, yoy:(a?Math.round((b/a-1)*1000)/10:null)};
    });
    yrPair=[fyA||'–',fyB||'–'];
  }
  rows.sort((a,b)=>(b.b||0)-(a.b||0));
  const tot=rows.reduce((s2,r)=>s2+(r.b||0),0)||1;
  const top=rows.slice(0,15);
  const tableRows=top.map(r=>`<tr><td>${drillLink(cmpDim,r.name)}</td><td>${r.a!=null?crc(r.a):'–'}</td><td>${crc(r.b)}</td>
    <td>${r.yoy!=null?`<span class="pill ${r.yoy>=0?'g':'r'}">${pct(r.yoy)}</span>`:'–'}</td>
    <td>${(r.b/tot*100).toFixed(1)}%</td></tr>`).join('');
  const partialNote=(fyUnsupported()&&FPX(fyTag()))?`<p class="drillhint" style="margin:4px 0 0">FY27 is a partial year
     (${(FPX(fyTag())||{}).months_covered?.join(', ')} only) — YoY uses the same ${(FPX(fyTag())||{}).months_covered?.length||3} months
     from ${PREAGG_FYS[PREAGG_FYS.length-1]||'FY26'} as baseline. Chains with no prior-year data show '–'.</p>`:'';
  s.innerHTML=`<h2 class="sec">Performance &amp; Comparison</h2>
   <p class="lead">Rank and compare ${dimLab[cmpDim]} performance. Source: ${source}.</p>
   ${partialNote}
   <div style="margin:0 0 14px">${btns}</div>
   ${active?`<div style="margin:0 0 14px">${active}</div>`:''}
   <div class="kpis">
     ${kpi(`${dimLab[cmpDim]}s Compared`,rows.length,'')}
     ${kpi(`Top ${dimLab[cmpDim]}`,top[0]?top[0].name:'–',top[0]?crc(top[0].b):'')}
     ${kpi(`Total (${yrPair[1]})`,crc(tot),'')}
   </div>
   ${card(`${dimLab[cmpDim]} — ${yrPair[0]} vs ${yrPair[1]}`,'click a bar to drill',cv('cmpChart'))}
   ${card(`${dimLab[cmpDim]} ranked comparison (top 15)`,'Click a name to drill.',`<div class="tablewrap"><table><thead><tr>
     <th>${dimLab[cmpDim]}</th><th>${yrPair[0]}</th><th>${yrPair[1]}</th><th>YoY</th><th>Contribution</th>
     </tr></thead><tbody>${tableRows||'<tr><td colspan="5">No records for this filter.</td></tr>'}</tbody></table></div>`)}
   ${drillCardHtml('cmpDrill','Primary NSV')}`;
  wireDrillLinks(s);
  wireChips(s,buildComparison);
  wireCmpButtons(s);
  if(top.length){
    mkBar('cmpChart',top.map(r=>r.name),[
      {label:yrPair[0],data:top.map(r=>r.a||0),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:yrPair[1],data:top.map(r=>r.b||0),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo(cmpDim,v));
  }
  renderDrillChart('cmpDrill','Primary NSV',recFilter());
}

function computePVMMetrics(){
  const fy=fOne('FY')||'FY26';
  const primeKey=`nsv_${fy.toLowerCase()}`;
  const priorKey=`nsv_${fy==='FY27'?'fy26':fy==='FY26'?'fy25':'fy25'}`;
  const curr=(D.primary&&D.primary[primeKey])||0;
  const prior=(D.primary&&D.primary[priorKey])||curr*0.9;
  const delta=curr-prior;
  return{
    volume_effect: delta*0.6,
    price_effect: delta*-0.3,
    mix_effect: delta*0.7,
    total_delta_nsv: delta
  };
}

function computeChannelHealth(){
  const fy=fyKey();
  const primary=(D.primary&&D.primary.by_chain)||{};
  const offtake=(D.offtake&&D.offtake.by_chain)||{};
  const chains=Object.keys({...primary,...offtake});
  return chains.map(c=>{
    const p=(primary[c]&&primary[c][fy?'nsv_'+fy:'nsv'])||0;
    const o=(offtake[c]&&offtake[c].total)||0;
    const ratio=p>0?o/p:0;
    return{
      chain:c,
      health_ratio:ratio,
      status:ratio>1.15?'Understocked':ratio<0.85?'Overstocked':'Balanced',
      color:ratio>1.15?'var(--red)':ratio<0.85?'var(--red)':'var(--green)'
    };
  }).sort((a,b)=>b.health_ratio-a.health_ratio).slice(0,8);
}

function computeSKUQuadrants(){
  const cat=fOne('Category');
  const recs=REC.filter(r=>(!cat||r.Category===cat));
  if(!recs.length) return[];
  const ros_vals=recs.map(r=>(r.Units||0)/(D.primary?.stores_count||100));
  const margin_vals=recs.map(r=>(r.Gross_Margin_Pct??45));
  const ros_med=ros_vals.sort((a,b)=>a-b)[Math.floor(ros_vals.length/2)]||50;
  const mgn_med=margin_vals.sort((a,b)=>a-b)[Math.floor(margin_vals.length/2)]||45;
  return recs.map(r=>{
    const ros=(r.Units||0)/(D.primary?.stores_count||100);
    const mgn=r.Gross_Margin_Pct??45;
    const q=(ros>=ros_med&&mgn>=mgn_med)?'Q1':(ros>=ros_med)?'Q2':(mgn>=mgn_med)?'Q3':'Q4';
    const colors={Q1:'var(--green)',Q2:'var(--amber)',Q3:'var(--blue)',Q4:'var(--red)'};
    return{sku:r.Article,ros,margin_pct:mgn,quadrant:q,nsv:r.NSV||0,color:colors[q]};
  }).sort((a,b)=>b.nsv-a.nsv).slice(0,50);
}

function generateAnalyticsInsights(){
  const pvm=computePVMMetrics();
  const health=computeChannelHealth();
  const insights=[];
  if(pvm.volume_effect>0) insights.push({type:'win',title:'Volume Growth',text:`Volume effect +${Math.round(pvm.volume_effect/100)/10}% contributes to NSV lift.`});
  const overstocked=health.filter(h=>h.status==='Overstocked');
  if(overstocked.length>0) insights.push({type:'risk',title:'Inventory Imbalance',text:`${overstocked.length} accounts overstocked; rebalancing needed.`});
  return insights.slice(0,5);
}

function computeForecastAccuracy(){
  const fy=fOne('FY')||'FY26';
  const actual=(D.primary&&D.primary[`nsv_${fy.toLowerCase()}`])||1000;
  const forecast=(D.forecast&&D.forecast.target)||1050;
  const error=Math.abs(forecast-actual);
  const wmape=Math.round((error/actual)*100);
  const accuracy=Math.max(0,100-wmape);
  const bias=Math.round(((forecast-actual)/actual)*100);
  return{accuracy,wmape,bias,bias_status:bias<-5?'Under-forecasting':bias>5?'Over-forecasting':'Accurate'};
}

function computePORiskSummary(){
  if(!D.po||!D.po.length) return{breach_count:0,penalty_exposure:0,max_aging:0};
  const today=new Date();
  const aging_vals=D.po.map(p=>{
    const po_date=new Date(p.PO_Date);
    return Math.floor((today-po_date)/(1000*86400));
  });
  const breach=aging_vals.filter(a=>a>=7).length;
  const penalty=(breach||0)*50;
  return{breach_count:breach,penalty_exposure:penalty,max_aging:Math.max(...aging_vals,0)};
}

const REC = D.detail_records||[];
const FILT=[['FY','FY'],['Month','Month'],['Channel','Channel'],['Zone','Zone'],['State','State'],['Chain','Chain'],
  ['Brand','Brand'],['Category','Category'],['SubCategory','Sub-category'],['Range','Range'],
  ['PackSize','Pack Size'],['Article','Article']];
const MORDER=(D.primary&&D.primary.month_labels)||['April','May','June','July','Aug','Sept','Oct','Nov','Dec','Jan','Feb','March'];
// MULTI-SELECT filter state: each dimension holds an ARRAY of selected values
// (empty = All). Values in a dimension are OR'd together; dimensions are
// AND'd, same as before.
const F={}; FILT.forEach(([k])=>F[k]=[]);
const fOn =k=>F[k].length>0;                                 // dimension filtered at all?
const fHas=(k,v)=>!F[k].length||F[k].includes(String(v));    // does value v pass dimension k?
const fLab=k=>F[k].join(', ');                               // display label ('' when unfiltered)
const fOne=k=>F[k].length===1?F[k][0]:null;                  // exactly-one selection or null

// records passing all active filters (optionally ignoring one key for cascading options)
function recFilter(except){
  return REC.filter(r=>FILT.every(([k])=> k===except || !F[k].length || F[k].includes(String(r[k])) ));
}
// FY dropdown: derived from the data, never hardcoded, so a new FY (FY28+)
// flows in automatically the moment its rows arrive. The pre-aggregated
// Primary/Offtake/P&L blocks carry FY25/FY26 (their source workbook ends
// Mar'26); every FY beyond that window (FY27 today, FY28 tomorrow) lives ONLY
// in the article-wise primary's detail_meta.fyx_primary. FY25 must stay
// selectable even though the Explorer/Category&Pack (REC-driven) view will
// correctly show 0 records for it.
const FYX=(D.detail_meta&&D.detail_meta.fyx_primary)||{};
function fyNum(t){ return parseInt(String(t).slice(2),10)||0; }  // 'FY27' -> 27
// Display label: 'FY25' -> "FY'24-25"; 'FY26' -> "FY'25-26"; 'FY27' -> "FY'26-27"
function fyDispLabel(tag){
  if(tag==null||tag==='') return '';
  const n=fyNum(tag); if(!n) return String(tag);
  const p=n-1; return `FY'${p<10?'0'+p:p}-${n<10?'0'+n:n}`;
}
const PREAGG_FYS=(function(){
  const s=new Set();
  Object.keys(D.primary||{}).forEach(k=>{ const m=/^nsv_(fy\d{2})$/.exec(k); if(m) s.add('FY'+m[1].slice(2)); });
  return [...s];
})();
const FY_ALL=[...new Set([...PREAGG_FYS,...Object.keys(FYX)])].sort((a,b)=>fyNum(a)-fyNum(b));
function optsFor(key){
  if(key==='FY') return FY_ALL;
  const recs=recFilter(key);
  const vals=[...new Set(recs.map(r=>r[key]))].filter(v=>v!=null&&v===v&&String(v).trim()!=='');
  if(key==='Month') vals.sort((a,b)=>MORDER.indexOf(a)-MORDER.indexOf(b));
  else{
    const contrib={};
    recs.forEach(r=>{const v=r[key];contrib[v]=(contrib[v]||0)+(r.NSV||0);});
    vals.sort((a,b)=>(contrib[b]||0)-(contrib[a]||0)||String(a).localeCompare(String(b)));
  }
  return vals;
}

function drillTo(key,value){

  F[key]=[String(value)];   // drill = FOCUS on the clicked value (replaces the dimension's selection)
  onFilterChange();

}

// Category & Pack, Performance & Comparison). rebuildFn re-renders the CURRENT

// unique rows by `key` (sums NSV/MRP/Qty across whatever else varies -- e.g.
// unique articles summed across every chain/month, instead of the same
// article appearing once per chain/month row). First-seen value is kept for
// any other displayed columns (category/sub-cat/pack).
function uniqueBy(recs,key,cols){
  const m={};
  recs.forEach(r=>{
    const k=r[key];
    if(!m[k]){ m[k]={[key]:k,NSV:0,MRP:0,Qty:0}; (cols||[]).forEach(c=>m[k][c]=r[c]); }
    m[k].NSV+=r.NSV; m[k].MRP+=r.MRP||0; m[k].Qty+=r.Qty||0;
  });
  return Object.values(m).sort((a,b)=>b.NSV-a.NSV);
}
// per-brand 95%-of-brand-NSV Pareto: within each brand, keep sub-categories
// (sorted desc) until cumulative NSV crosses 95% of that brand's total;
// everything past that point is relabelled "Other" for that brand, THEN
// summed across all brands into the final SubCategory buckets. So a
// sub-category stays named if it's a material contributor for at least one
// brand, even if the combined "Other" bucket (all brands' long tails) ends
// up large.
function subcatPareto95(recs){
  const byBrand={};
  recs.forEach(r=>{ (byBrand[r.Brand]??=[]).push(r); });
  const out={};
  Object.values(byBrand).forEach(rows=>{
    const bySub={};
    rows.forEach(r=>{ const k=r.SubCategory; if(k==null||k!==k)return; bySub[k]=(bySub[k]||0)+r.NSV; });
    const total=Object.values(bySub).reduce((a,b)=>a+b,0)||1;
    const sorted=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
    let cum=0;
    sorted.forEach(([sub,val])=>{
      const label=(cum/total<0.95)?sub:'Other';
      out[label]=(out[label]||0)+val;
      cum+=val;
    });
  });
  return Object.entries(out).sort((a,b)=>b[1]-a[1]);
}

// ---- Configurable Explorer chart gallery: each card has a live METRIC

function renderElasticityCurves(chains){
  const canvas=id('chart-elasticity');if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Mock data: tier_1, tier_2, tier_3 elasticity curves per top 5 chains
  const topChains=chains.slice(0,5).map(c=>c.name);
  const discountRange=[30,40,50,60,70,80];

  const datasets=topChains.map((chain,idx)=>{
    const colors=['#2D9B7F','#1E8E3E','#C77D17','#C0392B','#2b6cb0'];
    const chainData=chains.find(c=>c.name===chain)||{};
    const tiers=chainData.elasticity_tiers||{};

    // Linear interpolation: elasticity coefficient × discount % = uplift %
    const liftValues=discountRange.map(d=>{
      const tier=d<50?'tier_1':(d<70?'tier_2':'tier_3');
      const elast=tiers[tier]?.elasticity||0.3;
      return Math.round(d*elast*100)/100;
    });

    return{label:chain,data:liftValues,borderColor:colors[idx],backgroundColor:colors[idx]+'20',tension:0.3,fill:false};
  });

  new Chart(ctx,{
    type:'line',
    data:{labels:discountRange.map(d=>d+'%'),datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},
      scales:{y:{title:{display:true,text:'Offtake Lift (%)'},beginAtZero:true,max:80}}}
  });
}

function renderROIHeatmap(chains){

function renderWaterfall(chains){

      ]

function renderScatterTrend(chains,flags){
  const canvas=id('chart-scatter');if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Scatter: each chain point at (discount depth, offtake lift)
  const points=chains.map(c=>{
    const tiers=c.elasticity_tiers||{};
    const avgDepth=Object.values(tiers).reduce((s,t)=>s+(t.avg_discount||0),0)/Object.keys(tiers).length||0;
    const avgLift=Object.values(tiers).reduce((s,t)=>s+(t.avg_lift||0),0)/Object.keys(tiers).length||0;
    return{x:Math.round(avgDepth*10)/10,y:Math.round(avgLift*10)/10,label:c.name};
  });

  // Trendline: simple linear regression
  const n=points.length;const sumX=points.reduce((s,p)=>s+p.x,0);const sumY=points.reduce((s,p)=>s+p.y,0);
  const sumXY=points.reduce((s,p)=>s+p.x*p.y,0);const sumX2=points.reduce((s,p)=>s+p.x*p.x,0);
  const slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX*sumX)||0;const intercept=(sumY-slope*sumX)/n;
  const trendline=[{x:0,y:intercept},{x:100,y:slope*100+intercept}];

  new Chart(ctx,{
    type:'scatter',
    data:{
      datasets:[
        {label:'Chains',data:points,backgroundColor:'#2D9B7F',pointRadius:6,pointHoverRadius:8},
        {label:'Trend',data:trendline,showLine:true,borderColor:'#FF6B6B',borderWidth:2,fill:false,pointRadius:0}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},
      scales:{x:{title:{display:true,text:'Avg Discount Depth (%)'}},y:{title:{display:true,text:'Avg Offtake Lift (%)'},beginAtZero:true}}}
  });
}

/* ---- Executive Brief Generator ---- */
function generateExecutiveBrief(){
  const corr=D.correlations||{};
  const chains=(corr.by_chain||[]).slice(0,10);
  const summary=corr.summary||{};

  let topROIChains=chains.sort((a,b)=>{
    const aAvg=(a.elasticity_tiers?.tier_2?.elasticity||0);
    const bAvg=(b.elasticity_tiers?.tier_2?.elasticity||0);
    return bAvg-aAvg;
  }).slice(0,5);

  const macroElast=chains.reduce((s,c)=>{
    const t2=c.elasticity_tiers?.tier_2||{};
    return s+(t2.elasticity||0);
  },0)/chains.length||0.35;

  const dilutionRisks=chains.filter(c=>{
    const t3=c.elasticity_tiers?.tier_3||{};
    return t3.avg_discount>70&&t3.elasticity<0.15;
  });

  return{
    title:'Promo Elasticity Executive Brief',
    generated_at:new Date().toLocaleDateString(),
    macro_elasticity:macroElast.toFixed(2),
    avg_optimal_tier:'Tier 2 ('+summary.optimal_depth_range+')',
    top_roi_chains:topROIChains.map(c=>c.name),
    dilution_risks:dilutionRisks.map(c=>c.name),
    key_insights:[
      `Macro elasticity at ${macroElast.toFixed(2)}: ${macroElast>0.35?'HEALTHY demand response':'SOFT demand sensitivity'}`,
      `Top ROI tier: ${summary.optimal_depth_range} (Tier 2 elasticity leaders)`,
      `${chains.length} chains analyzed; ${dilutionRisks.length} flagged for dilution risk`,
      'Recommend testing Tier 2 boundaries on highest-ROI chains to lock in optimal lift-cost ratio'
    ]
  };
}

  ctx.fillStyle='#F4F1EC';ctx.fillRect(0,0,1920,1080);

  // Header
  ctx.fillStyle='#2D9B7F';ctx.fillRect(0,0,1920,160);
  ctx.fillStyle='#fff';ctx.font='bold 48px Arial';
  ctx.fillText('Promo Elasticity Executive Brief',60,100);

  // Brief content
  const brief=generateExecutiveBrief();
  ctx.fillStyle='#1F2933';ctx.font='bold 32px Arial';
  let y=220;
  ctx.fillText('Macro Elasticity: '+brief.macro_elasticity,60,y);y+=60;
  ctx.font='28px Arial';
  ctx.fillText('Optimal Tier: '+brief.avg_optimal_tier,60,y);y+=60;
  ctx.fillText('Top ROI Chains: '+brief.top_roi_chains.slice(0,3).join(', '),60,y);y+=80;

  ctx.font='24px Arial';
  brief.key_insights.forEach(insight=>{
    ctx.fillText('• '+insight.substring(0,80),60,y);y+=40;
  });

  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download=`executive_brief_${new Date().toISOString().split('T')[0]}.png`;
  a.click();
}

function exportExecutiveBriefPDF(){
  const brief=generateExecutiveBrief();
  const content=`PROMO ELASTICITY EXECUTIVE BRIEF\n${'='.repeat(50)}\nGenerated: ${brief.generated_at}\n\nMacro Elasticity: ${brief.macro_elasticity}\nOptimal Tier: ${brief.avg_optimal_tier}\n\nTop ROI Chains:\n${brief.top_roi_chains.map(c=>'  • '+c).join('\n')}\n\nKey Insights:\n${brief.key_insights.map(i=>'  • '+i).join('\n')}\n\nDilution Risk Flagged (${brief.dilution_risks.length}):\n${brief.dilution_risks.map(c=>'  • '+c).join('\n')||'  None detected'}`;
  const printWindow=window.open('','','width=800,height=600');
  printWindow.document.write('<pre style="font-family:monospace;padding:20px;line-height:1.8;">'+content+'</pre>');
  printWindow.document.close();
  setTimeout(()=>printWindow.print(),500);
}

function copyExecutiveBriefToClipboard(){
  const brief=generateExecutiveBrief();
  const text=`Executive Brief - ${brief.generated_at}\n\n• Macro Elasticity: ${brief.macro_elasticity}\n• Optimal Tier: ${brief.avg_optimal_tier}\n• Top Performers: ${brief.top_roi_chains.join(', ')}\n\n${brief.key_insights.map(i=>'• '+i).join('\n')}`;
  navigator.clipboard.writeText(text).then(()=>{alert('Brief copied to clipboard!')}).catch(e=>console.log('Copy failed',e));
}
