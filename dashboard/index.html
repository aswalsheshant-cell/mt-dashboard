          borderColor: C.teal,
          backgroundColor: C.teal+'22'
        });
      }

      if (has_fy27) {
        trendSeries.push({
          label:'FY27 (Actual to date)',
          data: D.primary.monthly_fy27 || [],
          borderColor: C.amber,
          backgroundColor: C.amber+'22'
        });
      }

      if (trendSeries.length > 0) {
        const lc = mkLine('chanPrimTrend', stdMonths, trendSeries);
        channelDynamicsState.charts.trend = lc;
      }
    } else {
      // No primary data available
      const emptyMsg = '<p class="lead">Primary sales data not available for this period.</p>';
      content.innerHTML += card('Primary Sales Trend','No data', emptyMsg);
    }

    const dc = mkDonut('chanChanSplit',validChannels.map(c=>c.name),validChannels.map(c=>c[primYr]),true);
    channelDynamicsState.charts.channel=dc;
  }
  else if(sv==='category'){
    // Category & Pack Mix -- hierarchical drill:
    //   Category -> Sub-Category -> Range -> Pack Size / Net Content -> Article
    // Previously this only ever grouped by Category with no way to go deeper,
    // even though detail_records already carry SubCategory, Range, PackSize and
    // Article. Nothing new is computed -- each level is the same NSV/Qty rollup
    // applied one dimension further down.
    const LEVELS=[['Category','Category'],['SubCategory','Sub-Category'],
                  ['Range','Range'],['PackSize','Pack Size / Net Content'],
                  ['Article','Article']];
    const path=channelDynamicsState.catPath||(channelDynamicsState.catPath=[]);
    let recs=recFilter();
    path.forEach(step=>{ recs=recs.filter(r=>(r[step.dim]||'Unknown')===step.val); });
    const depth=Math.min(path.length,LEVELS.length-1);
    const dimKey=LEVELS[depth][0], dimLabel=LEVELS[depth][1];

    if(!recs.length){
      content.innerHTML=card('Category & Pack Analysis','No records match current filters',
        `<p class="lead">No records at this level.</p>
         <p class="note"><a href="#" data-cat-pop="0" style="cursor:pointer;">Reset drill</a></p>`);
      content.querySelectorAll('[data-cat-pop]').forEach(a=>{a.onclick=e=>{e.preventDefault();
        channelDynamicsState.catPath=[]; renderChannelSubview(chains,brands,channels,primYr,fy,yrLab);};});
      return;
    }

    const agg={};
    recs.forEach(r=>{const k=r[dimKey]||'Unknown';
      if(!agg[k]) agg[k]={nsv:0,qty:0,n:0};
      agg[k].nsv+=r.NSV||0; agg[k].qty+=r.Qty||0; agg[k].n+=1;});
    // value desc, name asc on ties -- deterministic regardless of object iteration order
    let rows=Object.entries(agg).sort((a,b)=>(b[1].nsv-a[1].nsv)||String(a[0]).localeCompare(String(b[0])));
    const totalNsv=rows.reduce((a,kv)=>a+kv[1].nsv,0);
    const canDrill=depth<LEVELS.length-1;

    // Governed Presentation Hierarchy (2026-09-13): at the Sub-Category level
    // -- i.e. one Category already fixed by `path` above -- keep only the
    // sub-categories that cumulatively cover the first 95% of THIS Category's
    // own NSV; the rest collapse into one "Others" row. This is the live
    // equivalent of the rule; the drill hierarchy never lists Category or
    // Brand as a level here, so only Sub-Category is grouped. Presentation
    // only -- `agg`/`totalNsv` (Share% denominator) still reflect every row.
    let othersRow=null;
    if(dimKey==='SubCategory' && rows.length){
      const items=rows.map(([name,v])=>({name,...v}));
      const g=cumulative95Group(items,'name','nsv','Others');
      rows=g.major.map(x=>[x.name,{nsv:x.nsv,qty:x.qty,n:x.n}]);
      if(g.tailCount){
        othersRow={
          nsv:g.tailValue,
          qty:g.tailMembers.reduce((a,x)=>a+x.qty,0),
          n:g.tailMembers.reduce((a,x)=>a+x.n,0),
          members:g.tailMembers.map(x=>x.name),
        };
      }
    }

    const crumbs=`<div style="margin-bottom:10px;font-size:13px;">
      <a href="#" data-cat-pop="0" style="cursor:pointer;">All categories</a>`
      + path.map((st,i)=>` &rsaquo; <a href="#" data-cat-pop="${i+1}" style="cursor:pointer;">${st.val}</a>`).join('')
      + `<span class="note" style="margin-left:10px;">${canDrill?('click a '+dimLabel.toLowerCase()+' to drill deeper'):'deepest level'}</span>
    </div>`;

    const body=rows.map(kv=>{
      const k=kv[0], v=kv[1];
      const shr=totalNsv>0?(100*v.nsv/totalNsv):0;
      const cell=canDrill
        ? `<a href="#" data-cat-drill="${encodeURIComponent(k)}" style="cursor:pointer;">${k}</a>`
        : k;
      return `<tr><td>${cell}</td><td>${crc(v.nsv/100)}</td><td>${num(v.qty)}</td><td>${shr.toFixed(1)}%</td></tr>`;
    }).join('') + (othersRow?`<tr style="color:var(--muted)" title="${othersRow.members.map(m=>String(m).replace(/"/g,'&quot;')).join(', ')}">
      <td>Others (${othersRow.members.length} sub-categories, &lt;95% cutoff)</td>
      <td>${crc(othersRow.nsv/100)}</td><td>${num(othersRow.qty)}</td>
      <td>${totalNsv>0?(100*othersRow.nsv/totalNsv).toFixed(1):'0.0'}%</td></tr>`:'');

    content.innerHTML=crumbs+card(`Category & Pack Mix — by ${dimLabel}`,
      `${rows.length}${othersRow?' + Others':''} ${dimLabel.toLowerCase()}${rows.length===1?'':'s'} shown`+
      (dimKey==='SubCategory'?' (95% cumulative NSV of this Category; long tail grouped into Others)':'')+
      ` · ${num(recs.length)} records`,
      `<table class="tbl"><thead><tr><th>${dimLabel}</th><th>NSV</th><th>Qty</th><th>Share</th></tr></thead><tbody>${body}</tbody></table>`);

    content.querySelectorAll('[data-cat-drill]').forEach(a=>{
      a.onclick=e=>{e.preventDefault();
        channelDynamicsState.catPath=path.concat([{dim:dimKey,val:decodeURIComponent(a.dataset.catDrill)}]);
        renderChannelSubview(chains,brands,channels,primYr,fy,yrLab);};
    });
    content.querySelectorAll('[data-cat-pop]').forEach(a=>{
      a.onclick=e=>{e.preventDefault();
        channelDynamicsState.catPath=path.slice(0,Number(a.dataset.catPop));
        renderChannelSubview(chains,brands,channels,primYr,fy,yrLab);};
    });
  }
  else if(sv==='reliance'){
    // Phase 2: Reliance Brand Counter sub-view with toggle between macro (bulk) and BA (dedicated counters)
    // Bug fix (2026-09-16): this used to filter r.Brand==='Reliance', but
    // Reliance is a Chain, never a Brand value (Brand is Mamaearth/The Derma
    // Co/etc.) -- that condition could never match a single row, so this
    // sub-view always showed "No Reliance records" regardless of filter.
    const recs=recFilter('Brand');
    const reliance=recs.filter(r=>r.Chain==='Reliance Retail');
    if(!reliance.length) {content.innerHTML=card('Reliance Brand Counter','No Reliance records','<p class="lead">Select a timeframe that includes Reliance sales.</p>');return;}
    const byzone={};
    reliance.forEach(r=>{const z=r.Zone||'Unknown';if(!byzone[z]) byzone[z]={nsv:0,stores:0};byzone[z].nsv+=r.NSV||0;});
    const zoneRows=Object.entries(byzone).sort((a,b)=>b[1].nsv-a[1].nsv).map(([zone,{nsv}])=>`<tr><td>${drillLink('Zone',zone)}</td><td>${crc(nsv/100)}</td></tr>`).join('');
    // Phase 2: Add toggle control for Brand Counter view mode
    const toggleHtml=getRelianceBCToggleHtml();
    content.innerHTML=`
      ${toggleHtml}
      ${card('Reliance by Zone',`${reliance.length} Reliance transactions`,`<table class="tbl"><thead><tr><th>Zone</th><th>NSV (Cr)</th></tr></thead><tbody>${zoneRows}</tbody></table>`)}`;
    wireDrillLinks(content);
    wireRelianceBCToggle(); // Phase 2: Wire up the toggle buttons
  }
}

/* ============ INVENTORY & SUPPLY HEALTH (Issue #104: Consolidated Offtake + Impact + Distribution) ============ */
function buildInventoryHealth(){
  const o=D.offtake, u=D.universe||{}, s=document.getElementById('tab-inventory-health');
  if(!s) return;
  const fy=fyKey();
  // Defensive: handles both nested o.total['fy26'] and legacy o.total_fy26 formats
  const total = o?.total?.[fy] ?? o?.[`total_${fy}`] ?? 0;
  const metrics = o?.metrics ?? { doi: {}, otif: {} };
  // fyKey() is null unless exactly ONE FY is selected -- the default "All"
  // state. Code below did fy.slice(2) on it and threw. Resolve to the latest FY
  // present in the data (never a hardcoded year: THE ONE FY RULE).
  const _fyTags = (o && o.fy_tags) || (D.primary && D.primary.fy_tags) || [];
  const fyR = fy || _fyTags[_fyTags.length - 1] || 'fy26';
  // Real per-chain store counts: universe.by_chain (not offtake.by_chain,
  // which is a flat [{name,value}] list with no by_month/store member -- the
  // "Active MT Stores" KPI and the "Stores" column below used to read that
  // absent field and silently resolve to 0/'–' for every chain. universe.by_chain
  // is the one place this repo actually carries real store counts per chain.
  const _uniStores={}; (u.by_chain||[]).forEach(c=>{ if(c&&c.name) _uniStores[c.name]=c.stores; });
  const _activeStores = u.active_stores!=null ? u.active_stores : '–';
  // Pipeline Cover (DOI) / Fill Rate (OTIF): scripts/build_dashboard_data.py
  // emits metrics.doi/{} and metrics.otif/{} as explicit, permanently-empty
  // placeholders (no DOI/OTIF computation exists anywhere in the pipeline
  // yet) -- shown as "Not computed" rather than a bare "-" so this reads as
  // "not built yet", not as "filtered to zero" like the KPIs beside it.
  const _doiVal=(metrics&&metrics.avg_fill_rate)?Number(metrics.avg_fill_rate).toFixed(1):'Not computed';
  const _otifVal=(metrics&&metrics.otif_pct)?Number(metrics.otif_pct).toFixed(1)+'%':'Not computed';
  s.innerHTML=`<div class="kpi-row"><div class="kpi-card"><div class="kpi-label">Total Offtake</div><div class="kpi-value">${crc(total)}</div></div><div class="kpi-card"><div class="kpi-label">Active MT Stores</div><div class="kpi-value">${_activeStores}</div></div><div class="kpi-card"><div class="kpi-label">Pipeline Cover (DOI)</div><div class="kpi-value">${_doiVal}</div></div><div class="kpi-card"><div class="kpi-label">Fill Rate (OTIF)</div><div class="kpi-value">${_otifVal}</div></div></div>`;

  // Sub-view tabs
  const subviews=['velocity','gap','coverage'];
  const subviewLabels={velocity:'Offtake Velocity',gap:'Demand-Supply Gap',coverage:'Store Coverage'};
  const tabs=`<div class="subview-tabs">${subviews.map(sv=>`<button class="subview-tab ${inventoryHealthState.subview===sv?'active':''}" onclick="switchInventorySubview('${sv}')">${subviewLabels[sv]}</button>`).join('')}</div>`;
  s.innerHTML+=tabs;

  const content=document.createElement('div');
  content.className='subview-content';
  s.appendChild(content);

  const renderInventorySubview=(sv,chains,brands,months,fy)=>{
    destroyInventoryCharts();
    content.innerHTML='';

    if(sv==='velocity'){
      // Offtake Velocity: store-level sales + chain heatmap
      const byChain=o.by_chain||{};
      // by_chain is emitted as an ARRAY of {name,...} objects; Object.keys() on
      // it yielded "0","1","2" and those indices were rendered as chain names.
      // Handle both the array and the legacy {chain:{...}} map shape.
      const _entries=Array.isArray(byChain)
        ? byChain.map(e=>[e&&e.name,e])
        : Object.keys(byChain).map(k=>[k,byChain[k]]);
      // Prior-FY key is `fy25`/`total_fy25`, not `total_25` -- the old form
      // never matched, so growth was hardcoded to 0 for every chain.
      const prior_fy=`fy${(parseInt(fyR.slice(2),10)-1).toString().padStart(2,'0')}`;
      // Growth % is only a genuine YoY when both FYs cover the same number of
      // months. FY27 today is a 5-month partial year (Apr-Aug) vs FY26's full
      // 12 -- comparing the raw totals directly made every chain read as a
      // steep decline (DMart -35.5%, Reliance -42.2%, Apollo -25.7%, ...)
      // while the SAME chains correctly show +91-158% like-for-like growth
      // elsewhere on this dashboard (Commercial Analytics, Performance &
      // Comparison) for the identical period. This is exactly the failure
      // mode scripts/build_dashboard_data.py's same_period_block() was built
      // to prevent ("a part-year FY compared against a full prior FY is not
      // a YoY -- it is a coverage artefact"); this one chart didn't use it.
      // No monthly-by-chain breakdown exists in offtake.by_chain to compute
      // a proper like-for-like split client-side, so show an honest "–"
      // instead of a wrong number when the windows don't match, rather than
      // fabricate a same_period calculation this data can't support.
      const _currMonths=(o[`months_${fyR}`]||[]).length;
      const _priorMonths=(o[`months_${prior_fy}`]||[]).length;
      const _likeForLike=_currMonths>0 && _currMonths===_priorMonths;
      const chainData=_entries.filter(([n,e])=>n&&e).map(([name,ch_data])=>{
        const stores=_uniStores[name];
        const nsv=(ch_data.total&&ch_data.total[fyR])||ch_data[`total_${fyR}`]||ch_data[fyR]||ch_data.value||0;
        const prior=(ch_data.total&&ch_data.total[prior_fy])||ch_data[`total_${prior_fy}`]||ch_data[prior_fy]||0;
        const growth=(_likeForLike && prior>0)?((nsv/prior-1)*100):null;
        return {name,stores,nsv,growth};
      });
      chainData.sort((a,b)=>b.nsv-a.nsv);

      const _growthNote=_likeForLike?'':' · Growth % needs equal month coverage in both years to be a genuine YoY -- not shown for a partial year';
      content.innerHTML+=card('Top Chains by Offtake',`${chainData.length} chains${_growthNote}`,`<table class="tbl"><thead><tr><th>Chain</th><th>Stores</th><th>Offtake (Cr)</th><th>Growth %</th></tr></thead><tbody>${chainData.slice(0,10).map(c=>`<tr><td>${c.name}</td><td>${c.stores!=null?c.stores:'–'}</td><td>${crc(c.nsv)}</td><td>${c.growth!=null?c.growth.toFixed(1)+'%':'–'}</td></tr>`).join('')}</tbody></table>`);

      const canvasDiv=document.createElement('div');
      canvasDiv.style.cssText='width:100%;height:300px;position:relative;margin:20px 0;';
      const canvas=document.createElement('canvas');
      canvasDiv.appendChild(canvas);
      content.appendChild(canvasDiv);

      const velocityChart=new Chart(canvas,{
        type:'bar',
        data:{
          labels:chainData.slice(0,8).map(c=>c.name),
          datasets:[{label:'Offtake (Cr)',data:chainData.slice(0,8).map(c=>c.nsv/100),backgroundColor:'#2D9B7F'}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},scales:{y:{beginAtZero:true}}}
      });
      inventoryHealthState.charts.velocity=velocityChart;
    }else if(sv==='gap'){
      // Demand-Supply Gap: Primary inflow vs Offtake bridge + DOI watchlist
      const p=D.primary||{};
      const gapData=[];
      (o.metrics&&o.metrics.doi_watchlist||[]).forEach(row=>{
        gapData.push({chain:row.chain||'Unknown',doi:row.doi||0,status:row.doi<7?'CRITICAL':row.doi<14?'WATCH':'OK'});
      });

      content.innerHTML+=card('Distribution of Inventory Watchlist',`${gapData.length} chains`,`<table class="tbl"><thead><tr><th>Chain</th><th>Days of Inventory</th><th>Status</th></tr></thead><tbody>${gapData.slice(0,10).map(r=>`<tr><td>${r.chain}</td><td>${r.doi.toFixed(1)}</td><td><span style="color:${r.status==='CRITICAL'?'#C0392B':r.status==='WATCH'?'#F39C12':'#2D9B7F'}">${r.status}</span></td></tr>`).join('')}</tbody></table>`);

      // A weekly Primary-Inflow-vs-Offtake chart previously rendered here with
      // hardcoded numbers (Wk1-5: [45,48,50,52,51] vs [40,42,45,48,50]) that
      // were never sourced from DASH at all -- removed per this project's own
      // "no dummy data" rule (same reasoning already applied to the Demand
      // Planning "Competitive Market Share" card below). Primary/Offtake data
      // in this build is monthly (D.primary.monthly_fyXX, D.offtake.monthly),
      // not weekly, so no real weekly series exists to plot here yet.
      content.innerHTML+=card('Primary Inflow vs. Offtake — weekly','source not available',
        `<p class="lead">No weekly Primary/Offtake series exists in this build.</p>
         <p class="note">Primary and Offtake are tracked monthly today
         (see the Primary Sales Trend chart on Channel &amp; Chain Performance).
         To populate a weekly gap view, a weekly-grain Primary and Offtake
         extract would need to be added to <code>scripts/build_dashboard_data.py</code>
         and emitted as e.g. <code>DASH.offtake.weekly</code>. Until then this
         card stays empty by design — it previously displayed hardcoded
         placeholder weekly figures that were not sourced from any file.</p>`);
      content.innerHTML+=inventoryClassificationSection();
    }else if(sv==='coverage'){
      // Store Coverage: real store counts by zone from the MT universe
      // (D.universe.by_zone: [{name,stores}], sums to the 426-store baseline).
      // Previously read D.offtake.by_zone.stores, a field that doesn't exist
      // in that block at all (D.offtake.by_zone carries NSV, not store
      // counts) AND treated it as a map with Object.keys() when it's really
      // an array -- so every row showed the array INDEX ("0","1",...) as the
      // zone name with 0 stores and 0.0% "coverage" for every zone. Fixed to
      // the real source; the fabricated "Coverage %" column (stores/10*100,
      // no real denominator) is dropped rather than replaced with another
      // invented ratio -- no active-vs-total split by zone exists yet to
      // compute a real coverage percentage from.
      const zoneData=(D.universe&&D.universe.by_zone||[]).map(z=>({zone:z.name,stores:z.stores||0}))
        .sort((a,b)=>b.stores-a.stores);

      content.innerHTML+=card('Store Distribution by Zone',`${zoneData.length} zones`,`<table class="tbl"><thead><tr><th>Zone</th><th>Stores</th></tr></thead><tbody>${zoneData.map(z=>`<tr><td>${z.zone}</td><td>${z.stores}</td></tr>`).join('')}</tbody></table>`);

      const canvasDiv=document.createElement('div');
      canvasDiv.style.cssText='width:100%;height:300px;position:relative;margin:20px 0;';
      const canvas=document.createElement('canvas');
      canvasDiv.appendChild(canvas);
      content.appendChild(canvasDiv);

      const coverageChart=new Chart(canvas,{
        type:'doughnut',
        data:{
          labels:zoneData.map(z=>z.zone),
          datasets:[{data:zoneData.map(z=>z.stores),backgroundColor:['#2D9B7F','#3498DB','#E74C3C','#F39C12','#9B59B6','#1ABC9C']}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}}}
      });
      inventoryHealthState.charts.coverage=coverageChart;
    }
  };

  renderInventorySubview(inventoryHealthState.subview,Object.keys(o.by_chain||{}),(D.primary.by_brand||[]).map(b=>b.name),D.month_list||[],fy);
}

function switchInventorySubview(sv){
  inventoryHealthState.subview=sv;
  const s=document.getElementById('tab-inventory-health');
  if(s){
    Array.from(s.querySelectorAll('.subview-tab')).forEach(b=>b.classList.remove('active'));
    s.querySelector(`[onclick*="'${sv}'"]`)?.classList.add('active');
    const chains=Object.keys(D.offtake?.by_chain||{});
    const brands=(D.primary?.by_brand||[]).map(b=>b.name);
    const fy=fyKey();
    buildInventoryHealth();
  }
}

/* ---------------- PRIMARY (Legacy, now called from Channel Dynamics) -------- */
function buildPrimary(){
  const p=D.primary,s=document.getElementById('tab-primary'),qc=D.chain_allocation_qc;
  if(fyUnsupported()){
    const fp=FPX(fyTag())||FP27();
    if(fp){
      // FY26-27 actuals (Apr'26+) from the article-wise primary, chain-allocated
      let zones=fp.by_zone, chans=fp.by_channel, brands=fp.by_brand, chains=consolidateChains(fp.by_chain);
      if(fOn('Zone')) zones=zones.filter(z=>fHas('Zone',z.name));
      if(fOn('Channel')) chans=chans.filter(c=>fHas('Channel',c.name));
      if(fOn('Brand')) brands=brands.filter(b=>fHas('Brand',b.name));
      if(fOn('Chain')) chains=chains.filter(c=>fHas('Chain',c.name));
      // Use canonical "Mon-YY" labels (months_canon) for display when available.
      // Filter and drill still use the full month names from months_covered so that
      // F.Month stays consistent with detail_records Month values ("April", "May"…)
      // and the FY25/26 primary monthly chart's exact fHas() check still works.
      const _fpCanon = fp.months_canon || [];
      const _fpCoveredNames = fp.months_covered || [];
      // displayLabel: "Apr-26" if canon available, else "April"
      const _dispLabels = _fpCanon.length ? _fpCanon : _fpCoveredNames;
      let mSel=p.month_labels.map((m,i)=>({m,v:fp.monthly[i]})).filter(x=>_fpCoveredNames.includes(x.m));
      if(fOn('Month')) mSel=mSel.filter(x=>fHas('Month',x.m));
      // Build display-label version of mSel (canonical "Apr-26") while drill still fires full name
      const mSelDisp = mSel.map(x => {
        const i = _fpCoveredNames.indexOf(x.m);
        return {disp: i>=0&&_fpCanon[i] ? _fpCanon[i] : x.m, full: x.m, v: x.v};
      });
      const totNsv=chains.reduce((a,c)=>a+(c.nsv||0),0);
      const rows27=chains.filter(c=>c.nsv>0||fOn('Chain')).map(c=>`<tr><td>${drillLink('Chain',c.name)}</td>
        <td>${crc(c.nsv)}</td><td>${fp.nsv?(c.nsv/fp.nsv*100).toFixed(1)+'%':'–'}</td></tr>`).join('');
      s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>
       <p class="lead">FY27 year-to-date — ${_dispLabels.join(', ')} actuals, ₹ Crore.</p>
       <div class="kpis">
         ${kpi(`Primary NSV (${fyDispLabel('FY27')} YTD)`,crc(totNsv),fOn('Chain')?'filtered scope':`${_dispLabels.join(' + ')} actuals`)}
         ${kpi('Gross MRP Value',crc(fp.mrp),'Total MRP sales basis')}
         ${kpi('Active Chains',chains.filter(c=>c.nsv>0).length,`${brands.filter(b=>b.nsv>0).length} brands`)}
         ${kpi('Months Loaded',_dispLabels.length,_dispLabels.join(', '))}
       </div>
       <div class="grid g2">
         ${card(`Monthly NSV — ${fyDispLabel('FY27')}`+(fOn('Month')?` (filtered to ${fLab('Month')})`:''),'Actuals to date. Click a month to drill.',cv('prMonth'))}
         ${card(`By zone (${fyDispLabel('FY27')} YTD)`,fOn('Month')?'Zone shows full YTD — month filter applies only to the monthly chart above':'click to drill',cv('prZone',true))}
       </div>
       <div class="grid g2">
         ${card(`By channel (${fyDispLabel('FY27')} YTD)`,'click to drill',cv('prChan',true))}
         ${card(`By brand (${fyDispLabel('FY27')} YTD)`,'click to drill',cv('prBrand',true))}
       </div>
       ${card(`Chain-wise primary (${fyDispLabel('FY27')} YTD)`,'Chain-level (secondary-allocated for Distributor primary). Click a chain to drill.',`<div class="tablewrap"><table>
         <thead><tr><th>Chain</th><th>${fyDispLabel('FY27')} YTD NSV</th><th>Share</th></tr></thead>
         <tbody>${rows27||'<tr><td colspan="3">No chains for this filter.</td></tr>'}</tbody></table></div>`+
         (fp.chain_alloc_note?`<p class="note" style="margin:8px 0 0;font-size:0.82em;color:var(--muted)">ℹ ${fp.chain_alloc_note}</p>`:''))}
       ${allocSectionHtml()}`;
      wireDrillLinks(s);
      wireAllocExports(s);
      // Chart shows "Apr-26" labels; click drills to full name ("April") for filter consistency
      mkLine('prMonth',mSelDisp.map(x=>x.disp),[{label:fyDispLabel('FY27'),data:mSelDisp.map(x=>x.v),borderColor:C.teal,backgroundColor:C.teal+'22',fill:true}],v=>{const e=mSelDisp.find(x=>x.disp===v);drillTo('Month',e?e.full:v);});
      mkBarH('prZone',zones.map(z=>z.name),zones.map(z=>z.nsv),C.teal,true,v=>drillTo('Zone',v));
      mkDonut('prChan',chans.map(c=>c.name),chans.map(c=>c.nsv),true,v=>drillTo('Channel',v));
      const bb27=brands.filter(b=>(b.nsv||0)>0.5);
      mkBarH('prBrand',bb27.map(b=>b.name),bb27.map(b=>b.nsv),C.purple,true,v=>drillTo('Brand',v));
      renderCatDrillChart('prCatDrill',recFilter());
      return;
    }
    s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>${fyNoDataNote('the Primary source (Primary_FY202426_10.xlsx)')}${drillCardHtml('prDrill','Primary NSV')}`;
    renderDrillChart('prDrill','Primary NSV',recFilter());
    return;
  }
  // FY tags this block ACTUALLY covers, read from the data. The pre-aggregated
  // primary workbook used to be a fixed FY25/FY26 pair; it no longer is, and a
  // hardcoded pair here silently mislabels whatever the source really holds.
  const PT=(p.fy_tags&&p.fy_tags.length?p.fy_tags:['fy26']);
  const pPrev=PT.length>1?PT[PT.length-2]:null, pLast=PT[PT.length-1];
  // Like-for-like window (article-level). Carries the current FY, which the
  // pre-aggregated block deliberately does not publish -- see its coverage_note.
  const SP=(D.detail_meta&&D.detail_meta.same_period)||null;
  const spChain={}; if(SP&&SP.by_chain) SP.by_chain.forEach(r=>{spChain[r.name]=r;});
  const fy=fyKey(), yrs=fy?[fy]:PT.slice(-2), last=yrs[yrs.length-1], yrLab={};
  PT.concat(FY_ALL.map(t=>String(t).toLowerCase())).forEach(t=>{yrLab[t]=fyDispLabel(String(t).toUpperCase());});
  if(fy && !yrLab[fy]) yrLab[fy]=fyDispLabel('FY'+fy.slice(2));   // backfill FY27+ label
  let chains=p.by_chain, zones=p.by_zone, brands=p.by_brand, channels=p.by_channel;
  if(fOn('Chain')) chains=chains.filter(c=>fHas('Chain',c.name));
  if(fOn('Zone')) zones=zones.filter(z=>fHas('Zone',z.name));
  if(fOn('Brand')) brands=brands.filter(b=>fHas('Brand',b.name));
  if(fOn('Channel')) channels=channels.filter(c=>fHas('Channel',c.name));
  let mLabels=p.month_labels, mPrev=pPrev?(p['monthly_'+pPrev]||null):null, mLast=p['monthly_'+pLast]||[];
  if(fOn('Month')){
    const sel=p.month_labels.map((m,i)=>({m,i})).filter(x=>fHas('Month',x.m));
    // Guard each series separately: indexing a FY series this source does not
    // carry used to throw and blank the whole tab.
    if(sel.length){ const _mp=mPrev, _ml=mLast; mLabels=sel.map(x=>x.m);
      mPrev=_mp?sel.map(x=>_mp[x.i]):null; mLast=sel.map(x=>_ml[x.i]); }
  }
  // YoY: the FY pair when this source holds one, else the like-for-like window.
  const chainYoY=c=>(c.yoy!=null?c.yoy:((spChain[c.name]||{}).yoy_pct));
  const rows=chains.filter(c=>c[last]>0).map(c=>{const y=chainYoY(c);
    return `<tr><td>${drillLink('Chain',c.name)}</td>${pPrev?`<td>${crc(c[pPrev])}</td>`:''}<td>${crc(c[pLast])}</td>
     <td>${y!=null?`<span class="pill ${y>=0?'g':'r'}">${pct(y)}</span>`:'–'}</td></tr>`;}).join('');
  const qcNote=(qc&&qc.allocated_coverage_pct!=null)?`<p class="note" style="margin:0 0 16px">
     <b>Chain-level, not distributor-level:</b> Distributor-billed primary is split across the
     chains each ship-to actually serves, weighted by that chain's share of the ship-to's own
     secondary/offtake billing (same method as the Power BI model's Ship-to allocation) —
     ${qc.allocated_coverage_pct}% of Distributor primary (${crc(qc.chain_allocated_total)})
     is allocated this way; the remainder (no matching Ship-To × Brand × Month allocation entry,
     mainly FY24-25) keeps its original single-chain tag.</p>`:'';
  const dimNote=dimUnsupportedNote(['Category','SubCategory','Range','PackSize','Article'],'this source (see the Category & Pack tab for those)');
  // Say plainly which FY this source covers and where the newer one lives, so a
  // missing FY column reads as coverage rather than as a gap in the business.
  const spNote=(!fy&&SP&&p.coverage_note)?`<p class="note" style="margin:0 0 16px">
     <b>${SP.curr_fy} is not in this pre-aggregated source.</b> It is article-level and shown above as a
     like-for-like ${SP.n_months}-month figure (${SP.months.join(' + ')}) against ${SP.prev_fy}.
     A part-year FY compared against a full FY is not a YoY, so the two are never mixed here.</p>`:'';
  s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>
   <p class="lead">Billed NSV from Honasa to MT chains. ${fy?`${yrLab[fy]} only (filtered).`:`${pPrev?`${yrLab[pPrev]} vs `:''}${yrLab[pLast]}, ₹ Crore.`}</p>
   ${dimNote}
   ${spNote}
   ${qcNote}
   <div class="kpis">
     ${fy? kpi(`Primary NSV ${yrLab[fy]}`,crc(chains.reduce((a,c)=>a+(c[fy]||0),0)),fOn('Chain')||fOn('Zone')||fOn('Brand')||fOn('Channel')?'filtered scope':'') :
       kpi(`Primary NSV ${yrLab[pLast]}`,crc(p['nsv_'+pLast]),pPrev?`<span class="${cls(p.yoy)}">${arrow(p.yoy)} ${pct(p.yoy)}</span> YoY`:`${p.month_labels?'full year':''}`)}
     ${!fy&&SP? kpi(`Primary ${SP.curr_fy} (${SP.n_months} mth)`,crc(SP.curr),
         `<span class="${cls(SP.yoy_pct)}">${arrow(SP.yoy_pct)} ${pct(SP.yoy_pct)}</span> vs ${SP.prev_fy} same period`) :
      !fy? kpi(`Primary NSV ${pPrev?yrLab[pPrev]:'prior FY'}`,crc(pPrev?p['nsv_'+pPrev]:null),'base year') :
       kpi('Gross MRP Value',crc(p['mrp_'+pLast]),`${yrLab[pLast]} MRP basis`)}
     ${!fy? kpi(`Gross MRP Value ${yrLab[pLast]}`,crc(p['mrp_'+pLast]),'at MRP basis') : ''}
     ${kpi('Active Chains',chains.filter(c=>c[last]>0).length,`${p.n_brands} brands`)}
   </div>
   <div class="grid g2">
     ${card(`Monthly NSV — ${pPrev?`${yrLab[pPrev]} vs `:''}${yrLab[pLast]}`+(fOn('Month')?` (filtered to ${fLab('Month')})`:''),'Calendar-aligned Apr→Mar. Click a month to drill.',cv('prMonth'))}
     ${card('By zone'+(fy?` (${yrLab[fy]})`:` (${pPrev?`${yrLab[pPrev]} vs `:''}${yrLab[pLast]})`),'click to drill',cv('prZone',true))}
   </div>
   <div class="grid g2">
     ${card('By channel'+(fy?` (${yrLab[fy]})`:''),'click to drill',cv('prChan',true))}
     ${card('By brand'+(fy?` (${yrLab[fy]})`:` (${yrLab[pLast]})`),'click to drill',cv('prBrand',true))}
   </div>
   ${card(`Chain-wise primary &amp; YoY (${yrLab[last]})`,'Sorted by NSV — chain-level (secondary-allocated for Distributor primary), not distributor-name-wise. Click a chain to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>Chain</th>${pPrev?`<th>${yrLab[pPrev]}</th>`:''}<th>${yrLab[pLast]}</th><th>YoY${!pPrev&&SP?` (${SP.curr_fy} vs ${SP.prev_fy}, ${SP.n_months} mth)`:''}</th></tr></thead><tbody>${rows||`<tr><td colspan="${pPrev?4:3}">No chains for this filter.</td></tr>`}</tbody></table></div>`)}
   ${allocSectionHtml()}
   ${catDrillCardHtml('prCatDrill')}`;
  wireDrillLinks(s);
  wireAllocExports(s);
  mkLine('prMonth',mLabels,[
    ...(mPrev?[{label:yrLab[pPrev],data:mPrev,borderColor:C.blue,dash:[5,4]}]:[]),
    {label:yrLab[pLast],data:mLast,borderColor:C.teal,backgroundColor:C.teal+'22',fill:true}],v=>drillTo('Month',v));
  if(fy){
    mkBarH('prZone',zones.map(z=>z.name),zones.map(z=>z[fy]),C.teal,true,v=>drillTo('Zone',v));
  } else {
    mkBar('prZone',zones.map(z=>z.name),[
      ...(pPrev?[{label:yrLab[pPrev],data:zones.map(z=>z[pPrev]),backgroundColor:C.blue+'cc',borderRadius:4}]:[]),
      {label:yrLab[pLast],data:zones.map(z=>z[pLast]),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo('Zone',v));
  }
  mkDonut('prChan',channels.map(c=>c.name),channels.map(c=>c[last]),true,v=>drillTo('Channel',v));
  const bb=brands.filter(b=>b[last]>0.5);
  mkBarH('prBrand',bb.map(b=>b.name),bb.map(b=>b[last]),C.purple,true,v=>drillTo('Brand',v));
  renderCatDrillChart('prCatDrill',recFilter());
}

/* ---------- Distributor primary -> Chain allocation (QC & recon) ---------- */
// Rendered on the Primary tab from D.alloc (built by allocate_dist_primary in
// build_dashboard_data.py). Display tables show a compact slice; the "Export
// ALL" buttons download the FULL stored arrays as Excel, independent of the
// visible slice.
function allocSectionHtml(){
  const al=D.alloc;
  if(!al) return '';
  const ov=al.recon.overall;
  const isZero=m=>Math.abs(ov[m].variance||0)<0.01;
  const allZero=['qty','mrp_sales','nsv','tax'].every(isZero);
  const fmtM=(m,v)=>m==='qty'?num(v):crc(v);
  const reconRows=[['NSV','nsv'],['Total MRP sales','mrp_sales'],['Inv Qty','qty'],['Inv. Tax Amount','tax']]
    .map(([lab,m])=>`<tr><td>${lab}</td><td>${fmtM(m,ov[m].original)}</td><td>${fmtM(m,ov[m].allocated)}</td>
      <td class="${isZero(m)?'up':'down'}">${ov[m].variance}</td></tr>`).join('');
  const monthRows=al.recon.by_month.map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td>
      <td class="${Math.abs(r.nsv_var||0)<0.01?'up':'down'}">${r.nsv_var}</td><td>${num(r.orig_qty)}</td><td>${num(r.alloc_qty)}</td><td>${r.qty_var}</td></tr>`).join('');
  const brandRows=al.recon.by_brand.map(r=>`<tr><td>${r.brand}</td><td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td>
      <td class="${Math.abs(r.nsv_var||0)<0.01?'up':'down'}">${r.nsv_var}</td><td>${crc(r.orig_mrp)}</td><td>${crc(r.alloc_mrp)}</td><td>${r.mrp_var}</td></tr>`).join('');
  const missRows=al.missing_mapping.map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${r.brand}</td><td>${r.cust_code}</td>
      <td>${r.ship_to}</td><td>${crc(r.nsv)}</td><td>${num(r.rows)}</td></tr>`).join('');
  const ca=al.cust_article;
  const caSlice=ca.rows.slice(0,40).map(r=>`<tr><td>${r.cust_code}</td><td>${r.ship_to}</td><td>${r.article}</td>
      <td>${r.brand}</td><td>${r.range||'–'}</td><td>${r.pack||'–'}</td><td>${r.month} ${r.fy}</td><td>${drillLink('Chain',r.chain)}</td>
      <td>${crc(r.nsv)}</td><td>${num(r.qty)}</td><td>${r.w_avg_tot==null?'–':r.w_avg_tot+'%'}</td></tr>`).join('');
  const contBad=Object.keys(al.cont_pct_bad_keys||{}).length;
  // Phase 4: Governance insights (optional — absent in older data.js builds)
  const gov=al.governance||null;
  const govBadge=t=>{
    const m={'Eligible':'#1c6b3a|#e8f5ec|#b7e0c4','Eligible_TAT':'#7c5f00|#fff8e1|#ffe082',
             'Brand_Not_Listed':'#7c4700|#fff3e0|#ffcc80','Article_Not_Listed':'#7c4700|#fff3e0|#ffcc80',
             'Not_Eligible':'#9b1c1c|#fdecea|#f5c6cb'}[t]||'#555|#f5f5f5|#ccc';
    const[c,b,bo]=m.split('|');
    return `<span style="font-size:0.79em;padding:2px 8px;border-radius:10px;font-weight:600;background:${b};color:${c};border:1px solid ${bo};white-space:nowrap">${t||'–'}</span>`;
  };
  const qcSlice=al.qc_table.slice(0,25).map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${r.brand}</td><td>${r.cust_code}</td><td>${r.ship_to}</td>
      <td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td><td>${r.nsv_var}</td>
      <td class="${r.mapping_status==='Mapped'?'up':'down'}">${r.mapping_status}</td>
      <td>${r.eligibility_tier?govBadge(r.eligibility_tier):'–'}</td>
      <td style="text-align:right">${r.eligibility_confidence_pct!=null?r.eligibility_confidence_pct+'%':'–'}</td></tr>`).join('');
  const banner=allZero
    ?`<div class="repbanner" style="background:#e8f5ec;border-color:#b7e0c4;color:#1c6b3a"><b>Reconciled — zero variance.</b>
        Original Dist. primary input equals allocated output on all four measures (NSV, Total MRP sales, Inv Qty, Tax).
        Cont%s are normalised to sum to exactly 100% per Ship-To × Brand × Month, so reconciliation holds at every
        grain by construction — verified overall, by Month and by Brand below.
        ${al.rows_nearest?` <b>${num(al.rows_nearest)} rows (${crc(al.nearest_nsv)}) used the same distributor's split from the
        nearest month</b> (no cont-sheet entry for that exact month; QC-tagged, and proposed as permanent rows in
        <code>${al.patch_file}</code> for sign-off).`:''}
        ${al.rows_unmapped?` <b>${num(al.rows_unmapped)} rows (${crc(al.unmapped_nsv)}) have no cont-sheet data at all</b> and are kept under
        "Unmapped Chain" (never dropped, never blank) — see the missing-mapping table and the patch file's proposals.`:''}</div>`
    :`<div class="repbanner"><b>Reconciliation variance detected</b> — check the summary below.</div>`;
  return `<details style="margin:20px 0 0">
   <summary style="cursor:pointer;font-size:15px;font-weight:700;color:var(--teal);padding:6px 0">
     Methodology &amp; Data Quality — Distributor → Chain allocation${allZero?' ✓ reconciled':' ⚠ variance'}</summary>
   <div style="margin:8px 0 0">
   <p class="note" style="margin:0 0 10px">${al.method}</p>
   ${banner}
   ${al.rows_chain_equals_shipto?`<p class="drillhint" style="margin:0 0 10px">QC flag: ${num(al.rows_chain_equals_shipto)} DIRECT rows in the SOURCE file have
     "Chain name for Dashboard" identical to the Ship To Name (source-data maintenance issue, e.g. SAI SAACHI ASSOCIATES-MT-OR) — fix in the source file; the allocation itself never writes a Ship To Name into Chain.</p>`:''}
   ${contBad?`<p class="drillhint" style="margin:0 0 10px">⚠ ${contBad} cont% keys deviate from 100% before normalisation — flagged per QC rule 19.</p>`:''}
   <div class="grid g2">
     ${card('Reconciliation — original input vs allocated output','Across all Dist. rows (FULL uncapped population).',`<div class="tablewrap"><table>
       <thead><tr><th>Measure</th><th>Original</th><th>Allocated</th><th>Variance</th></tr></thead><tbody>${reconRows}</tbody></table></div>`)}
     ${card('Allocation counters','',`<div class="tablewrap"><table><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
       <tr><td>Dist. rows in → out (after chain split)</td><td>${num(al.dist_rows_in)} → ${num(al.dist_rows_out)}</td></tr>
       <tr><td>Chains allocated to</td><td>${num(al.chains_allocated_to)}</td></tr>
       <tr><td>Rows allocated via nearest-month split (QC-tagged)</td><td>${num(al.rows_nearest||0)} (${crc(al.nearest_nsv||0)})</td></tr>
       <tr><td>Rows with no cont-sheet data at all ("Unmapped Chain")</td><td>${num(al.rows_unmapped)} (${crc(al.unmapped_nsv)})</td></tr>
       <tr><td>Pending cont-sheet patch proposals for sign-off</td><td>${num(al.patch_rows||0)} rows → <code>${al.patch_file||''}</code></td></tr>
       <tr><td>Rows missing Avg Tot / TOT%</td><td>${num(al.missing_avg_tot_rows)}</td></tr>
       <tr><td>Cont% keys not summing to 100 (pre-normalisation)</td><td>${num(contBad)}</td></tr>
       <tr><td>Rows where Chain = Ship To Name (source issue, Direct rows)</td><td>${num(al.rows_chain_equals_shipto)}</td></tr>
       </tbody></table></div>`)}
   </div>
   <div class="grid g2">
     ${card('Cross-check by Month','Original vs allocated per month.',`<div class="tablewrap"><table>
       <thead><tr><th>Month</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Orig Qty</th><th>Alloc Qty</th><th>Var</th></tr></thead>
       <tbody>${monthRows}</tbody></table></div>`)}
     ${card('Cross-check by Brand','Original vs allocated per brand.',`<div class="tablewrap"><table>
       <thead><tr><th>Brand</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Orig MRP Sales</th><th>Alloc MRP Sales</th><th>Var</th></tr></thead>
       <tbody>${brandRows}</tbody></table></div>`)}
   </div>
   ${gov?`<div class="grid g2">
     ${card('Eligibility Tier Distribution','Governance tier counts from the allocation run. Not_Eligible NSV flags rows with no allocation source and not in offtake universe.',`<div class="tablewrap"><table>
       <thead><tr><th>Tier</th><th>Keys</th><th>NSV</th></tr></thead><tbody>
       ${['Eligible','Eligible_TAT','Brand_Not_Listed','Article_Not_Listed','Not_Eligible'].map(t=>{
         const n=(gov.eligibility_tier_counts||{})[t]||0;
         const nsvCell=t==='Not_Eligible'&&gov.not_eligible_nsv_lakh!=null
           ?`${crc(gov.not_eligible_nsv_lakh)} <span style="color:var(--muted);font-size:0.85em">(${gov.not_eligible_pct||0}% of Dist. NSV)</span>`
           :'–';
         return n?`<tr><td>${govBadge(t)}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${num(n)}</td><td style="font-variant-numeric:tabular-nums">${nsvCell}</td></tr>`:'';
       }).join('')||'<tr><td colspan="3">No governance data in this build.</td></tr>'}
       ${gov.flagged_rows?`<tr style="border-top:1px solid var(--border)"><td colspan="2" style="color:var(--muted);font-size:0.85em">Flagged rows CSV</td><td style="font-size:0.82em"><code>${gov.flagged_rows_csv||''}</code></td></tr>`:''}
       ${gov.override_count?`<tr><td colspan="2" style="color:var(--muted);font-size:0.85em">Approved overrides (PrimaryAllocationOverride.csv)</td><td style="text-align:right;font-variant-numeric:tabular-nums;color:#1c6b3a">${num(gov.override_count)}</td></tr>`:''}
       </tbody></table></div>`)}
     ${card('QC Gate Summary','Balance rate across Distributor × Brand × Month reconciliations. Build gate triggers when Not_Eligible NSV exceeds the --not-eligible-gate-pct threshold.',`<div class="tablewrap"><table>
       <thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
       ${(()=>{const r=gov.qc_report||{};return[
         ['Reconciliations logged',num(gov.reconciliations_logged||0)],
         ['Eligibility decisions logged',num(gov.decisions_logged||0)],
         ['Not_Eligible flagged keys',num(gov.flagged_rows||0)],
         ['Not_Eligible NSV',gov.not_eligible_nsv_lakh!=null?`${crc(gov.not_eligible_nsv_lakh)} (${gov.not_eligible_pct||0}%)`:'–'],
         ['Approved overrides',num(gov.override_count||0)],
         ['Total QC rows in report',num(r.total_rows||0)],
         ['Balanced rows',num(r.balanced_count||0)],
         ['Balance rate',r.balance_rate_pct!=null?r.balance_rate_pct+'%':'–'],
         ['Max absolute variance',r.max_abs_variance!=null?crc(r.max_abs_variance):'–'],
       ].map(([l,v])=>`<tr><td>${l}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${v}</td></tr>`).join('');})()}
       </tbody></table></div>`)}
   </div>`:''}
   ${card('Missing mapping QC — Dist. rows with no cont-sheet entry','These keep their value under "Unmapped Chain". Add the missing Ship-To × Brand × Month rows to Dist_primary_cont_based_on_secondary_MOM.xlsx and rebuild to allocate them.',`<div class="tablewrap"><table>
     <thead><tr><th>Month</th><th>Brand</th><th>Cust-SAP Code</th><th>Ship To Name</th><th>NSV</th><th>Rows</th></tr></thead>
     <tbody>${missRows||'<tr><td colspan="6">None — every Dist. row mapped.</td></tr>'}</tbody></table></div>`)}
   ${card(`Allocation QC — Month × Brand × Cust-SAP Code × Ship To (top 25 of ${num(al.qc_table_total_rows)})`,
     'Unmapped keys sort first, then by |NSV|.',`<button class="fbtn ghost" id="alExpQc" style="margin:0 0 8px">⭳ Export ALL QC rows (Excel)</button><div class="tablewrap"><table>
     <thead><tr><th>Month</th><th>Brand</th><th>Cust-SAP Code</th><th>Ship To Name</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Mapping</th><th>Eligibility</th><th>Confidence</th></tr></thead>
     <tbody>${qcSlice}</tbody></table></div>`)}
   ${card(`Customer × Article × Month × Chain allocation (top 40 shown; ${num(ca.rows.length)} exportable of ${num(ca.rows_total)} total, ${ca.value_coverage_pct}% of |NSV|)`,
     ca.note+' Click a chain to drill.',`<button class="fbtn ghost" id="alExpCa" style="margin:0 0 8px">⭳ Export ALL Customer × Article rows (Excel)</button><div class="tablewrap"><table>
     <thead><tr><th>Cust-SAP</th><th>Ship To</th><th>Article</th><th>Brand</th><th>Range</th><th>Pack</th><th>Month</th><th>Chain</th><th>NSV</th><th>Qty</th><th>W.Avg Tot</th></tr></thead>
     <tbody>${caSlice}</tbody></table></div>`)}
   </div></details>`;
}
function wireAllocExports(root){
  const al=D.alloc;
  if(!al) return;
  const qb=root.querySelector('#alExpQc');
  if(qb) qb.onclick=()=>{
    const rows=[['Month','FY','Brand','Cust-SAP Code','Ship To Name','Original NSV','Allocated NSV','Variance',
                 'Original Qty','Allocated Qty','Qty Variance','Original MRP Sales','Allocated MRP Sales','MRP Variance',
                 'Original Tax','Allocated Tax','Tax Variance','Mapping Status','Eligibility Tier','Eligibility Confidence %'],
      ...al.qc_table.map(r=>[r.month,r.fy,r.brand,r.cust_code,r.ship_to,r.orig_nsv,r.alloc_nsv,r.nsv_var,
        r.orig_qty,r.alloc_qty,r.qty_var,r.orig_mrp,r.alloc_mrp,r.mrp_var,r.orig_tax,r.alloc_tax,r.tax_var,
        r.mapping_status,r.eligibility_tier||'',r.eligibility_confidence_pct!=null?r.eligibility_confidence_pct:''])];
    downloadRowsXLSX(rows,exportFilename('Primary','Dist_Allocation_QC'),'Dist primary allocation QC (values in INR Lakh)');
  };
  const cb=root.querySelector('#alExpCa');
  if(cb) cb.onclick=()=>{
    const rows=[['Cust-SAP Code','Ship To Name','EAN No.','Article','Article MRP','Brand','Category','Sub-category','Range','Pack Size',
                 'Month','FY','Chain','NSV (Lakh)','Total MRP sales (Lakh)','Inv Qty','Tax (Lakh)','Weighted Avg Tot %'],
      ...al.cust_article.rows.map(r=>[r.cust_code,r.ship_to,r.ean,r.article,r.art_mrp,r.brand,r.category,r.sub_category,
        r.range,r.pack,r.month,r.fy,r.chain,r.nsv,r.mrp_sales,r.qty,r.tax,r.w_avg_tot])];
    downloadRowsXLSX(rows,exportFilename('Primary','CustXArticle_Allocation'),'Customer x Article x Month x Chain allocation (values in INR Lakh)');
  };
}

        <tbody>${brandRows||'<tr><td colspan="3">No brand data.</td></tr>'}</tbody></table></div>`)}
     ${card('BC offtake by category','Product category split.',
       `<div class="tablewrap"><table><thead><tr><th>Category</th><th>₹ L</th><th>Share</th></tr></thead>
        <tbody>${catRows||'<tr><td colspan="3">No category data.</td></tr>'}</tbody></table></div>`)}
   </div>
   ${card('State-wise BC offtake','Reliance Brand Counter sell-out by state.',
     `<div class="tablewrap"><table><thead><tr><th>State</th><th>Zone</th><th>₹ L</th></tr></thead>
      <tbody>${stRows||'<tr><td colspan="3">No state data.</td></tr>'}</tbody></table></div>`)}

/* ---------------- P&L ---------------- */
function buildPnl(){
  const pl=D.pnl,s=document.getElementById('tab-pnl');
  // The gross-to-net bridge is FY26-only (its source ends Mar'26), but the
  // TOT% and CM2 sections below run on the article-level detail which spans
  // FY26-27 -- so when the FY filter excludes FY26, swap ONLY the bridge for
  // an honest note and keep TOT%/CM2 visible instead of blanking the tab.
  const fy26ok=!(fOn('FY') && !fHas('FY','FY26'));
  let chains=pl.by_chain;
  if(fOn('Chain')) chains=chains.filter(c=>fHas('Chain',c.name));
  const top=chains.filter(c=>c.nsv>50 || fOn('Chain')).slice(0,12);
  const rows=chains.filter(c=>c.nsv>0).map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.mrp)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.discount)}</td><td>${c.discount_pct==null?'–':c.discount_pct+'%'}</td>
     <td>${c.promos||0}</td><td>${c.promo_depth==null?'–':c.promo_depth+'%'}</td></tr>`).join('');
  const totMrp=chains.reduce((a,c)=>a+(c.mrp||0),0), totNsv=chains.reduce((a,c)=>a+(c.nsv||0),0);
  const dimNote=dimUnsupportedNote(['Zone','Brand','Channel','Category','SubCategory','Range','PackSize','Article'],'the P&L source (chain-level only)');
  // TOT% (Trade Offer Terms % / On-Invoice Margin Pass-on %) — independent
  // article-level source (File 2), spans FY26-FY27; not gated by the FY26-only
  // guard above since its own data genuinely extends past FY26.
  const totD=D.tot;
  let totChains=totD?consolidateChains(totD.by_chain,'nsv'):[];
  if(fOn('Chain')) totChains=totChains.filter(c=>fHas('Chain',c.name));
  const totTop=totChains.slice(0,12);
  const totRows=totChains.map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.mrp)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.tax)}</td><td>${c.tot_pct==null?'–':c.tot_pct+'%'}</td><td>${crc(c.passon_value)}</td></tr>`).join('');
  const qcRows=(totD&&totD.qc_table||[]).map(r=>{
    const fa=r.finance_approved||'Pending';
    const faCls=fa.toLowerCase()==='yes'?'up':(fa.toLowerCase()==='no'?'down':'');
    const impact=r.impact_on_tot_pp!=null&&r.impact_on_tot_pp!==''?r.impact_on_tot_pp+' pp':'–';
    return `<tr><td>${r.category}</td><td>${r.hsn_code||'TBD'}</td><td>${r.pre_rate_pct}%</td><td>${r.post_rate_pct}%</td>
     <td>${r.effective_from||'(uses default)'}</td><td>${r.confidence}</td><td class="${faCls}">${fa}</td><td>${impact}</td></tr>`;
  }).join('');
  const mq=(totD&&totD.method_qc)||{};
  // dynamic banner: green/confirmed when the GST rate table wasn't actually
  // needed (fallback ~0% of MRP -- TOT% is real source data, not an
  // assumption), amber/provisional scoped to just the fallback slice otherwise.
  const fbPct=mq.fallback_pct_of_mrp;
  const totBanner=!totD?'':(fbPct==null||fbPct<0.05)
    ?`<div class="repbanner" style="background:#e8f5ec;border-color:#b7e0c4;color:#1c6b3a"><b>TOT% sourced from actual Primary file data</b> —
        Avg Tot / Inv. Tax Amount(LOC) covered every row; the GST rate table fallback was not needed
        ${fbPct==null?'':`(${fbPct}% of MRP)`}.</div>`
    :`<div class="repbanner"><b>Partially provisional.</b> ${fbPct}% of MRP (${num(mq.rows_gst_fallback)} rows) relies on the
        GST rate table fallback, pending Finance/Tax sign-off (${totD.finance_approved_count} of
        ${totD.finance_approved_total} categories confirmed). The remaining ${(100-fbPct).toFixed(1)}% uses actual
        source data (Avg Tot / Inv. Tax Amount).</div>`;
  // CM2 (Contribution Margin 2) = NSV - P&L Expenses. Expenses are never
  // hardcoded -- they come entirely from PowerBI/SeedData/Masters/
  // PL_Expense_Input.csv (see cm2_block in build_dashboard_data.py).
  const cm2D=D.cm2;
  // FM-25: the TOT%/CM2 KPI cards below (NSV, TOT Value, Total P&L Expense,
  // CM2 Value, and the "Blended TOT%" text) used to always read
  // totD.blended_tot_pct/total_passon_value and cm2D.total_nsv/total_expense/
  // cm2_value/cm2_pct -- server-side totals cm2_block()/tot_block() compute
  // from a FY26+FY27-combined population (fy_ge(df,"FY26"), no per-FY split)
  // -- so selecting FY26-only, FY27-only or no filter at all rendered
  // byte-identical numbers here, even though this same tab's gross-to-net
  // bridge above DOES honor the filter. Fixed the way FM-21/FM-22 fixed the
  // same pattern elsewhere: when the global filter names a single FY that
  // these blocks' own `monthly` (per-FY-per-month) arrays actually cover,
  // sum that FY's months client-side; otherwise fall back to the combined
  // view, unchanged, with its existing "FY26-FY27" labelling.
  const globalFy=fOne('FY');
  const cm2FyCoverage=[...new Set((cm2D&&cm2D.monthly||[]).map(r=>r.fy))];
  const totFyCoverage=[...new Set((totD&&totD.monthly||[]).map(r=>r.fy))];
  const cm2ScopedOk=!!(globalFy && cm2FyCoverage.includes(globalFy));
  const totScopedOk=!!(globalFy && totFyCoverage.includes(globalFy));
  let cm2Scoped=null;
  if(cm2ScopedOk){
    const rows=cm2D.monthly.filter(r=>r.fy===globalFy);
    const nsv=rows.reduce((a,r)=>a+(r.nsv||0),0), expense=rows.reduce((a,r)=>a+(r.expense||0),0);
    cm2Scoped={nsv, expense, cm2_value:nsv-expense,
               cm2_pct:nsv?Math.round((nsv-expense)/nsv*1000)/10:null,
               expense_pct_of_nsv:nsv?Math.round(expense/nsv*1000)/10:null};
  }
  let totScoped=null;
  if(totScopedOk){
    const rows=totD.monthly.filter(r=>r.fy===globalFy);
    const mrp=rows.reduce((a,r)=>a+(r.mrp||0),0), passon=rows.reduce((a,r)=>a+(r.passon_value||0),0);
    totScoped={mrp, passon_value:passon, tot_pct:mrp?Math.round(passon/mrp*1000)/10:null};
  }
  // filter set, names a real FY, but this specific block's own coverage
  // doesn't include it (e.g. a future FY not yet in the article-level detail)
  const cm2FyNote=(globalFy&&!cm2ScopedOk&&cm2D)
    ?`<p class="drillhint" style="margin:4px 0 0">${globalFy} is not in CM2's own coverage (${cm2FyCoverage.join(', ')||'none'}) -- showing the combined FY26-FY27 total instead.</p>`:'';
  const totFyNote=(globalFy&&!totScopedOk&&totD)
    ?`<p class="drillhint" style="margin:4px 0 0">${globalFy} is not in TOT%'s own coverage (${totFyCoverage.join(', ')||'none'}) -- showing the combined FY26-FY27 total instead.</p>`:'';
  let cm2Chains=cm2D?consolidateChains(cm2D.by_chain,'nsv'):[];
  if(fOn('Chain')) cm2Chains=cm2Chains.filter(c=>fHas('Chain',c.name));
  const cm2Top=cm2Chains.slice(0,12);
  const cm2Rows=cm2Chains.map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.expense)}</td><td>${crc(c.cm2_value)}</td><td>${c.cm2_pct==null?'–':c.cm2_pct+'%'}</td></tr>`).join('');
  const cm2HeadRows=(cm2D&&cm2D.by_expense_head||[]).map(h=>`<tr><td>${h.name}</td><td>${crc(h.amount)}</td></tr>`).join('');
  const cm2Monthly=(cm2D&&cm2D.monthly||[]);
  const cm2Latest=cm2Monthly.length?cm2Monthly[cm2Monthly.length-1]:null;
  const cm2Qc=(cm2D&&cm2D.qc)||{};
  const cm2NoData=!cm2D||!cm2D.has_expense_data;
  s.innerHTML=`<h2 class="sec">P&amp;L — Chain-wise Gross-to-Net &amp; Trade Spend</h2>
   ${fy26ok?`<p class="lead">${fyDispLabel('FY26')}. Bridge from gross MRP value to net NSV, plus promo intensity per chain.
     <b>Note:</b> COGS is not in source data, so this is a gross-to-net trade contribution view (retail margin + taxes + trade terms), not a full statutory P&amp;L.</p>
   ${dimNote}
   <div class="kpis">
     ${kpi('Gross MRP Value',crc(totMrp),fOn('Chain')?'filtered scope':'FY26, all chains')}
     ${kpi('Net NSV',crc(totNsv),'realised revenue')}
     ${kpi('MRP→NSV Gap',crc(totMrp-totNsv),totMrp?`${((totMrp-totNsv)/totMrp*100).toFixed(1)}% blended`:'')}
     ${kpi('Promo Lines',D.promo.n_promos,`${D.promo.avg_depth}% avg consumer depth`)}
   </div>
   <div class="grid g2">
     ${card('Gross-to-net by chain (FY26)','Net NSV vs the MRP→NSV gap (margin + taxes + trade). Click a chain to drill.',cv('plBridge'))}
     ${card('Trade-discount intensity (%) by chain','Higher = deeper gross-to-net gap — review spend ROI. Click to drill.',cv('plDisc'))}
   </div>
   ${card('Chain-wise trade P&amp;L','MRP value, net NSV, the gap, and promo activity per chain (FY26). Click a chain to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>Chain</th><th>MRP</th><th>NSV</th><th>Gap</th><th>Gap %</th><th>Promos</th><th>Avg depth</th></tr></thead>
     <tbody>${rows||'<tr><td colspan="7">No chains for this filter.</td></tr>'}</tbody></table></div>`)}`
   :`<div class="fynote"><b>${fLab('FY')} actuals not available</b> — the gross-to-net P&amp;L bridge (source ends Mar-26) —
      intentionally blank instead of a stale ${fyDispLabel('FY26')} number. TOT% and CM2 below still cover ${fyDispLabel('FY26')}–${fyDispLabel('FY27')}.</div>`}
   ${totD?`<h3 class="sec" style="font-size:15px;margin:20px 0 4px">Chain-wise TOT% (On-Invoice Margin Pass-on)</h3>
   <p class="note" style="margin:0 0 10px">${totScopedOk?fyDispLabel(globalFy):'FY26-FY27'}, article-level detail (File 2) — independent source from the FY26-only P&amp;L bridge above.
     TOT% = SUM(Pass-on Value) / SUM(MRP), sourced per row: Primary file's own <b>Avg Tot</b> first, actual

     ${(totScopedOk?totScoped.tot_pct:totD.blended_tot_pct)==null?'–':(totScopedOk?totScoped.tot_pct:totD.blended_tot_pct)+'%'} · total pass-on value ${crc(totScopedOk?totScoped.passon_value:totD.total_passon_value)}.

   ${totFyNote}

       <thead><tr><th>Chain</th><th>MRP</th><th>NSV</th><th>Tax</th><th>TOT%</th><th>Pass-on Value</th></tr></thead>
       <tbody>${totRows||'<tr><td colspan="6">No chains for this filter.</td></tr>'}</tbody></table></div>`)}
   </div>
   ${card('TOT% source QC summary','Row counts by source across the full FY26-FY27 article-level detail (not the row-capped browser export).',`<div class="tablewrap"><table>
     <thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>

     `<div class="tablewrap"><table><thead><tr><th>Category</th><th>HSN Code</th><th>Pre-GST%</th><th>Post-GST%</th>

function distFmtFootprintRows(dg){
  // Aggregate avg penetration per format from SKU-level dist_gap rows
  const fmt={};
  (dg.rows||[]).forEach(r=>{
    if(!r.group) return;
    if(!fmt[r.group]) fmt[r.group]={grp:r.group,target:r.target,sumPen:0,n:0,totCarry:0,totMiss:0};
    const f=fmt[r.group];
    f.sumPen+=r.penetration||0; f.n++;
    f.totCarry+=(r.carrying||0); f.totMiss+=(r.missing||0);
  });
  const rows=Object.values(fmt).sort((a,b)=>b.target-a.target);
  const body=rows.map(f=>{
    const avgPen=(f.sumPen/f.n).toFixed(1);
    const gap=(100-f.sumPen/f.n).toFixed(1);
    return `<tr><td>${f.grp}</td><td>${num(f.target)}</td><td>${avgPen}%</td><td>${gap}%</td></tr>`;
  }).join('');
  return `<div class="tablewrap"><table>
    <thead><tr><th>Format</th><th>Universe Stores</th><th>Avg Numeric Distribution</th><th>Gap%</th></tr></thead>
    <tbody>${body||'<tr><td colspan="4">No data.</td></tr>'}</tbody></table></div>`;
}
// Distribution Gap & Add-on Revenue Potential -- reads the D.dist_gap block
// (real store×article offtake, chain-format-comparable). Respects the global
// Category/Brand filters (reuses fOn/fHas); other dims (FY/Month/Zone/Chain)
// don't apply here since the gap is measured across a product's whole
// comparable-format store base, not a single chain/month.
function distGapRows(){
  const dg=D.dist_gap; if(!dg||!dg.rows) return [];
  let rows=dg.rows;
  if(fOn('Category')) rows=rows.filter(r=>fHas('Category',r.category));
  if(fOn('Brand'))    rows=rows.filter(r=>fHas('Brand',r.brand));
  return rows;
}
function distGapHtml(){
  const dg=D.dist_gap;
  if(!dg||!dg.rows||!dg.rows.length) return '';
  const W=dg.window_label||'window';
  const rows=distGapRows();
  const totAddon=rows.reduce((a,r)=>a+(r.addon_window||0),0);
  const totAddonAnn=rows.reduce((a,r)=>a+(r.addon_ann||0),0);
  const avgPen=rows.length?rows.reduce((a,r)=>a+(r.penetration||0),0)/rows.length:0;
  const top=rows.slice(0,25);
  const body=top.map(r=>`<tr>
     <td>${drillLink('Brand',r.brand)} · ${r.product}</td><td>${r.ean}</td><td>${r.group}</td>
     <td>${num(r.carrying)} / ${num(r.target)}</td><td>${num(r.missing)}</td>
     <td>${r.penetration}%</td><td>${crc(r.nsv_avg_ann)}/yr</td><td>${crc(r.nsv_window)}</td>
     <td>${num(r.latest_tp)}</td><td>${num(r.max_tp)}</td><td><b>${crc(r.addon_window)}</b></td></tr>`).join('');
  return `<h3 class="sec" style="font-size:15px;margin:22px 0 4px">Distribution Gap &amp; Add-on Revenue Potential</h3>
   <p class="note" style="margin:0 0 10px">Each product is compared ONLY against <b>comparable stores</b> — sites of its own
     chain <b>format</b> (Pharmacy / Hypermarket / Supermarket / Beauty Retail…), so a drug-store SKU is measured against
     drug-store doors, never against Dmart. <b>Target</b> = format-sites selling that product's category; <b>Carrying</b> =
     format-sites selling this SKU; <b>Add-on</b> = missing sites × NSV per carrying site. Real store×article offtake, window
     <b>${W}</b>${fOn('Category')||fOn('Brand')?' · filtered':''}. ${dg.n_months<3?'<i>Only '+dg.n_months+' months of store-level data loaded — refreshes to a true L3M once a third month is added.</i>':''}</p>
   <div class="kpis">
     ${kpi('Add-on Potential ('+W+')',crc(totAddon),'if gaps closed at current per-store rate')}
     ${kpi('Add-on Potential (annualised)',crc(totAddonAnn),'monthly avg × 12')}
     ${kpi('Products with Gap',num(rows.length),fOn('Category')||fOn('Brand')?'in this filter':'across comparable formats')}
     ${kpi('Avg Penetration',avgPen.toFixed(1)+'%',rows.length+' SKUs')}
   </div>
   <div class="grid g2">
     ${card('Add-on potential by store format ('+W+')','Where the biggest closable distribution gaps sit.',cv('dgGroup'))}
     ${card('Top 25 SKUs by add-on potential','Product · comparable format · carrying/target doors · penetration · add-on. Full list via ⭳ Export Table.',
       `<div class="tablewrap"><table>
       <thead><tr><th>Product</th><th>EAN</th><th>Group</th><th>Carrying / Target</th><th>Missing (${W})</th>
         <th>Penetration</th><th>NSV Avg</th><th>NSV ${W}</th><th>Latest TP</th><th>Max TP</th><th>Add-on (${W})</th></tr></thead>
       <tbody>${body||'<tr><td colspan="11">No products for this filter.</td></tr>'}</tbody></table></div>`)}
   </div>`;
}
function distGapChart(){
  const dg=D.dist_gap; if(!dg||!dg.rows||!dg.rows.length) return;
  // add-on by format, recomputed from the (filtered) rows so it tracks filters
  const rows=distGapRows(); const g={};
  rows.forEach(r=>{ g[r.group]=(g[r.group]||0)+(r.addon_window||0); });
  const ent=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  if(ent.length) mkBarH('dgGroup',ent.map(e=>e[0]),ent.map(e=>e[1]),C.amber,true);
}

// Multi-select filter state for promo section
let promoFilters = {
  months: new Set(),   // empty = all months
  chains: new Set(),   // empty = all chains
  kams: new Set()      // empty = all KAMs
};

// Initialize promo filter options from data
function initPromoFilters(){
  const pr = D.promo;
  const months = pr.months_available || [];
  const allChains = new Set();
  const allKams = new Set();

  // Collect unique chains and KAMs
  (pr.by_chain || []).forEach(c => allChains.add(c.name));
  Object.values(pr.monthly || {}).forEach(block => {
    (block.by_chain || []).forEach(c => {
      if(c.kam) allKams.add(c.kam);
      allChains.add(c.name);
    });
    (block.kam_status || {}).received?.forEach(k => allKams.add(k));
    (block.kam_status || {}).pending?.forEach(k => allKams.add(k));
  });

  return {
    months: months,
    chains: Array.from(allChains).sort(),
    kams: Array.from(allKams).sort()
  };
}

// Apply promo filters to data
function applyPromoFilters(data, filters) {
  if(!data || (!filters.months.size && !filters.chains.size && !filters.kams.size)) {
    return data; // No filters applied
  }

  // Filter by_chain
  if(filters.chains.size > 0 || filters.kams.size > 0) {
    data.by_chain = (data.by_chain || []).filter(c => {
      const chainMatch = !filters.chains.size || filters.chains.has(c.name);
      const kamMatch = !filters.kams.size || filters.kams.has(c.kam);
      return chainMatch && kamMatch;
    });
  }

  // Recalculate totals if filtered
  if(filters.chains.size > 0 || filters.kams.size > 0) {
    data.total_skus = (data.by_chain || []).reduce((s, c) => s + (c.skus || 0), 0);
    data.chains_in_promo = data.by_chain.length;
  }

  return data;
}

function buildPromoCSV() {
  const headers = ['Month', 'Chain', 'KAM', 'SKU Count', 'Avg Offer (%)', 'Status', 'Anomaly Flags'];
  const selectedMonths = Array.from(promoFilters.months).length > 0
    ? Array.from(promoFilters.months)

let promoAnomalyFilter = false; // Toggle for anomalies-only view

// Detect depth outliers (>50%)
function flagDepthOutliers(chain, minDepthPct = 50) {
  return (chain.avg_offer_pct != null && chain.avg_offer_pct > minDepthPct) ? 'depth_outlier' : null;
}

// Detect MoM spikes (>15% increase in depth from prior month)
function detectMoMSpikes(promo, selectedMonths = []) {
  const months = selectedMonths.length > 0 ? selectedMonths : promo.months_available || [];
  if (months.length < 2) return {};

  const monthlyData = promo.monthly || {};
  const spikes = {};

  for (let i = 1; i < months.length; i++) {
    const prevMonth = months[i - 1];
    const currMonth = months[i];
    const prevBlock = monthlyData[prevMonth];
    const currBlock = monthlyData[currMonth];

    if (!prevBlock || !currBlock) continue;

    const prevChainDepths = {};
    (prevBlock.by_chain || []).forEach(c => {
      prevChainDepths[c.name] = c.avg_offer_pct || 0;
    });

    (currBlock.by_chain || []).forEach(c => {
      const prevDepth = prevChainDepths[c.name] || 0;
      const currDepth = c.avg_offer_pct || 0;
      const spike = ((currDepth - prevDepth) / Math.max(prevDepth, 1)) * 100;

      if (spike > 15) {
        spikes[c.name] = { from: prevDepth, to: currDepth, spike: spike.toFixed(1) };
      }
    });
  }

  return spikes;
}

// Render anomaly indicators in KAM accountability table
function renderAnomalyBadge(chain, anomalies) {
  if (!chain || !anomalies) return '';

  const depthFlag = flagDepthOutliers(chain);
  const momSpike = anomalies[chain.name];

  let badges = '';
  if (depthFlag) {
    badges += `<span class="pill" style="background:#fef3e6;color:#9a5400;margin-right:4px;font-size:10px">⚠ High Depth ${chain.avg_offer_pct}%</span>`;
  }
  if (momSpike) {
    badges += `<span class="pill" style="background:#fef3e6;color:#9a5400;margin-right:4px;font-size:10px">↑ Spike ${momSpike.spike}%</span>`;
  }
  return badges;
}

// Thresholds come from D.config (config/analytics_config.json), never inlined.
const CFG=()=>D.config||{};
function ragClass(v,band){
  const b=((CFG().rag)||{})[band]; if(v==null||!b) return '';
  const {green:g,amber:a}=b;
  if(g==null||a==null) return '';
  if(b.lower_is_better) return v<=g?'g':(v<=a?'':'r');
  return v>=g?'g':(v>=a?'':'r');
}
function ragPill(v,band,fmt){
  if(v==null) return '–';
  return `<span class="pill ${ragClass(v,band)}">${fmt?fmt(v):v}</span>`;
}
// A non-passing layer explains itself instead of showing a confident-looking number.
// PASS and N/A need no explanatory note; AWAITING BUSINESS DATA and a genuine
// BLOCKED both do (either way, the reader needs to know why the number is withheld).
function gateNote(key){
  const g=((D.readiness||{}).gates||{})[key];
  if(!g||g.status==='PASS'||g.status==='N/A') return '';
  const isRealBlocker=g.status==='BLOCKED';
  return `<p class="note" style="margin:0 0 16px;border-left:4px solid var(--amber);padding-left:10px">
    <b>${isRealBlocker?'⚠':'⏳'} ${g.label}: ${isRealBlocker?'not yet reliable (technical issue)':'awaiting business data'}.</b> ${g.requires?`Needs ${g.requires}.`:''}
    Measured: ${g.measured}. ${g.unblocks_with?`<br><b>Unblocks with:</b> ${g.unblocks_with}`:''}</p>`;
}
function readinessCard(){
  const R=D.readiness; if(!R||!R.gates) return '';
  // PASS -> green, a genuine unresolved BLOCKED -> red, everything else (N/A,
  // AWAITING BUSINESS DATA) -> neutral: it is not a software failure, so it
  // must not render like one. Matches the existing amber/neutral RAG pattern
  // (ragClass()) already used elsewhere on this page.
  const pillClass=s=>s==='PASS'?'g':(s==='BLOCKED'?'r':'');
  const rows=Object.entries(R.gates).map(([k,g])=>`<tr>
    <td>${g.label}</td>
    <td><span class="pill ${pillClass(g.status)}">${g.status}</span></td>
    <td>${g.measured||'–'}</td><td>${g.unblocks_with||'–'}</td></tr>`).join('');
  return card('Data readiness gate',
    `${R.summary}. AWAITING BUSINESS DATA means the software is complete and correctly withholding the number until a named business/source input arrives — it is not broken. N/A means the layer is out of scope for this reporting surface.`,
    `<div class="tablewrap"><table><thead><tr><th>Layer</th><th>Status</th><th>Measured</th><th>Unblocks with</th></tr></thead>
     <tbody>${rows}</tbody></table></div>`);
}

// SKU NSV Volatility: flags articles whose month-to-month NSV swings hardest,
// using coefficient of variation (std dev / mean) rather than growth % alone --
// growth % compares only two points and says nothing about how erratic the
// months in between were. Respects whatever global filters (FY/Chain/etc.)
// are active via recFilter(), same as every other analytics block on this tab.
function computeSkuVolatility(){
  const recs=recFilter();
  const byArticle={};
  recs.forEach(r=>{
    if(!r.Article) return;
    const a=byArticle[r.Article]||(byArticle[r.Article]={Brand:r.Brand,Category:r.Category,months:{}});
    const mk=r.FY+'|'+r.Month;
    a.months[mk]=(a.months[mk]||0)+(r.NSV||0);
  });
  const MIN_MONTHS=3, MIN_AVG_LAKH=5; // below these, a "volatile" read is just noise from a thin series
  const rows=Object.entries(byArticle).map(([article,v])=>{
    const vals=Object.values(v.months);
    const n=vals.length;
    if(n<MIN_MONTHS) return null;
    const mean=vals.reduce((a,x)=>a+x,0)/n;
    if(mean<MIN_AVG_LAKH) return null;
    const variance=vals.reduce((a,x)=>a+(x-mean)*(x-mean),0)/(n-1); // sample std (n-1)
    const std=Math.sqrt(variance);
    return {article,brand:v.Brand,category:v.Category,n,mean,std,cv:std/mean*100};
  }).filter(Boolean);
  rows.sort((a,b)=>b.cv-a.cv);
  return {rows:rows.slice(0,12),min_months:MIN_MONTHS,min_avg_lakh:MIN_AVG_LAKH,n_qualifying:rows.length};
}
// NPI (new-product) launch cohorts.
//
// Two-layer design (per explicit review): STATIC IDENTITY, DYNAMIC
// PERFORMANCE.
//   - Cohort identity (which Chain x Article pairs exist, their actual
//     first-sale month, their npi_cohort_fy, their launch_confirmation_status)
//     comes ONLY from the pre-computed D.npd block (npd_block() in
//     build_dashboard_data.py), built once from the WHOLE detail_records
//     history. It is never recomputed from recFilter()/the dashboard's
//     global filter bar -- selecting a chain, category or month must never
//     change which pair launched when, or in which FY it's tracked.
//   - Performance (NSV, units, active count, contribution %, avg/launch,
//     productivity) IS filter-aware: it's recomputed from recFilter()'s
//     currently filtered detail_records, restricted to whichever cohort's
//     pairs are in view. This is the same global filter bar every other
//     Commercial Analytics card already reads -- no new filter mechanism.
// A local "cohort FY" selector (separate from the global filter bar's own
// FY dimension, which selects a REPORTING PERIOD, not a cohort) picks
// which launch cohort's pairs to look at; it defaults to the global FY
// filter when that matches an existing cohort, else the latest cohort.
let npiCohortFySel=null;
function npiSetCohortFy(fy){ npiCohortFySel=fy; buildAnalytics(); }

// Stable browser-side join key for a detail_records row: RAW Chain (never
// the dashboard's own canonicalized/bucketed r.Chain) + EAN (barcode),
// never Article display text.
//
// Two independent identity problems were found and fixed while building
// this, both proving text-based identity is unsafe here:
//  1. Article text: 31 of FY26's 3,136 cohort pairs carry a corrupted-
//     encoding (mojibake) Article string, and separately 466 EANs in this
//     dataset are recorded under more than one Article spelling (a
//     rebrand/rename) -- text can both under- and over-identify a
//     product. EAN (a plain digit string) has neither problem.
//  2. Chain text: this dashboard already runs a load-time normalization
//     pass (see the `(D.detail_records||[]).forEach(...)` block above)
//     that consolidates minor/immaterial distributor "chain" values (the
//     _MCD set, e.g. "SAI SAACHI ASSOCIATES-MT-OR") into a single
//     "Other (Unallocated Distributors)" bucket, mutating r.Chain in
//     place -- but preserves the ORIGINAL value on r._origChain first.
//     npd_block() (Python) never applies that same bucketing, so its
//     launches carry the RAW chain name. Joining against the mutated
//     r.Chain therefore silently drops every minor-distributor launch;
//     r._origChain is the one field both sides actually agree on.
// FLAGGED, not fixed here: NPI launches at these raw distributor-level
// "chains" (e.g. "SAI SAACHI ASSOCIATES-MT-OR") are consequently
// unreachable through the dashboard's own Chain filter dropdown, since
// that dropdown is built from the POST-bucketing r.Chain values -- a user
// can never filter the NPI card down to exactly that one distributor.
// Whether npd_block() should apply the SAME chain consolidation the rest
// of the dashboard uses (so NPI chain names always match what's
// selectable) is a real, separate business/product decision, not made
// unilaterally in this pass.
function npiRowKey(r){ return (r._origChain||r.Chain)+'||'+(r.EAN||r.Article); }

function computeNpiPerformance(npd,cohortFy){
  const cohortRows=npd.by_fy[cohortFy]||[];
  const anyFilterActive=FILT.some(([k])=>F[k].length);
  // No filter active: use the precomputed metrics directly. This is now a
  // fast path + validation oracle, not a workaround for a join gap -- the
  // filtered path below is proven (see tests/test_npi_filter_aware.js's
  // join-coverage tests) to reconcile back to these same totals when every
  // chain is selected individually and summed.
  if(!anyFilterActive){
    const m=npd.metrics_by_fy[cohortFy];
    return {
      rows:cohortRows, launches:m.npi_launches, active_count:m.active_npi_count,
      nsv:m.npi_nsv, units:m.npi_units,
      avg_per_launch:m.avg_nsv_per_launch, productivity:m.npi_productivity,
      contribution_pct:m.npi_contribution_pct,
      confirmed_count:m.confirmed_launch_count, observed_only_count:m.observed_only_launch_count,
      filtered_out:0, unmatched_pair_ids:[],
    };
  }
  const cohortPairIds=new Set(cohortRows.map(r=>r.pair_id));
  // MEMBERSHIP (which launches are "visible") and PERFORMANCE (their NSV/
  // units/active) are answered from two different windows over REC, per the
  // locked definition: "NPI Launches = number of unique Chain x Article
  // launch pairs belonging to the selected NPI FY cohort and current
  // dimensional filters. Date filters do not reassign cohort membership."
  //   - Membership ignores FY/Month (date dimensions) and looks at the
  //     pair's FULL history, not just its cohort-FY transactions -- a pair's
  //     chain/category/brand/etc. are stable identity facts, so a launch
  //     with ZERO sales in its own cohort year (e.g. a March carry-forward
  //     launch that never sold again) must still be counted as a launch
  //     when its other dimensions match the filter. Found via the
  //     chain-partition reconciliation test: without this distinction,
  //     summing NPI Launches across every chain filtered one at a time
  //     undercounted the true cohort total by exactly the number of such
  //     zero-activity launches.
  //   - Performance is still computed ONLY from the cohort's own reporting
  //     FY (recFilter('FY') deliberately excludes the global FY filter --
  //     the cohort's OWN FY is the mandatory performance window by
  //     definition) and, within that, from the exact filtered rows
  //     (including Month), so a zero-activity launch correctly contributes
  //     nsv=0, not a fabricated figure.
  const dateDims=new Set(['FY','Month']);
  const memberFilters=FILT.filter(([k])=>!dateDims.has(k)&&F[k].length);
  const visiblePairIds=new Set();
  if(!memberFilters.length){
    cohortPairIds.forEach(id=>visiblePairIds.add(id));
  }else{
    REC.forEach(r=>{
      const key=npiRowKey(r);
      if(!cohortPairIds.has(key)||visiblePairIds.has(key)) return;
      if(memberFilters.every(([k])=>F[k].includes(String(r[k])))) visiblePairIds.add(key);
    });
  }
  const filtered=recFilter('FY').filter(r=>r.FY===cohortFy);
  let nsv=0,qty=0,filteredTotalNsv=0; const active=new Set();
  filtered.forEach(r=>{
    filteredTotalNsv+=(r.NSV||0);
    const key=npiRowKey(r);
    if(!cohortPairIds.has(key)||!visiblePairIds.has(key)) return;
    const rowNsv=r.NSV||0;
    nsv+=rowNsv; qty+=(r.Qty||0);
    if(rowNsv>0) active.add(key);
  });
  const visibleRows=cohortRows.filter(r=>visiblePairIds.has(r.pair_id));
  const confirmed=visibleRows.filter(r=>r.launch_confirmation_status==='confirmed').length;
  const observedOnly=visibleRows.length-confirmed;
  return {
    rows:visibleRows,
    launches:visibleRows.length,
    active_count:active.size,
    nsv, units:qty,
    avg_per_launch:visibleRows.length?nsv/visibleRows.length:null,
    productivity:active.size?nsv/active.size:null,
    contribution_pct:filteredTotalNsv?nsv/filteredTotalNsv*100:null,
    confirmed_count:confirmed, observed_only_count:observedOnly,
    // filtered_out = cohort pairs not currently visible under the active
    // filters (e.g. a different chain selected) -- not a join failure. The
    // pair_id (Chain+EAN) join used above has zero known mismatches; see
    // npiJoinCoverage() for the standalone, all-pairs join-integrity check.
    filtered_out:cohortRows.length-visibleRows.length,
  };
}

// Join-integrity invariant, independent of any dashboard filter: every
// cohort pair_id (from D.npd, computed server-side from full history) must
// match at least one row in the FULL, unfiltered detail_records via the
// same Chain+EAN key the filtered performance path uses. A non-empty
// result here means the browser-side join is dropping real launches --
// this is a hard failure, not a warning (see tests/test_npi_filter_aware.js).
function npiJoinCoverage(npd){
  const allKeys=new Set(REC.map(npiRowKey));
  const unmatched=[];
  Object.values(npd.by_fy).forEach(rows=>rows.forEach(r=>{
    if(!allKeys.has(r.pair_id)) unmatched.push(r);
  }));
  return {total:Object.values(npd.by_fy).reduce((a,r)=>a+r.length,0), unmatched};
}

function npiCohortSection(){

     <b>Cohort membership is fixed</b> from the full sales history regardless of dashboard filters; the metrics below reflect whichever chain/category/month/etc. filters are currently active.

}
function skuVolatilitySection(){

  return `<h2 class="sec" style="margin-top:32px">SKU NSV Volatility</h2>

     `<div class="tablewrap"><table><thead><tr><th>Article</th><th>Brand</th><th>Category</th><th>Months</th><th>Avg NSV</th><th>Std Dev</th><th>CV%</th></tr></thead><tbody>${rows}</tbody></table></div>`)}`;

// Standard FMS (movement frequency) x ABC (value) x RIS (demand pattern)
// inventory classification -- an external, general-purpose convention (not a
// Honasa-specific rule), computed here on real NSV/frequency from
// detail_records. Reuses the exact same per-article monthly-NSV aggregation
// as computeSkuVolatility() above rather than a second independent read.
function computeInventoryClassification(){
  const recs=recFilter();
  const totalMonths=new Set(recs.map(r=>r.FY+'|'+r.Month)).size;
  const byArticle={};
  recs.forEach(r=>{
    if(!r.Article) return;
    const a=byArticle[r.Article]||(byArticle[r.Article]={Brand:r.Brand,Category:r.Category,months:{}});
    const mk=r.FY+'|'+r.Month;
    a.months[mk]=(a.months[mk]||0)+(r.NSV||0);
  });
  const MIN_AVG_LAKH=1; // exclude near-zero articles from classification noise
  let rows=Object.entries(byArticle).map(([article,v])=>{
    const vals=Object.values(v.months);
    const n=vals.length;
    const total=vals.reduce((a,x)=>a+x,0);
    const mean=total/n;
    if(mean<MIN_AVG_LAKH) return null;
    let cv=0;
    if(n>=2){
      const variance=vals.reduce((a,x)=>a+(x-mean)*(x-mean),0)/(n-1);
      cv=Math.sqrt(variance)/mean*100;
    }
    return {article,brand:v.Brand,category:v.Category,n,total,cv};
  }).filter(Boolean);

  // ABC: rank by NSV desc, classic cumulative-share cutoffs (70% / 90%)
  rows.sort((a,b)=>b.total-a.total);
  const grandTotal=rows.reduce((a,r)=>a+r.total,0);
  let running=0;
  rows.forEach(r=>{
    running+=r.total;
    const cumPct=grandTotal>0?100*running/grandTotal:0;
    r.valueClass=cumPct<=70?'A':cumPct<=90?'B':'C';
  });

  // FMS: share of the period's months with any real sale
  rows.forEach(r=>{
    const activeShare=totalMonths>0?r.n/totalMonths:0;
    r.movement=activeShare>=0.8?'F':activeShare>=0.4?'M':'S';
  });

  // RIS: coefficient of variation of monthly NSV (fewer than 2 active months
  // can't produce a variance, so it reads as Sporadic by definition)
  rows.forEach(r=>{
    r.demandPattern=r.n<2?'S':r.cv<50?'R':r.cv<100?'I':'S';
  });

  const ACTION={
    'A-F-R':'Highest priority — keep adequate stock, tight replenishment control',
    'A-S-S':'High value, low/erratic demand — strategic review before committing stock',
    'C-F-R':'Routine, easy replenishment — simpler control is enough',
    'C-S-S':'Potential obsolete — review for disposal/liquidation'
  };
  rows.forEach(r=>{ r.action=ACTION[`${r.valueClass}-${r.movement}-${r.demandPattern}`]||'Monitor — no standard rule for this combination yet'; });

  rows.sort((a,b)=>b.total-a.total);
  const dist={
    value:{A:rows.filter(r=>r.valueClass==='A').length,B:rows.filter(r=>r.valueClass==='B').length,C:rows.filter(r=>r.valueClass==='C').length},
    movement:{F:rows.filter(r=>r.movement==='F').length,M:rows.filter(r=>r.movement==='M').length,S:rows.filter(r=>r.movement==='S').length},
    pattern:{R:rows.filter(r=>r.demandPattern==='R').length,I:rows.filter(r=>r.demandPattern==='I').length,S:rows.filter(r=>r.demandPattern==='S').length}
  };
  return {rows:rows.slice(0,20),n_qualifying:rows.length,total_months:totalMonths,dist,min_avg_lakh:MIN_AVG_LAKH};
}

  const C=computeInventoryClassification();
