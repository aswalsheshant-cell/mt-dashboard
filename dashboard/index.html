<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MT Leadership Dashboard — Honasa / Mamaearth</title>
<script src="chart.umd.js"></script>
<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="xlsx.core.min.js"></script>
<style>
  :root{
    --teal:#2D9B7F; --teal-d:#1f7a63; --bg:#F4F1EC; --card:#ffffff;
    --ink:#1F2933; --muted:#6b7682; --line:#e4e0d8;
    --green:#1E8E3E; --red:#C0392B; --amber:#C77D17; --blue:#2b6cb0;
    --shadow:0 1px 3px rgba(31,41,51,.08),0 1px 2px rgba(31,41,51,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Aptos','Segoe UI',Calibri,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;padding:18px 26px}
  header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px}
  header p{margin:3px 0 0;font-size:13px;opacity:.92}
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px 60px}
  nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
      display:flex;gap:2px;overflow-x:auto;padding:0 10px;box-shadow:var(--shadow)}
  nav button{background:none;border:0;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);
      cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button.active{color:var(--teal-d);border-bottom-color:var(--teal)}
  section{display:none;padding-top:22px}
  section.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  h2.sec{font-size:17px;margin:6px 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:5px;line-height:1.1}
  .kpi .sub{font-size:12px;margin-top:4px;color:var(--muted)}
  .up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:880px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h3{margin:0 0 2px;font-size:14px}
  .card .note{margin:0 0 12px;font-size:12px;color:var(--muted)}
  .chartbox{position:relative;height:300px}
  .chartbox.sm{height:240px}
  .chartdl{position:absolute;top:0;right:0;z-index:6}
  .chartdl summary{list-style:none;cursor:pointer;width:24px;height:24px;border-radius:6px;
      background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13px;
      display:flex;align-items:center;justify-content:center}
  .chartdl summary::-webkit-details-marker{display:none}
  .chartdl summary:hover{background:var(--bg);color:var(--teal-d);border-color:var(--teal)}
  .chartdl-menu{position:absolute;top:28px;right:0;background:#fff;border:1px solid var(--line);
      border-radius:8px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;
      min-width:140px}
  .chartdl-menu button{background:none;border:0;text-align:left;font-family:inherit;font-size:12.5px;
      color:var(--ink);padding:7px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .chartdl-menu button:hover{background:var(--bg);color:var(--teal-d)}
  .pagedl{position:relative;align-self:flex-end}
  .pagedl summary{list-style:none;cursor:pointer}
  .pagedl summary::-webkit-details-marker{display:none}
  .pagedl .chartdl-menu{top:calc(100% + 4px)}
  .tblcard{position:relative}
  .tblexport{font-size:11.5px;font-weight:700;color:var(--teal-d);background:#fff;
      border:1px solid var(--teal);border-radius:7px;padding:4px 9px;cursor:pointer;
      font-family:inherit;margin:0 0 8px}
  .tblexport:hover{background:var(--teal);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--teal);color:#fff;font-weight:600;position:sticky;top:0}
  tbody tr:hover{background:#faf8f4}
  .tablewrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.g{background:#e6f4ea;color:var(--green)}.pill.r{background:#fce8e6;color:var(--red)}
  .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .icard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
  .icard.risk{border-left-color:var(--red)}.icard.win{border-left-color:var(--green)}.icard.watch{border-left-color:var(--amber)}
  .icard .tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .icard.risk .tag{color:var(--red)}.icard.win .tag{color:var(--green)}.icard.watch .tag{color:var(--amber)}
  .icard h4{margin:4px 0 6px;font-size:14.5px}
  .icard p{margin:0;font-size:13px;color:#374151;line-height:1.5}
  .wf{counter-reset:wf}
  .wf li{margin:0 0 10px;font-size:13.5px;line-height:1.5;padding-left:6px}
  .wf li b{color:var(--teal-d)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:24px}
  .badge{display:inline-block;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px;font-size:11.5px;margin-top:8px}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;box-shadow:var(--shadow)}
  nav{position:static;box-shadow:none}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;
      padding:10px 14px;border-top:1px solid var(--line);background:#fbfaf7}
  .filterbar .fl{display:flex;flex-direction:column;gap:2px}
  .filterbar .fl span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .filterbar select{font-family:inherit;font-size:12.5px;color:var(--ink);background:#fff;
      border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:104px;max-width:180px}
  .filterbar select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .fbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--teal);
      border:0;border-radius:8px;padding:8px 14px;cursor:pointer;align-self:flex-end}
  .fbtn:hover{background:var(--teal-d)}
  .fbtn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
  .fcount{font-size:12px;color:var(--muted);align-self:center;margin-left:auto}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:#e6f4ef;color:var(--teal-d);
      border:1px solid #bfe3d6;border-radius:16px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip b{cursor:pointer}
  .repbanner{background:#fff7e6;border:1px solid #f0d8a8;color:#8a5a00;border-radius:10px;
      padding:9px 13px;font-size:12.5px;margin:0 0 14px}
  .fynote{background:#fff7e6;border:1px solid #f0d8a8;color:#8a5a00;border-radius:8px;
      padding:6px 12px;font-size:12px;line-height:1.5;margin:0 0 12px}
  .methodbox{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:2px 14px;margin:0 0 14px}
  .methodbox summary{cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;
      color:var(--teal-d);padding:9px 0}
  .methodbox summary::-webkit-details-marker{display:none}
  .methodbox summary::before{content:'▸ ';font-size:10px}
  .methodbox[open] summary::before{content:'▾ '}
  .methodbox .note{padding-bottom:10px}
  .drill{cursor:pointer;border-bottom:1px dashed var(--teal-d)}
  .drill:hover{color:var(--teal-d);font-weight:700}
  .drillhint{font-size:11px;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Modern Trade Leadership Dashboard</h1>
  <p id="hSub">Honasa / Mamaearth — Primary · Offtake · P&amp;L · Category &amp; Pack · Forecast · Promo · Market Share · Distribution</p>
  <span class="badge" id="hPeriod"></span>
</header>
<div class="topbar">
  <nav id="nav"></nav>
  <div id="filterbar" class="filterbar"></div>
</div>
<div class="wrap">
  <section id="tab-explorer"></section>
  <section id="tab-overview"></section>
  <section id="tab-primary"></section>
  <section id="tab-offtake"></section>
  <section id="tab-reliance-bc"></section>
  <section id="tab-pnl"></section>
  <section id="tab-category"></section>
  <section id="tab-forecast"></section>
  <section id="tab-promo"></section>
  <section id="tab-share"></section>
  <section id="tab-distribution"></section>
  <section id="tab-comparison"></section>
  <section id="tab-insights"></section>
</div>
<footer id="foot"></footer>

<script src="data.js?v=20260703-3"></script>
<script>
const D = window.DASH;

/* ---- Chain consolidation: map distributor/ship-to names leaked into
   fyx_primary.by_chain / tot.by_chain to their canonical chain name.
   Source: ChainMaster.csv + ChainAccount_Mapping_PriorityView.csv.
   Multi-chain distributors (need cont% allocation) are grouped separately. ---- */
const _CC={
  'DC-D-Mart-Offline':'Dmart','JUST MARK-Dmart':'Dmart','D-Mart-Store-E-Com':'Dmart',
  'Reliance Retail-DC':'Reliance Retail','Reliance Retail-Store':'Reliance Retail',
  'RRL-FOC-Sample':'Reliance Retail','Reliance Retail-(Azorte)':'Azorte',
  'Nykaa E-Retail Limited':'Nykaa (FSN)','Metro-CNC':'Metro C&C',
  'Walmart-CNC':'Walmart','Health & Glow':'H&G',
  'Guardian Healthcare':'Guardian','Guardian Healthcare-Delhi':'Guardian',
  'Trent Hypermarket':'Trent','V-Mart Retail Limited':'V-Mart','V-Mart Retail':'V-Mart',
  'Travel News Services-Wsmith':'WH-Smith','Travel Retail Services-Relay':'Relay',
  'United Marketing':'Apollo','Eremedium Private Limited':'Eremedium',
  'AZORTE':'Azorte','Ratanadeep':'Ratnadeep',
  'Sancus':'RMT-Sancus','Gaurdian':'Guardian',
  'Aarambagh food mart':'Arambagh','V Mart East':'V-Mart',
  'VISHAL ENTERPRISES':'Vishal Mega Mart','Metro':'Metro C&C',
  'Mark Enterprise-Apollo':'Apollo','PRAGATI SALES-Apollo':'Apollo',
  'PRAGATI SALES-D-MART':'Dmart','JUST MARK-D-Mart':'Dmart',
  'Kiran Trading Company-Solapur-D-Mart':'Dmart','Kiran Trading Company-Pune-MT':'Dmart',
  'VISHAL ENTERPRISES-D-Mart':'Dmart','Az Enterprises-MT':'Az Enterprises',
  'Sancus Networks-MT-Reg.':'RMT-Sancus','R.C. Trade Link H&G':'H&G',
  'R.C. Trade Link':'H&G','Lifestyle Babyshop':'Lifestyle'
};
const _MCD=new Set([
  'Kiran Trading Company','G.V Enterprises','Sri Vijaya Durga Agencies',
  'Az Enterprises','VENKATESHWARA AGENCIES-TG','M/S KOTTARAM BUSINESS',
  'Sancus Networks Private Limited-RMT','D.L. Sales - MT',
  'Balaji Associates Distributor MT','CHHABRA TRADERS',
  'MARK ENTERPRISE','RR Traders-MT','REAL TIME LOGISTICS_MT_BR',
  'SAI SAACHI ASSOCIATES-MT-OR','CHOUDHARY ENTERPRISES','MANOJ SOAP AGENCY-MT',
  'Sehaj Enterprises -MT-JK','SRIJAN ENTERPRISES-MT-JH',
  'Vanaja Agencies','SC BUSINESS COMBINE_MT'
]);
function canonChain(n){return _CC[n]||n;}
function consolidateChains(arr,sortKey){
  sortKey=sortKey||'nsv';
  const m={};const dist={_name:'Other (Unallocated Distributors)',_list:[]};
  (arr||[]).forEach(c=>{
    const bucket=_MCD.has(c.name)?dist:(function(){const cn=canonChain(c.name);if(!m[cn])m[cn]={name:cn};return m[cn];}());
    if(_MCD.has(c.name)){dist._list.push(c);}
    Object.keys(c).forEach(k=>{if(k==='name')return;if(typeof c[k]==='number'){bucket[k]=(bucket[k]||0)+c[k];}});
  });
  if(dist._list.length){dist.name=dist._name;delete dist._name;delete dist._list; m['__dist__']=dist;}
  const out=Object.values(m).sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));
  out.forEach(c=>{
    if(c.mrp&&c.passon_value!=null)c.tot_pct=Math.round(c.passon_value/c.mrp*1000)/10;
    if(c.fy25&&c.fy26)c.yoy=Math.round((c.fy26-c.fy25)/c.fy25*1000)/10;
    if(c.cm2_pct!==undefined&&c.nsv)c.cm2_pct=Math.round((c.cm2_value||0)/c.nsv*1000)/10;
  });
  return out;
}
/* Apply chain consolidation to detail_records at load time so filters and
   all tab builders see canonical chain names. Original preserved as _origChain. */
(D.detail_records||[]).forEach(r=>{
  if(r.Chain){r._origChain=r.Chain;r.Chain=canonChain(r.Chain);if(_MCD.has(r._origChain))r.Chain='Other (Unallocated Distributors)';}
});

const C = {teal:'#2D9B7F',teald:'#1f7a63',blue:'#2b6cb0',amber:'#C77D17',red:'#C0392B',
           green:'#1E8E3E',grey:'#9aa4ad',purple:'#6b5b95',sand:'#cbb994'};
const PAL=[C.teal,C.blue,C.amber,C.purple,C.green,C.red,C.sand,C.grey];
Chart.defaults.font.family="'Aptos','Segoe UI',Calibri,sans-serif";
Chart.defaults.font.size=12; Chart.defaults.color='#475467';
Chart.defaults.plugins.legend.labels.boxWidth=12;
Chart.defaults.plugins.legend.labels.usePointStyle=true;
Chart.defaults.maintainAspectRatio=false;

// Values are stored in INR Lakh. crc() is the single money formatter used
// dashboard-wide: below Rs 100 L shows "Rs X.X L", at/above shows "Rs Y.YY Cr" --
// e.g. crc(75.5)='₹75.5 L', crc(250.17)='₹2.50 Cr', crc(31080)='₹310.80 Cr'.
const cr = v => v==null?'–':(v/100).toLocaleString('en-IN',{maximumFractionDigits:1});  // raw Cr number, no unit (internal use)
const crc = v => { if(v==null) return '–'; const av=Math.abs(v);
  return av<100 ? '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:1})+' L'
                : '₹'+(v/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' Cr'; };
const pct = v => v==null?'–':(v>0?'+':'')+v.toFixed(1)+'%';
const num = v => v==null?'–':Math.round(v).toLocaleString('en-IN');
// Quantity formatter (separate unit family from money -- never mix Value Cr with Qty
// Cr): shows "Qty Cr" (÷1 crore units) by default, degrading to "Qty L" only when the
// Cr-rounded figure would read as 0.00, so small quantities stay legible.
const qtyFmt = v => { if(v==null) return '–'; const crv=v/1e7;
  return Math.abs(crv)>=0.005 ? crv.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' Cr Qty'
                               : (v/1e5).toLocaleString('en-IN',{maximumFractionDigits:2})+' L Qty'; };
const cls = v => v==null?'':(v>=0?'up':'down');
const arrow = v => v==null?'':(v>=0?'▲':'▼');
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

function kpi(lab,val,sub){return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}
function card(title,note,inner,extraCls){
  // any card whose content includes a <table> automatically gets an "Export
  // Table" button -- applies dashboard-wide with zero changes needed at each
  // of the ~15 individual table call sites (see wireTableExports() delegation).
  const dl=/<table/i.test(inner)?`<button class="tblexport" data-title="${String(title).replace(/<[^>]+>/g,'').replace(/"/g,'&quot;')}">⭳ Export Table</button>`:'';
  return `<div class="card"><h3>${title}</h3>${note?`<p class="note">${note}</p>`:''}${dl}${inner}</div>`;
}
function cv(id,sm){return `<div class="chartbox${sm?' sm':''}">${chartDlHtml(id)}<canvas id="${id}"></canvas></div>`;}
// small download menu embedded on every chart card (native <details>, no extra
// JS state needed to open/close). Wired generically in wireChartDownloads()
// below via event delegation -- reads each chart's OWN live Chart.js data, so
// it always exports exactly what's on screen for the current filter.
function chartDlHtml(id){
  return `<details class="chartdl" data-cid="${id}"><summary title="Download chart">⭳</summary>
    <div class="chartdl-menu">
      <button data-fmt="png">🖼 PNG Image</button>
      <button data-fmt="csv">⭳ CSV Data</button>
      <button data-fmt="xlsx">⭳ Excel (Data + Visual)</button>
    </div></details>`;
}

let charts=[];
function destroyCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }
// shared click-to-drill: any chart passed an onClick(label) callback gets a
// pointer cursor + a click handler that resolves the clicked label and drills.
function _drillOpts(onClick){
  return onClick ? {onClick:(e,els,chart)=>{if(els.length) onClick(chart.data.labels[els[0].index]);},
    onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default';}} : {};
}
// ---- always-visible value labels (no external plugin dependency) ----
// Draws each chart's own values directly on bars/points/donut slices so they're
// visible by default, not just on hover. Registered once, applies to every
// chart via its own `valueLabels` plugin option (set by mkBar/mkBarH/mkLine/mkDonut
// below): {money:bool} selects crc() (₹ L/Cr) vs num() (plain count) formatting.
Chart.register({
  id:'valueLabels',
  afterDatasetsDraw(chart){
    const opt=chart.options.plugins&&chart.options.plugins.valueLabels;
    if(!opt||opt.display===false) return;
    const ctx=chart.ctx, fmt=opt.money===false?num:crc;
    ctx.save();
    ctx.font='11px Aptos, Segoe UI, Calibri, sans-serif';
    ctx.fillStyle='#3a4450';
    if(chart.config.type==='doughnut'){
      const data=chart.data.datasets[0].data, total=data.reduce((a,b)=>a+Math.abs(b),0)||1;
      const meta=chart.getDatasetMeta(0);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff'; ctx.font='bold 10.5px Aptos, Segoe UI, Calibri, sans-serif';
      meta.data.forEach((arc,i)=>{
        const v=data[i], share=Math.abs(v)/total;
        if(share<0.05) return;                       // thin slices: skip inline label, legend+tooltip still show it
        const ang=(arc.startAngle+arc.endAngle)/2, r=(arc.innerRadius+arc.outerRadius)/2;
        const x=arc.x+Math.cos(ang)*r, y=arc.y+Math.sin(ang)*r;
        ctx.fillText(`${(share*100).toFixed(0)}%`, x, y);
      });
    } else if(chart.config.type==='bar'){
      const horiz=chart.options.indexAxis==='y';
      ctx.textAlign=horiz?'left':'center'; ctx.textBaseline=horiz?'middle':'bottom';
      chart.data.datasets.forEach((ds,di)=>{
        const meta=chart.getDatasetMeta(di);
        if(meta.hidden) return;
        meta.data.forEach((bar,i)=>{
          const v=ds.data[i]; if(v==null) return;
          const label=fmt(v);
          if(horiz) ctx.fillText(label, bar.x+(v<0?-4:4), bar.y);
          else ctx.fillText(label, bar.x, bar.y-4);
        });
      });
    } else if(chart.config.type==='line'){
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      chart.data.datasets.forEach((ds,di)=>{
        const meta=chart.getDatasetMeta(di);
        if(meta.hidden) return;
        const n=ds.data.filter(v=>v!=null).length;
        // longer series (>6 pts): label only first/last/min/max to avoid a wall of
        // text -- charts here often overlay 2-3 series on one canvas, so even a
        // 12-point series densely labelled per-series gets unreadable fast.
        let idxToLabel=null;
        if(n>6){
          const vals=ds.data.map((v,i)=>({v,i})).filter(x=>x.v!=null);
          const mx=vals.reduce((a,b)=>b.v>a.v?b:a), mn=vals.reduce((a,b)=>b.v<a.v?b:a);
          idxToLabel=new Set([vals[0].i,vals[vals.length-1].i,mx.i,mn.i]);
        }
        meta.data.forEach((pt,i)=>{
          const v=ds.data[i]; if(v==null) return;
          if(idxToLabel && !idxToLabel.has(i)) return;
          // stagger by dataset index so overlapping series don't stack labels exactly
          ctx.fillText(fmt(v), pt.x, pt.y-6-(di%3)*12);
        });
      });
    }
    ctx.restore();
  }
});
function _labelOpts(money){ return {valueLabels:{money}}; }
function mkBar(id,labels,datasets,opts={},onClick){
  charts.push(new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets},
    options:Object.assign({plugins:{legend:{display:datasets.length>1,position:'top'},
      ..._labelOpts(opts.money),
      tooltip:{callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${opts.money===false?num(c.parsed.y??c.parsed.x):crc(c.parsed.y??c.parsed.x)}`}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eee'},ticks:{callback:v=>opts.money===false?num(v):crc(v)}},
              x:{grid:{display:false}}}},_drillOpts(onClick),opts.cfg||{})}));
}
function mkBarH(id,labels,data,color,money=true,onClick){
  charts.push(new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets:[{data,backgroundColor:color||C.teal,borderRadius:4}]},

/* ================= EXPORT INFRASTRUCTURE (chart / table / page) ================= */
// dashboard version / source note, embedded in every export (page footer, Excel
// metadata rows) per the "dashboard version / source note" + "Source: ... | Exported on ..." requirement
const DASH_VERSION='MT Dashboard — data.js built '+(D.meta&&D.meta.source||'Honasa MT working files');
function tabLabel(id){ const t=TABS.find(x=>x[0]===id); return t?t[1]:id; }
function activeFiltersSummary(){
  const active=FILT.filter(([k])=>F[k].length).map(([k,lab])=>`${lab}: ${F[k].join(', ')}`);
  return active.length?active.join(' | '):'None (all data)';
}
function exportTimestamp(){
  const d=new Date();
  return {compact:d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'),
          human:d.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})};
}
// e.g. MT_Dashboard_Primary_Chain_wise_primary_May26_20260703_1420
function exportFilename(pageLabel,chartLabel){
  const clean=s=>String(s).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'x';
  const scope=[fLab('Month'),fLab('FY')].filter(Boolean).join('_')||'All';
  return `MT_Dashboard_${clean(pageLabel)}_${clean(chartLabel)}_${clean(scope)}_${exportTimestamp().compact}`;
}
function downloadBlob(blob,filename){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function rowsToCSV(rows){
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  return rows.map(r=>r.map(esc).join(',')).join('\r\n');
}
function downloadRowsCSV(rows,filename){ downloadBlob(new Blob(['﻿'+rowsToCSV(rows)],{type:'text/csv;charset=utf-8'}),filename+'.csv'); }
// XLSX with a small metadata header (title/filters/export time) above the data --
// falls back to CSV automatically if the XLSX library didn't load for any reason.
function downloadRowsXLSX(rows,filename,title){
  if(typeof XLSX==='undefined'||!XLSX.utils){ downloadRowsCSV(rows,filename); return; }
  const ts=exportTimestamp();
  const meta=[[title||filename],[`Filters: ${activeFiltersSummary()}`],[`Exported: ${ts.human}`],[DASH_VERSION],[]];
  const ws=XLSX.utils.aoa_to_sheet([...meta,...rows]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Data');
  XLSX.writeFile(wb,filename+'.xlsx');
}
// "Visual" sheet AoA: recreates the on-screen chart CARD as an EDITABLE table
// (never a screenshot) -- title on top, left Label column, a middle
// proportional bar drawn with block characters (real, editable text cells --
// the vendored SheetJS community build can't write Excel data-bar conditional
// formatting, so this is the spec's allowed "formatted cells" fallback), and a
// right-hand Value column formatted like the card (₹x.xx Cr via crc()) plus a
// raw numeric column so the value stays editable/re-computable. Row order is
// exactly the chart's own order (already sorted high→low on the bar charts).
// Multi-series (grouped/stacked) charts list each series' value with no single
// bar, since the single-bar card metaphor doesn't map to multiple series.
function chartVisualAoA(chart,chartLabel){
  const labels=chart.data.labels||[];
  const dsets=(chart.data.datasets||[]).filter(d=>d.data&&d.data.length);
  const ts=exportTimestamp();
  const head=[[chartLabel||'Chart'],[`Filters: ${activeFiltersSummary()}`],[`Exported: ${ts.human}`],[]];
  const BAR=40;
  if(dsets.length===1){
    const vals=dsets[0].data.map(v=>Number(v)||0);
    const max=Math.max(1,...vals.map(v=>Math.abs(v)));
    const body=labels.map((lab,i)=>{
      const v=vals[i];
      const n=Math.max(0,Math.round(Math.abs(v)/max*BAR));
      return [lab,'█'.repeat(n),crc(v),v];
    });
    return [...head,['Label','Chart','Value (₹ Cr/L)','Value (raw, editable)'],...body];
  }
  const names=dsets.map((d,i)=>d.label||('Series '+(i+1)));
  const body=labels.map((lab,i)=>[lab,
    ...dsets.map(d=>crc(Number(d.data[i])||0)),
    ...dsets.map(d=>Number(d.data[i])||0)]);
  return [...head,['Label',...names,...names.map(s=>s+' (raw)')],...body];
}
// Chart Excel export = TWO sheets: Data (the same table CSV/XLSX already
// produced) + Visual (the editable card recreation above). Reuses the exact
// metadata header downloadRowsXLSX writes, so nothing about the Data sheet
// changes; the Visual sheet is purely additive. Falls back to CSV if the XLSX
// lib didn't load, same as downloadRowsXLSX.
function downloadChartXLSX(dataRows,filename,title,chart,chartLabel){
  if(typeof XLSX==='undefined'||!XLSX.utils){ downloadRowsCSV(dataRows,filename); return; }
  const ts=exportTimestamp();
  const meta=[[title||filename],[`Filters: ${activeFiltersSummary()}`],[`Exported: ${ts.human}`],[DASH_VERSION],[]];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([...meta,...dataRows]),'Data');
  const wsVis=XLSX.utils.aoa_to_sheet(chartVisualAoA(chart,chartLabel));
  wsVis['!cols']=[{wch:30},{wch:44},{wch:16},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsVis,'Visual');
  XLSX.writeFile(wb,filename+'.xlsx');
}
function findChartByCanvasId(id){ return Object.values(Chart.instances).find(c=>c.canvas.id===id); }
function chartExportRows(chart){
  const labels=chart.data.labels||[];
  const dsets=(chart.data.datasets||[]).filter(d=>d.data&&d.data.length);
  const header=['Label',...dsets.map((d,i)=>d.label||(dsets.length===1?'Value':'Series '+(i+1)))];
  // Pack Size chart: append Weighted TOT% / On-Invoice Margin Pass-on Value /
  // MoM TOT Delta pp / Incremental Pass-on Impact per pack size, from D.tot.by_packsize
  // (a separate computed source, not something the bar chart itself plots).
  let totFor=null;
  if(chart.canvas.id==='catPack' && D.tot && D.tot.by_packsize){
    const byName={}; D.tot.by_packsize.forEach(p=>byName[p.name]=p);
    totFor=lab=>{
      const p=byName[lab];
      return [p&&p.tot_pct!=null?p.tot_pct+'%':'–', p?crc(p.passon_value):'–',
              p&&p.mom_tot_delta_pp!=null?p.mom_tot_delta_pp+' pp':'–',
              p&&p.incremental_passon_impact!=null?crc(p.incremental_passon_impact):'–'];
    };
    header.push('Weighted TOT%','On-Invoice Margin Pass-on Value','MoM TOT Δ pp','Incremental Pass-on Impact');
  }
  if(dsets.length===1){
    const tot=dsets[0].data.reduce((a,b)=>a+(Math.abs(b)||0),0)||1;
    header.splice(dsets.length+1,0,'Share %');
    return [header,...labels.map((lab,i)=>[lab,dsets[0].data[i]??'',(Math.abs(dsets[0].data[i]||0)/tot*100).toFixed(1),...(totFor?totFor(lab):[])])];
  }
  return [header,...labels.map((lab,i)=>[lab,...dsets.map(d=>d.data[i]??''),...(totFor?totFor(lab):[])])];
}
function exportChart(canvasId,format){
  const c=findChartByCanvasId(canvasId);
  if(!c){ alert('Chart not available to export (it may be empty for this filter).'); return; }
  const titleEl=c.canvas.closest('.card')?.querySelector('h3');
  const chartLabel=titleEl?titleEl.textContent.replace(/[—–].*$/,'').trim():canvasId;
  const filename=exportFilename(tabLabel(currentTab),chartLabel);
  if(format==='png'){
    const a=document.createElement('a');a.href=c.toBase64Image('image/png',1);a.download=filename+'.png';a.click();
    return;
  }
  const rows=chartExportRows(c);
  if(rows.length<=1){ alert('No data to export for this chart / filter.'); return; }
  if(format==='csv') downloadRowsCSV(rows,filename);
  else downloadChartXLSX(rows,filename,`Chart: ${chartLabel} (${tabLabel(currentTab)})`,c,chartLabel);
}
// Table export: scrapes the already-rendered <table> (thead + tbody text),
// so it's guaranteed to match exactly what's on screen for the current
// filter -- no separate "what data backs this table" bookkeeping needed,
// and it can never drift out of sync with the visible values.
function tableToRows(tableEl){
  const rows=[];
  tableEl.querySelectorAll('thead tr').forEach(tr=>rows.push([...tr.children].map(c=>c.textContent.trim())));
  tableEl.querySelectorAll('tbody tr').forEach(tr=>rows.push([...tr.children].map(c=>c.textContent.trim())));
  return rows;
}
function exportTable(btn){
  const cardEl=btn.closest('.card');
  const table=cardEl&&cardEl.querySelector('table');
  if(!table){ alert('No table found to export.'); return; }
  const bodyRows=table.querySelectorAll('tbody tr');
  const empty=bodyRows.length===0||(bodyRows.length===1&&bodyRows[0].children.length===1);
  if(empty){ alert('No records to export for this table / filter.'); return; }
  const title=btn.dataset.title;
  const rows=tableToRows(table);
  const filename=exportFilename(tabLabel(currentTab),title);
  downloadRowsXLSX(rows,filename,`Table: ${title} (${tabLabel(currentTab)})`);
}
// Full-page export (PDF / PNG). Captures the CURRENTLY VISIBLE tab section
// in place with html2canvas -- deliberately NOT a detached clone, because
// <canvas> elements (every chart) don't carry their drawn pixels through
// innerHTML/cloneNode; only a live, on-screen canvas renders correctly for
// html2canvas to read. A header (title + active filters) and footer
// (source + export timestamp) are temporarily inserted into the real
// section, captured, then removed -- and every download-menu/export-button
// icon is hidden for the capture so they don't appear in the output.
async function exportPageImage(format){
  const section=document.getElementById('tab-'+currentTab);
  if(!section){ alert('Nothing to export.'); return; }
  const btn=document.querySelector('.pagedl summary');
  if(btn) btn.textContent='⏳ Preparing…';
  const ts=exportTimestamp();
  const header=document.createElement('div');
  header.style.cssText='margin:0 0 14px;border-bottom:2px solid #2D9B7F;padding-bottom:10px';
  header.innerHTML=`<div style="font-size:20px;font-weight:800;color:#1F2933;font-family:Aptos,'Segoe UI',Calibri,sans-serif">
      ${(D.meta&&D.meta.title)||'MT Leadership Dashboard'} — ${tabLabel(currentTab)}</div>
    <div style="font-size:12px;color:#6b7682;margin-top:4px">Active filters: ${activeFiltersSummary()}</div>
    <div style="font-size:11px;color:#6b7682;margin-top:2px">${D.meta&&D.meta.period||''}</div>`;
  const footer=document.createElement('div');
  footer.style.cssText='margin-top:16px;border-top:1px solid #e4e0d8;padding-top:8px;font-size:10.5px;color:#6b7682';
  footer.textContent=`Source: MT Dashboard | Exported on ${ts.human} | ${DASH_VERSION}`;
  section.insertBefore(header,section.firstChild);
  section.appendChild(footer);
  const hidden=section.querySelectorAll('.chartdl,.tblexport,#exExport');
  hidden.forEach(x=>x.style.visibility='hidden');
  // long tables get squeezed/cut across PDF pages — swap them for a short note
  // pointing at the per-table "Export Table" (Excel) button instead of rendering
  // dozens of rows into the page image
  const LONG_ROWS=8;
  const swappedTables=[];
  section.querySelectorAll('.tablewrap').forEach(wrap=>{
    const rows=wrap.querySelectorAll('tbody tr').length;
    if(rows>LONG_ROWS){
      const note=document.createElement('div');
      note.style.cssText='padding:14px;background:#f6f4ee;border:1px dashed #c9c2b3;border-radius:8px;font-size:12px;color:#6b7682';
      note.textContent=`Table with ${rows} rows omitted from this export — use the "⭳ Export Table" button on this card to download the full data as Excel.`;
      swappedTables.push({wrap,display:wrap.style.display});
      wrap.style.display='none';
      wrap.insertAdjacentElement('afterend',note);
      swappedTables[swappedTables.length-1].note=note;
    }
  });
  try{
    const canvas=await html2canvas(section,{scale:1.3,backgroundColor:'#ffffff',useCORS:true});
    const filename=exportFilename(tabLabel(currentTab),'FullPage');
    if(format==='png'){
      const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=filename+'.png';a.click();
    } else {
      const pdf=new window.jspdf.jsPDF({orientation:'p',unit:'pt',format:'a4'});
      const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight();
      const imgW=pageW,imgH=canvas.height*imgW/canvas.width;
      const imgData=canvas.toDataURL('image/png');
      let heightLeft=imgH,position=0;
      pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
      heightLeft-=pageH;
      while(heightLeft>0){
        position=heightLeft-imgH;
        pdf.addPage();
        pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
        heightLeft-=pageH;
      }
      pdf.save(filename+'.pdf');
    }
  } catch(err){
    alert('Export failed: '+err.message);
  } finally{
    header.remove(); footer.remove();
    hidden.forEach(x=>x.style.visibility='');
    swappedTables.forEach(({wrap,display,note})=>{ wrap.style.display=display; note.remove(); });
    if(btn) btn.textContent='⭳ Download Page';
  }
}
// event delegation: one listener covers every chart download menu, every
// table export button, and the page-level Download Page menu, present or
// future (tabs rebuild their DOM constantly), plus click-outside-to-close.
document.addEventListener('click',e=>{
  const dlBtn=e.target.closest('.chartdl-menu button[data-fmt]');
  if(dlBtn){
    const det=dlBtn.closest('details.chartdl');
    exportChart(det.dataset.cid,dlBtn.dataset.fmt);
    det.open=false;
    return;
  }
  const tblBtn=e.target.closest('.tblexport');
  if(tblBtn){ exportTable(tblBtn); return; }
  const pageBtn=e.target.closest('.pagedl .chartdl-menu button[data-pagefmt]');
  if(pageBtn){
    const det=pageBtn.closest('details.pagedl');
    exportPageImage(pageBtn.dataset.pagefmt);
    det.open=false;
    return;
  }
  document.querySelectorAll('details.chartdl[open],details.pagedl[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; });
});

         ${card('Monthly NSV — FY26-27'+(fOn('Month')?` (filtered to ${fLab('Month')})`:''),'Actuals to date. Click a month to drill.',cv('prMonth'))}
         ${card('By zone (FY27 YTD)','click to drill',cv('prZone',true))}
       </div>
       <div class="grid g2">
         ${card('By channel (FY27 YTD)','click to drill',cv('prChan',true))}
         ${card('By brand (FY27 YTD)','click to drill',cv('prBrand',true))}
       </div>
       ${card('Chain-wise primary (FY27 YTD)','Chain-level (secondary-allocated for Distributor primary). Click a chain to drill.',`<div class="tablewrap"><table>
         <thead><tr><th>Chain</th><th>FY27 YTD NSV</th><th>Share</th></tr></thead>
         <tbody>${rows27||'<tr><td colspan="3">No chains for this filter.</td></tr>'}</tbody></table></div>`+
         (fp.chain_alloc_note?`<p class="note" style="margin:8px 0 0;font-size:0.82em;color:var(--muted)">ℹ ${fp.chain_alloc_note}</p>`:''))}
       ${allocSectionHtml()}
       ${catDrillCardHtml('prCatDrill')}`;
      wireDrillLinks(s);
      wireAllocExports(s);
      mkLine('prMonth',mSel.map(x=>x.m),[{label:'FY26-27',data:mSel.map(x=>x.v),borderColor:C.teal,backgroundColor:C.teal+'22',fill:true}],v=>drillTo('Month',v));

      mkDonut('prChan',chans.map(c=>c.name),chans.map(c=>c.nsv),true,v=>drillTo('Channel',v));
      const bb27=brands.filter(b=>(b.nsv||0)>0.5);
      mkBarH('prBrand',bb27.map(b=>b.name),bb27.map(b=>b.nsv),C.purple,true,v=>drillTo('Brand',v));
      renderCatDrillChart('prCatDrill',recFilter());
      return;
    }
    s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>${fyNoDataNote('the Primary source (Primary_FY202426_10.xlsx)')}${catDrillCardHtml('prCatDrill')}`;
    renderCatDrillChart('prCatDrill',recFilter());
    return;
  }
  const fy=fyKey(), yrs=fy?[fy]:['fy25','fy26'], last=yrs[yrs.length-1], yrLab={fy25:'FY25',fy26:'FY26'};
  let chains=p.by_chain, zones=p.by_zone, brands=p.by_brand, channels=p.by_channel;

  if(fOn('Zone')) zones=zones.filter(z=>fHas('Zone',z.name));
  if(fOn('Brand')) brands=brands.filter(b=>fHas('Brand',b.name));
  if(fOn('Channel')) channels=channels.filter(c=>fHas('Channel',c.name));
  let mLabels=p.month_labels, m25=p.monthly_fy25, m26=p.monthly_fy26;
  if(fOn('Month')){
    const sel=p.month_labels.map((m,i)=>({m,i})).filter(x=>fHas('Month',x.m));
    if(sel.length){ mLabels=sel.map(x=>x.m); m25=sel.map(x=>p.monthly_fy25[x.i]); m26=sel.map(x=>p.monthly_fy26[x.i]); }
  }
  const rows=chains.filter(c=>c[last]>0).map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.fy25)}</td><td>${crc(c.fy26)}</td>
     <td><span class="pill ${c.yoy>=0?'g':'r'}">${pct(c.yoy)}</span></td></tr>`).join('');
  const qcNote=qc?`<p class="note" style="margin:0 0 16px">
     <b>Chain-level, not distributor-level:</b> Distributor-billed primary is split across the
     chains each ship-to actually serves, weighted by that chain's share of the ship-to's own
     secondary/offtake billing (same method as the Power BI model's Ship-to allocation) —
     ${qc.allocated_coverage_pct}% of Distributor primary (${crc(qc.chain_allocated_total)})
     is allocated this way; the remainder (no matching Ship-To × Brand × Month allocation entry,
     mainly FY24-25) keeps its original single-chain tag.</p>`:'';
  const dimNote=dimUnsupportedNote(['Category','SubCategory','Range','PackSize','Article'],'this source (see the Category & Pack tab for those)');
  s.innerHTML=`<h2 class="sec">Primary (Sell-in)</h2>
   <p class="lead">Billed NSV from Honasa to MT chains. ${fy?`${yrLab[fy]} only (filtered).`:'FY24-25 vs FY25-26, ₹ Crore.'}</p>
   ${dimNote}
   ${qcNote}
   <div class="kpis">
     ${fy? kpi(`Primary NSV ${yrLab[fy]}`,crc(chains.reduce((a,c)=>a+(c[fy]||0),0)),fOn('Chain')||fOn('Zone')||fOn('Brand')||fOn('Channel')?'filtered scope':'') :
       kpi('Primary NSV FY26',crc(p.nsv_fy26),`<span class="${cls(p.yoy)}">${arrow(p.yoy)} ${pct(p.yoy)}</span> YoY`)}
     ${!fy? kpi('Primary NSV FY25',crc(p.nsv_fy25),'base year') :
       kpi('Gross MRP Value',crc(p.mrp_fy26),'FY26 MRP basis (MRP not split by FY25/27)')}
     ${!fy? kpi('Gross MRP Value FY26',crc(p.mrp_fy26),'at MRP basis') : ''}
     ${kpi('Active Chains',chains.filter(c=>c[last]>0).length,`${p.n_brands} brands`)}
   </div>
   <div class="grid g2">
     ${card('Monthly NSV — FY24-25 vs FY25-26'+(fOn('Month')?` (filtered to ${fLab('Month')})`:''),'Calendar-aligned Apr→Mar. Click a month to drill.',cv('prMonth'))}
     ${card('By zone'+(fy?` (${yrLab[fy]})`:' (FY25 vs FY26)'),'click to drill',cv('prZone',true))}
   </div>
   <div class="grid g2">
     ${card('By channel'+(fy?` (${yrLab[fy]})`:''),'click to drill',cv('prChan',true))}
     ${card('By brand'+(fy?` (${yrLab[fy]})`:' (FY26)'),'click to drill',cv('prBrand',true))}
   </div>
   ${card(`Chain-wise primary &amp; YoY (${yrLab[last]})`,'Sorted by NSV — chain-level (secondary-allocated for Distributor primary), not distributor-name-wise. Click a chain to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>Chain</th><th>FY25</th><th>FY26</th><th>YoY</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No chains for this filter.</td></tr>'}</tbody></table></div>`)}
   ${allocSectionHtml()}
   ${catDrillCardHtml('prCatDrill')}`;
  wireDrillLinks(s);
  wireAllocExports(s);
  mkLine('prMonth',mLabels,[
    {label:'FY24-25',data:m25,borderColor:C.blue,dash:[5,4]},
    {label:'FY25-26',data:m26,borderColor:C.teal,backgroundColor:C.teal+'22',fill:true}],v=>drillTo('Month',v));
  if(fy){
    mkBarH('prZone',zones.map(z=>z.name),zones.map(z=>z[fy]),C.teal,true,v=>drillTo('Zone',v));
  } else {
    mkBar('prZone',zones.map(z=>z.name),[
      {label:'FY25',data:zones.map(z=>z.fy25),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:'FY26',data:zones.map(z=>z.fy26),backgroundColor:C.teal,borderRadius:4}],{},v=>drillTo('Zone',v));

  mkDonut('prChan',channels.map(c=>c.name),channels.map(c=>c[last]),true,v=>drillTo('Channel',v));
  const bb=brands.filter(b=>b[last]>0.5);
  mkBarH('prBrand',bb.map(b=>b.name),bb.map(b=>b[last]),C.purple,true,v=>drillTo('Brand',v));
  renderCatDrillChart('prCatDrill',recFilter());
}

/* ---------- Distributor primary -> Chain allocation (QC & recon) ---------- */
// Rendered on the Primary tab from D.alloc (built by allocate_dist_primary in
// build_dashboard_data.py). Display tables show a compact slice; the "Export
// ALL" buttons download the FULL stored arrays as Excel, independent of the
// visible slice.
function allocSectionHtml(){
  const al=D.alloc;
  if(!al) return '';
  const ov=al.recon.overall;
  const isZero=m=>Math.abs(ov[m].variance||0)<0.01;
  const allZero=['qty','mrp_sales','nsv','tax'].every(isZero);
  const fmtM=(m,v)=>m==='qty'?num(v):crc(v);
  const reconRows=[['NSV','nsv'],['Total MRP sales','mrp_sales'],['Inv Qty','qty'],['Inv. Tax Amount','tax']]
    .map(([lab,m])=>`<tr><td>${lab}</td><td>${fmtM(m,ov[m].original)}</td><td>${fmtM(m,ov[m].allocated)}</td>
      <td class="${isZero(m)?'up':'down'}">${ov[m].variance}</td></tr>`).join('');
  const monthRows=al.recon.by_month.map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td>
      <td class="${Math.abs(r.nsv_var||0)<0.01?'up':'down'}">${r.nsv_var}</td><td>${num(r.orig_qty)}</td><td>${num(r.alloc_qty)}</td><td>${r.qty_var}</td></tr>`).join('');
  const brandRows=al.recon.by_brand.map(r=>`<tr><td>${r.brand}</td><td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td>
      <td class="${Math.abs(r.nsv_var||0)<0.01?'up':'down'}">${r.nsv_var}</td><td>${crc(r.orig_mrp)}</td><td>${crc(r.alloc_mrp)}</td><td>${r.mrp_var}</td></tr>`).join('');
  const missRows=al.missing_mapping.map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${r.brand}</td><td>${r.cust_code}</td>
      <td>${r.ship_to}</td><td>${crc(r.nsv)}</td><td>${num(r.rows)}</td></tr>`).join('');
  const qcSlice=al.qc_table.slice(0,25).map(r=>`<tr><td>${r.month} ${r.fy}</td><td>${r.brand}</td><td>${r.cust_code}</td><td>${r.ship_to}</td>
      <td>${crc(r.orig_nsv)}</td><td>${crc(r.alloc_nsv)}</td><td>${r.nsv_var}</td>
      <td class="${r.mapping_status==='Mapped'?'up':'down'}">${r.mapping_status}</td></tr>`).join('');
  const ca=al.cust_article;
  const caSlice=ca.rows.slice(0,40).map(r=>`<tr><td>${r.cust_code}</td><td>${r.ship_to}</td><td>${r.article}</td>
      <td>${r.brand}</td><td>${r.range}</td><td>${r.pack}</td><td>${r.month} ${r.fy}</td><td>${drillLink('Chain',r.chain)}</td>
      <td>${crc(r.nsv)}</td><td>${num(r.qty)}</td><td>${r.w_avg_tot==null?'–':r.w_avg_tot+'%'}</td></tr>`).join('');
  const contBad=Object.keys(al.cont_pct_bad_keys||{}).length;
  const banner=allZero
    ?`<div class="repbanner" style="background:#e8f5ec;border-color:#b7e0c4;color:#1c6b3a"><b>Reconciled — zero variance.</b>
        Original Dist. primary input equals allocated output on all four measures (NSV, Total MRP sales, Inv Qty, Tax).
        Cont%s are normalised to sum to exactly 100% per Ship-To × Brand × Month, so reconciliation holds at every
        grain by construction — verified overall, by Month and by Brand below.
        ${al.rows_nearest?` <b>${num(al.rows_nearest)} rows (${crc(al.nearest_nsv)}) used the same distributor's split from the
        nearest month</b> (no cont-sheet entry for that exact month; QC-tagged, and proposed as permanent rows in
        <code>${al.patch_file}</code> for sign-off).`:''}
        ${al.rows_unmapped?` <b>${num(al.rows_unmapped)} rows (${crc(al.unmapped_nsv)}) have no cont-sheet data at all</b> and are kept under
        "Unmapped Chain" (never dropped, never blank) — see the missing-mapping table and the patch file's proposals.`:''}</div>`
    :`<div class="repbanner"><b>Reconciliation variance detected</b> — check the summary below.</div>`;
  return `<details style="margin:20px 0 0">
   <summary style="cursor:pointer;font-size:15px;font-weight:700;color:var(--teal);padding:6px 0">
     Methodology &amp; Data Quality — Distributor → Chain allocation${allZero?' ✓ reconciled':' ⚠ variance'}</summary>
   <div style="margin:8px 0 0">
   <p class="note" style="margin:0 0 10px">${al.method}</p>
   ${banner}
   ${al.rows_chain_equals_shipto?`<p class="drillhint" style="margin:0 0 10px">QC flag: ${num(al.rows_chain_equals_shipto)} DIRECT rows in the SOURCE file have
     "Chain name for Dashboard" identical to the Ship To Name (source-data maintenance issue, e.g. SAI SAACHI ASSOCIATES-MT-OR) — fix in the source file; the allocation itself never writes a Ship To Name into Chain.</p>`:''}
   ${contBad?`<p class="drillhint" style="margin:0 0 10px">⚠ ${contBad} cont% keys deviate from 100% before normalisation — flagged per QC rule 19.</p>`:''}
   <div class="grid g2">
     ${card('Reconciliation — original input vs allocated output','Across all Dist. rows (FULL uncapped population).',`<div class="tablewrap"><table>
       <thead><tr><th>Measure</th><th>Original</th><th>Allocated</th><th>Variance</th></tr></thead><tbody>${reconRows}</tbody></table></div>`)}
     ${card('Allocation counters','',`<div class="tablewrap"><table><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
       <tr><td>Dist. rows in → out (after chain split)</td><td>${num(al.dist_rows_in)} → ${num(al.dist_rows_out)}</td></tr>
       <tr><td>Chains allocated to</td><td>${num(al.chains_allocated_to)}</td></tr>
       <tr><td>Rows allocated via nearest-month split (QC-tagged)</td><td>${num(al.rows_nearest||0)} (${crc(al.nearest_nsv||0)})</td></tr>
       <tr><td>Rows with no cont-sheet data at all ("Unmapped Chain")</td><td>${num(al.rows_unmapped)} (${crc(al.unmapped_nsv)})</td></tr>
       <tr><td>Pending cont-sheet patch proposals for sign-off</td><td>${num(al.patch_rows||0)} rows → <code>${al.patch_file||''}</code></td></tr>
       <tr><td>Rows missing Avg Tot / TOT%</td><td>${num(al.missing_avg_tot_rows)}</td></tr>
       <tr><td>Cont% keys not summing to 100 (pre-normalisation)</td><td>${num(contBad)}</td></tr>
       <tr><td>Rows where Chain = Ship To Name (source issue, Direct rows)</td><td>${num(al.rows_chain_equals_shipto)}</td></tr>
       </tbody></table></div>`)}
   </div>
   <div class="grid g2">
     ${card('Cross-check by Month','Original vs allocated per month.',`<div class="tablewrap"><table>
       <thead><tr><th>Month</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Orig Qty</th><th>Alloc Qty</th><th>Var</th></tr></thead>
       <tbody>${monthRows}</tbody></table></div>`)}
     ${card('Cross-check by Brand','Original vs allocated per brand.',`<div class="tablewrap"><table>
       <thead><tr><th>Brand</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Orig MRP Sales</th><th>Alloc MRP Sales</th><th>Var</th></tr></thead>
       <tbody>${brandRows}</tbody></table></div>`)}
   </div>
   ${card('Missing mapping QC — Dist. rows with no cont-sheet entry','These keep their value under "Unmapped Chain". Add the missing Ship-To × Brand × Month rows to Dist_primary_cont_based_on_secondary_MOM.xlsx and rebuild to allocate them.',`<div class="tablewrap"><table>
     <thead><tr><th>Month</th><th>Brand</th><th>Cust-SAP Code</th><th>Ship To Name</th><th>NSV</th><th>Rows</th></tr></thead>
     <tbody>${missRows||'<tr><td colspan="6">None — every Dist. row mapped.</td></tr>'}</tbody></table></div>`)}
   ${card(`Allocation QC — Month × Brand × Cust-SAP Code × Ship To (top 25 of ${num(al.qc_table_total_rows)})`,
     'Unmapped keys sort first, then by |NSV|.',`<button class="fbtn ghost" id="alExpQc" style="margin:0 0 8px">⭳ Export ALL QC rows (Excel)</button><div class="tablewrap"><table>
     <thead><tr><th>Month</th><th>Brand</th><th>Cust-SAP Code</th><th>Ship To Name</th><th>Orig NSV</th><th>Alloc NSV</th><th>Var</th><th>Mapping</th></tr></thead>
     <tbody>${qcSlice}</tbody></table></div>`)}
   ${card(`Customer × Article × Month × Chain allocation (top 40 shown; ${num(ca.rows.length)} exportable of ${num(ca.rows_total)} total, ${ca.value_coverage_pct}% of |NSV|)`,
     ca.note+' Click a chain to drill.',`<button class="fbtn ghost" id="alExpCa" style="margin:0 0 8px">⭳ Export ALL Customer × Article rows (Excel)</button><div class="tablewrap"><table>
     <thead><tr><th>Cust-SAP</th><th>Ship To</th><th>Article</th><th>Brand</th><th>Range</th><th>Pack</th><th>Month</th><th>Chain</th><th>NSV</th><th>Qty</th><th>W.Avg Tot</th></tr></thead>
     <tbody>${caSlice}</tbody></table></div>`)}
   </div></details>`;
}
function wireAllocExports(root){
  const al=D.alloc;
  if(!al) return;
  const qb=root.querySelector('#alExpQc');
  if(qb) qb.onclick=()=>{
    const rows=[['Month','FY','Brand','Cust-SAP Code','Ship To Name','Original NSV','Allocated NSV','Variance',
                 'Original Qty','Allocated Qty','Qty Variance','Original MRP Sales','Allocated MRP Sales','MRP Variance',
                 'Original Tax','Allocated Tax','Tax Variance','Mapping Status'],
      ...al.qc_table.map(r=>[r.month,r.fy,r.brand,r.cust_code,r.ship_to,r.orig_nsv,r.alloc_nsv,r.nsv_var,
        r.orig_qty,r.alloc_qty,r.qty_var,r.orig_mrp,r.alloc_mrp,r.mrp_var,r.orig_tax,r.alloc_tax,r.tax_var,r.mapping_status])];
    downloadRowsXLSX(rows,exportFilename('Primary','Dist_Allocation_QC'),'Dist primary allocation QC (values in INR Lakh)');
  };
  const cb=root.querySelector('#alExpCa');
  if(cb) cb.onclick=()=>{
    const rows=[['Cust-SAP Code','Ship To Name','EAN No.','Article','Article MRP','Brand','Category','Sub-category','Range','Pack Size',
                 'Month','FY','Chain','NSV (Lakh)','Total MRP sales (Lakh)','Inv Qty','Tax (Lakh)','Weighted Avg Tot %'],
      ...al.cust_article.rows.map(r=>[r.cust_code,r.ship_to,r.ean,r.article,r.art_mrp,r.brand,r.category,r.sub_category,
        r.range,r.pack,r.month,r.fy,r.chain,r.nsv,r.mrp_sales,r.qty,r.tax,r.w_avg_tot])];
    downloadRowsXLSX(rows,exportFilename('Primary','CustXArticle_Allocation'),'Customer x Article x Month x Chain allocation (values in INR Lakh)');
  };
}

/* ---------------- OFFTAKE ---------------- */
function buildOfftake(){
  const o=D.offtake,p=D.primary,s=document.getElementById('tab-offtake');
  const fy=fyKey();                       // null = both years, else 'fy25'/'fy26'/'fy27'...
  // Offtake has its OWN FY coverage, independent of fyUnsupported() (which
  // is about the article-wise primary's fyx_primary-only tags) -- gate on
  // whether the Offtake master itself has this FY (total_fyNN present),
  // so real FY27+ offtake actuals render the moment their source is loaded,
  // instead of always showing the "no data" state for any beyond-window FY.
  if(fy && o['total_'+fy]==null){
    s.innerHTML=`<h2 class="sec">Offtake (Sell-out)</h2>${fyNoDataNote('the Offtake master file')}${catDrillCardHtml('ofCatDrill')}`;
    renderCatDrillChart('ofCatDrill',recFilter());
    return;
  }
  const yrs=fy?[fy]:['fy25','fy26'];
  const yrLab={fy25:'FY25',fy26:'FY26'};
  if(fy && !yrLab[fy]) yrLab[fy]=fy.toUpperCase();   // backfill FY27+ label
  let zones=o.by_zone, states=o.by_state, chains=consolidateChains(o.by_chain);
  if(fOn('Zone')){ zones=zones.filter(z=>fHas('Zone',z.name)); states=states.filter(r=>fHas('Zone',r.zone)); }
  if(fOn('Chain')){ chains=chains.filter(c=>fHas('Chain',c.name)); }
  const mAbbr=m=>String(m).slice(0,3).toLowerCase();
  // o.months are "Apr-24".."Mar-26" (3-letter abbrev + 2-digit year); F.Month
  // is a full month name ("April".."March") from the article-level detail --
  // match on the first 3 letters. When a single FY is selected, use the
  // Python-computed months_fyNN/monthly_fyNN series (correct for ANY FY tag)
  // instead of re-deriving FY membership from a calendar-year suffix.
  let months, monthly;
  if(fy){ months=o['months_'+fy]||[]; monthly=o['monthly_'+fy]||[]; }
  else { months=o.months; monthly=o.monthly; }
  if(fOn('Month')){
    const keep=months.map((m,i)=>i).filter(i=>F.Month.some(mm=>mAbbr(months[i])===mAbbr(mm)));
    months=keep.map(i=>months[i]); monthly=keep.map(i=>monthly[i]);
  }
  const totFor=k=>o['total_'+k]||0;
  const _fyTag=fy?fy.toUpperCase().replace('FY','FY'):'';
  const _fpx=_fyTag&&FYX[_fyTag];
  const primFor=k=>{
    const v=p['nsv_'+k]; if(v) return v;
    const tag=k.toUpperCase().replace('FY','FY'), fx=FYX[tag];
    return fx?fx.nsv:0;
  };
  const cmp=chains.filter(c=>(c[yrs[yrs.length-1]]||0)>50 || fOn('Chain')).slice(0,10);
  const pc={};
  if(_fpx){consolidateChains(_fpx.by_chain).forEach(c=>{pc[c.name]=c.nsv;});}
  else{p.by_chain.forEach(c=>pc[c.name]=c[yrs[yrs.length-1]]);}
  const strows=states.map(r=>{
    if(fy){ return `<tr><td>${r.state}</td><td>${drillLink('Zone',r.zone)}</td><td>${crc(r[fy])}</td></tr>`; }
    const prev=yrs.length>=2?yrs[yrs.length-2]:null, cur=yrs[yrs.length-1];
    const pv=prev!=null?r[prev]:null, cv2=r[cur];
    const yoyV=pv?((cv2-pv)/pv)*100:null;
    return `<tr><td>${r.state}</td><td>${drillLink('Zone',r.zone)}</td>${prev!=null?`<td>${crc(pv)}</td>`:''}
     <td>${crc(cv2)}</td><td><span class="pill ${yoyV!=null&&yoyV>=0?'g':'r'}">${yoyV!=null?pct(yoyV):'–'}</span></td></tr>`;
  }).join('');
  const dimNote=dimUnsupportedNote(['Brand','Channel','Category','SubCategory','Range','PackSize','Article'],'the Offtake source (chain/zone/month only, no brand or product-level breakdown)');
  s.innerHTML=`<h2 class="sec">Offtake (Sell-out)</h2>
   <p class="lead">Consumer offtake from MT stores. ${fy?`${yrLab[fy]} only (filtered).`:'FY24-25 vs FY25-26, ₹ Crore.'}</p>
   ${dimNote}
   <div class="kpis">
     ${fy? kpi(`Offtake ${yrLab[fy]}`,crc(totFor(fy)),fOn('Zone')||fOn('Chain')?'filtered scope':'') :
       kpi('Offtake FY26',crc(o.total_fy26),`<span class="${cls(o.yoy)}">${arrow(o.yoy)} ${pct(o.yoy)}</span> YoY`)}
     ${!fy? kpi('Offtake FY25',crc(o.total_fy25),'base year') :
       kpi('Chains Tracked',chains.length,fOn('Zone')||fOn('Chain')?'in this filter':'in offtake master')}
     ${fy? kpi('Chains Tracked',chains.length,fOn('Zone')||fOn('Chain')?'in this filter':'in offtake master') :
       kpi('Chains Tracked',o.n_chains,'in offtake master')}
     ${kpi('Sell-through',primFor(yrs[yrs.length-1])?((totFor(yrs[yrs.length-1])/primFor(yrs[yrs.length-1]))*100).toFixed(0)+'%':'–',`offtake ÷ primary ${yrLab[yrs[yrs.length-1]]}`)}
   </div>
   <div class="grid g2">
     ${card('Monthly offtake trend',`${months.length} month(s)${fOn('Month')?` — filtered to ${fLab('Month')}`:''}.`,cv('ofTrend'))}
     ${card('Offtake by zone'+(fy?` (${yrLab[fy]})`:' (YoY)'),'click to drill',cv('ofZone'))}
   </div>
   ${card(`Primary vs Offtake by chain (${yrLab[yrs[yrs.length-1]]}) — inventory health`,'Bars above the line = billing ahead of sell-out (stock build); below = sell-out ahead (refill). Click a chain to drill.',cv('ofCmp'))}
   ${card('State-wise offtake'+(fy?` (${yrLab[fy]})`:' YoY'),fy?`Filtered to ${yrLab[fy]}. Click a zone to drill.`:'Click a zone to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>State</th><th>Zone</th>${fy?`<th>${yrLab[fy]}</th>`:(yrs.length>=2?`<th>${yrLab[yrs[yrs.length-2]]}</th><th>${yrLab[yrs[yrs.length-1]]}</th><th>YoY</th>`:`<th>${yrLab[yrs[0]]}</th><th>YoY</th>`)}</tr></thead><tbody>${strows||`<tr><td colspan="${fy?3:yrs.length+3}">No states for this filter.</td></tr>`}</tbody></table></div>`)}
   ${catDrillCardHtml('ofCatDrill')}`;
  wireDrillLinks(s);
  mkLine('ofTrend',months,[{label:'Offtake',data:monthly,borderColor:C.amber,backgroundColor:C.amber+'22',fill:true}]);
  if(fy){
    mkBarH('ofZone',zones.map(z=>z.name),zones.map(z=>z[fy]),C.amber,true,v=>drillTo('Zone',v));
  } else {
    mkBar('ofZone',zones.map(z=>z.name),[
      {label:'FY25',data:zones.map(z=>z.fy25),backgroundColor:C.blue+'cc',borderRadius:4},
      {label:'FY26',data:zones.map(z=>z.fy26),backgroundColor:C.amber,borderRadius:4}],{},v=>drillTo('Zone',v));
  }
  mkBar('ofCmp',cmp.map(c=>c.name),[
    {label:'Primary (sell-in)',data:cmp.map(c=>pc[c.name]||0),backgroundColor:C.teal,borderRadius:4},
    {label:'Offtake (sell-out)',data:cmp.map(c=>c[yrs[yrs.length-1]]||0),backgroundColor:C.amber,borderRadius:4}],{},v=>drillTo('Chain',v));
  renderCatDrillChart('ofCatDrill',recFilter());
}

/* ---------------- Reliance Brand Counter ---------------- */
function buildRelianceBC(){
  const bc=D.reliance_bc, s=document.getElementById('tab-reliance-bc');
  if(!bc){s.innerHTML='<h2 class="sec">Reliance Brand Counter</h2><p class="lead">No Brand Counter data available.</p>';return;}
  const fy=fyKey();
  const yrLab={fy25:'FY25',fy26:'FY26'};
  FY_ALL.forEach(t=>{ const k='fy'+t.slice(2); if(!yrLab[k]) yrLab[k]=t; });
  const fyTags=bc.fy_tags||[];
  if(fy && !fyTags.includes(fy)){
    s.innerHTML=`<h2 class="sec">Reliance Brand Counter</h2><p class="lead">No Brand Counter data for ${yrLab[fy]||fy.toUpperCase()}.</p>`;return;
  }
  const fyk=fy||fyTags[fyTags.length-1]||'fy27';
  const months=bc['months_'+fyk]||bc.months||[];
  const monthly=bc['monthly_'+fyk]||bc.monthly||[];
  const total=bc['total_'+fyk]||bc.total||0;
  let zones=bc.by_zone||[];
  let states=bc.by_state||[];
  let brands=bc.by_brand||[];
  let cats=bc.by_category||[];
  if(fOn('Zone')){
    zones=zones.filter(z=>fHas('Zone',z.name));
    states=states.filter(r=>fHas('Zone',r.zone));
  }
  const zoneVal=z=>(z[fyk]||z.total||0);
  const stateVal=r=>(r[fyk]||r.total||0);
  const brandVal=b=>(b[fyk]||b.total||0);
  const stRows=states.filter(r=>stateVal(r)>0).map(r=>
    `<tr><td>${r.state}</td><td>${r.zone}</td><td>${crc(stateVal(r))}</td></tr>`).join('');
  const brandRows=brands.filter(b=>brandVal(b)>0).map(b=>
    `<tr><td>${b.name}</td><td>${crc(brandVal(b))}</td><td>${total>0?((brandVal(b)/total)*100).toFixed(1)+'%':'–'}</td></tr>`).join('');
  const catRows=cats.filter(c=>(c.total||0)>0).map(c=>
    `<tr><td>${c.name}</td><td>${crc(c.total)}</td><td>${total>0?((c.total/total)*100).toFixed(1)+'%':'–'}</td></tr>`).join('');
  s.innerHTML=`<h2 class="sec">Reliance Brand Counter — Analytical Breakout</h2>
   <p class="lead">Brand Counter sell-out from Reliance stores. ${fy?yrLab[fy]+' only.':'₹ Lakh.'}</p>
   <div class="note" style="background:var(--card);border-left:4px solid var(--amber);padding:.75rem 1rem;margin-bottom:1rem;border-radius:6px;font-size:.85rem;">
     <strong>Note:</strong> ${bc.note||'Brand Counter data is a separate analytical breakout.'}
   </div>
   <div class="kpis">
     ${kpi('BC Offtake',crc(total),yrLab[fyk]||fyk)}
     ${kpi('Months Covered',months.length,months.length?months[0]+' – '+months[months.length-1]:'none')}
     ${kpi('Zones',zones.length,'with BC presence')}
     ${kpi('Brands',brands.length,'tracked in BC')}
   </div>
   <div class="grid g2">
     ${card('Monthly BC offtake trend',months.length+' month(s).',cv('bcTrend'))}
     ${card('BC offtake by zone'+(fy?' ('+yrLab[fy]+')':''),'Reliance zones with Brand Counter presence.',cv('bcZone'))}
   </div>
   <div class="grid g2">
     ${card('BC offtake by brand','Share of Brand Counter sell-out by brand.',
       `<div class="tablewrap"><table><thead><tr><th>Brand</th><th>₹ L</th><th>Share</th></tr></thead>
        <tbody>${brandRows||'<tr><td colspan="3">No brand data.</td></tr>'}</tbody></table></div>`)}
     ${card('BC offtake by category','Product category split.',
       `<div class="tablewrap"><table><thead><tr><th>Category</th><th>₹ L</th><th>Share</th></tr></thead>
        <tbody>${catRows||'<tr><td colspan="3">No category data.</td></tr>'}</tbody></table></div>`)}
   </div>
   ${card('State-wise BC offtake','Reliance Brand Counter sell-out by state.',
     `<div class="tablewrap"><table><thead><tr><th>State</th><th>Zone</th><th>₹ L</th></tr></thead>
      <tbody>${stRows||'<tr><td colspan="3">No state data.</td></tr>'}</tbody></table></div>`)}
   <div style="margin-top:1rem;font-size:.8rem;color:var(--muted);">
     <em>Classification: is_brand_counter=${bc.is_brand_counter}, include_in_overall_offtake=${bc.include_in_overall_offtake}, parent_chain="${bc.parent_chain||'Reliance Retail'}"</em>
   </div>`;
  mkLine('bcTrend',months,[{label:'BC Offtake',data:monthly,borderColor:C.amber,backgroundColor:C.amber+'22',fill:true}]);
  mkBarH('bcZone',zones.map(z=>z.name),zones.map(z=>zoneVal(z)),C.amber);
}

/* ---------------- P&L ---------------- */
function buildPnl(){
  const pl=D.pnl,s=document.getElementById('tab-pnl');
  // The gross-to-net bridge is FY26-only (its source ends Mar'26), but the
  // TOT% and CM2 sections below run on the article-level detail which spans
  // FY26-27 -- so when the FY filter excludes FY26, swap ONLY the bridge for
  // an honest note and keep TOT%/CM2 visible instead of blanking the tab.
  const fy26ok=!(fOn('FY') && !fHas('FY','FY26'));
  let chains=pl.by_chain;
  if(fOn('Chain')) chains=chains.filter(c=>fHas('Chain',c.name));
  const top=chains.filter(c=>c.nsv>50 || fOn('Chain')).slice(0,12);
  const rows=chains.filter(c=>c.nsv>0).map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.mrp)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.discount)}</td><td>${c.discount_pct==null?'–':c.discount_pct+'%'}</td>
     <td>${c.promos||0}</td><td>${c.promo_depth==null?'–':c.promo_depth+'%'}</td></tr>`).join('');
  const totMrp=chains.reduce((a,c)=>a+(c.mrp||0),0), totNsv=chains.reduce((a,c)=>a+(c.nsv||0),0);
  const dimNote=dimUnsupportedNote(['Zone','Brand','Channel','Category','SubCategory','Range','PackSize','Article'],'the P&L source (chain-level only)');
  // TOT% (Trade Offer Terms % / On-Invoice Margin Pass-on %) — independent
  // article-level source (File 2), spans FY26-FY27; not gated by the FY26-only
  // guard above since its own data genuinely extends past FY26.
  const totD=D.tot;
  let totChains=totD?consolidateChains(totD.by_chain,'nsv'):[];
  if(fOn('Chain')) totChains=totChains.filter(c=>fHas('Chain',c.name));
  const totTop=totChains.slice(0,12);
  const totRows=totChains.map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.mrp)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.tax)}</td><td>${c.tot_pct==null?'–':c.tot_pct+'%'}</td><td>${crc(c.passon_value)}</td></tr>`).join('');
  const qcRows=(totD&&totD.qc_table||[]).map(r=>{
    const fa=r.finance_approved||'Pending';
    const faCls=fa.toLowerCase()==='yes'?'up':(fa.toLowerCase()==='no'?'down':'');
    const impact=r.impact_on_tot_pp!=null&&r.impact_on_tot_pp!==''?r.impact_on_tot_pp+' pp':'–';
    return `<tr><td>${r.category}</td><td>${r.hsn_code||'TBD'}</td><td>${r.pre_rate_pct}%</td><td>${r.post_rate_pct}%</td>
     <td>${r.effective_from||'(uses default)'}</td><td>${r.confidence}</td><td class="${faCls}">${fa}</td><td>${impact}</td></tr>`;
  }).join('');
  const mq=(totD&&totD.method_qc)||{};
  // dynamic banner: green/confirmed when the GST rate table wasn't actually
  // needed (fallback ~0% of MRP -- TOT% is real source data, not an
  // assumption), amber/provisional scoped to just the fallback slice otherwise.
  const fbPct=mq.fallback_pct_of_mrp;
  const totBanner=!totD?'':(fbPct==null||fbPct<0.05)
    ?`<div class="repbanner" style="background:#e8f5ec;border-color:#b7e0c4;color:#1c6b3a"><b>TOT% sourced from actual Primary file data</b> —
        Avg Tot / Inv. Tax Amount(LOC) covered every row; the GST rate table fallback was not needed
        ${fbPct==null?'':`(${fbPct}% of MRP)`}.</div>`
    :`<div class="repbanner"><b>Partially provisional.</b> ${fbPct}% of MRP (${num(mq.rows_gst_fallback)} rows) relies on the
        GST rate table fallback, pending Finance/Tax sign-off (${totD.finance_approved_count} of
        ${totD.finance_approved_total} categories confirmed). The remaining ${(100-fbPct).toFixed(1)}% uses actual
        source data (Avg Tot / Inv. Tax Amount).</div>`;
  // CM2 (Contribution Margin 2) = NSV - P&L Expenses. Expenses are never
  // hardcoded -- they come entirely from PowerBI/SeedData/Masters/
  // PL_Expense_Input.csv (see cm2_block in build_dashboard_data.py).
  const cm2D=D.cm2;
  let cm2Chains=cm2D?consolidateChains(cm2D.by_chain,'nsv'):[];
  if(fOn('Chain')) cm2Chains=cm2Chains.filter(c=>fHas('Chain',c.name));
  const cm2Top=cm2Chains.slice(0,12);
  const cm2Rows=cm2Chains.map(c=>`<tr><td>${drillLink('Chain',c.name)}</td><td>${crc(c.nsv)}</td>
     <td>${crc(c.expense)}</td><td>${crc(c.cm2_value)}</td><td>${c.cm2_pct==null?'–':c.cm2_pct+'%'}</td></tr>`).join('');
  const cm2HeadRows=(cm2D&&cm2D.by_expense_head||[]).map(h=>`<tr><td>${h.name}</td><td>${crc(h.amount)}</td></tr>`).join('');
  const cm2Monthly=(cm2D&&cm2D.monthly||[]);
  const cm2Latest=cm2Monthly.length?cm2Monthly[cm2Monthly.length-1]:null;
  const cm2Qc=(cm2D&&cm2D.qc)||{};
  const cm2NoData=!cm2D||!cm2D.has_expense_data;
  s.innerHTML=`<h2 class="sec">P&amp;L — Chain-wise Gross-to-Net &amp; Trade Spend</h2>
   ${fy26ok?`<p class="lead">FY25-26. Bridge from gross MRP value to net NSV, plus promo intensity per chain.
     <b>Note:</b> COGS is not in source data, so this is a gross-to-net trade contribution view (retail margin + taxes + trade terms), not a full statutory P&amp;L.</p>
   ${dimNote}
   <div class="kpis">
     ${kpi('Gross MRP Value',crc(totMrp),fOn('Chain')?'filtered scope':'FY26, all chains')}
     ${kpi('Net NSV',crc(totNsv),'realised revenue')}
     ${kpi('MRP→NSV Gap',crc(totMrp-totNsv),totMrp?`${((totMrp-totNsv)/totMrp*100).toFixed(1)}% blended`:'')}
     ${kpi('Promo Lines',D.promo.n_promos,`${D.promo.avg_depth}% avg consumer depth`)}
   </div>
   <div class="grid g2">
     ${card('Gross-to-net by chain (FY26)','Net NSV vs the MRP→NSV gap (margin + taxes + trade). Click a chain to drill.',cv('plBridge'))}
     ${card('Trade-discount intensity (%) by chain','Higher = deeper gross-to-net gap — review spend ROI. Click to drill.',cv('plDisc'))}
   </div>
   ${card('Chain-wise trade P&amp;L','MRP value, net NSV, the gap, and promo activity per chain (FY26). Click a chain to drill.',`<div class="tablewrap"><table>
     <thead><tr><th>Chain</th><th>MRP</th><th>NSV</th><th>Gap</th><th>Gap %</th><th>Promos</th><th>Avg depth</th></tr></thead>
     <tbody>${rows||'<tr><td colspan="7">No chains for this filter.</td></tr>'}</tbody></table></div>`)}`
   :`<div class="fynote"><b>${fLab('FY')} actuals not available</b> — the gross-to-net P&amp;L bridge (source ends Mar-26) —
      intentionally blank instead of a stale FY26 number. TOT% and CM2 below still cover FY26-27.</div>`}
   ${totD?`<h3 class="sec" style="font-size:15px;margin:20px 0 4px">Chain-wise TOT% (On-Invoice Margin Pass-on)</h3>
   <p class="note" style="margin:0 0 10px">FY26-FY27, article-level detail (File 2) — independent source from the FY26-only P&amp;L bridge above.
     TOT% = SUM(Pass-on Value) / SUM(MRP), sourced per row: Primary file's own <b>Avg Tot</b> first, actual
     <b>Inv. Tax Amount(LOC)</b> second, GST rate table only as a last-resort fallback. Blended TOT%
     ${totD.blended_tot_pct==null?'–':totD.blended_tot_pct+'%'} · total pass-on value ${crc(totD.total_passon_value)}.</p>
   ${totBanner}
   <div class="grid g2">
     ${card('TOT% by chain','Higher = more on-invoice margin passed to the chain. Click a chain to drill.',cv('totChart'))}
     ${card('Chain-wise TOT% detail','MRP, NSV, Tax and On-Invoice Margin Pass-on Value per chain.',`<div class="tablewrap"><table>
       <thead><tr><th>Chain</th><th>MRP</th><th>NSV</th><th>Tax</th><th>TOT%</th><th>Pass-on Value</th></tr></thead>
       <tbody>${totRows||'<tr><td colspan="6">No chains for this filter.</td></tr>'}</tbody></table></div>`)}
   </div>
   ${card('TOT% source QC summary','Row counts by source across the full FY26-FY27 article-level detail (not the row-capped browser export).',`<div class="tablewrap"><table>
     <thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
     <tr><td>Rows using Source TOT% (Avg Tot)</td><td>${num(mq.rows_avg_tot)}</td></tr>
     <tr><td>Rows calculated using Actual Tax Amount</td><td>${num(mq.rows_tax_calc)}</td></tr>
     <tr><td>Rows using GST Rate Table fallback</td><td>${num(mq.rows_gst_fallback)}</td></tr>
     <tr><td>Fallback % of total MRP</td><td>${mq.fallback_pct_of_mrp==null?'–':mq.fallback_pct_of_mrp+'%'}</td></tr>
     <tr><td>Blended TOT%</td><td>${totD.blended_tot_pct==null?'–':totD.blended_tot_pct+'%'}</td></tr>
     <tr><td>Rows blank/invalid (MRP, NSV, Avg Tot &amp; Inv. Tax Amount all unusable)</td><td>${num(mq.rows_invalid)}</td></tr>
     </tbody></table></div>`)}
   ${card('GST rate QC table — Category, HSN Code, Pre/Post GST%, Effective From, Confidence, Finance Approved, Impact on TOT%',
     'Fallback-only: this table drives TOT% ONLY for rows where both Avg Tot and Inv. Tax Amount(LOC) are blank/invalid (see the QC summary above for how many that is). Impact on TOT% = how much blended TOT% would move (pp) if that category\'s Post-GST% were flipped to the alternate slab, scoped to that category\'s own fallback-tier rows only — use it to prioritise which LOW-confidence rows to validate first. Edit PowerBI/SeedData/Masters/GST_Rate_QC_Table.csv (Finance sign-off) and PowerBI/SeedData/Masters/GST_Config.csv (cutover date override) then re-run --detail-only to update this table dashboard-wide.',
     `<div class="tablewrap"><table><thead><tr><th>Category</th><th>HSN Code</th><th>Pre-GST%</th><th>Post-GST%</th>
       <th>Effective From</th><th>Confidence</th><th>Finance Approved</th><th>Impact on TOT%</th></tr></thead>
       <tbody>${qcRows||'<tr><td colspan="8">No QC table found.</td></tr>'}</tbody></table></div>`)}
   <details class="methodbox"><summary>Methodology &amp; assumptions</summary>
     <p class="note" style="margin:0 0 10px">${totD.methodology}
     Default GST cutover date: ${totD.gst_cutover_default} (editable — <code>PowerBI/SeedData/Masters/GST_Config.csv</code>).
     QC table: <code>PowerBI/SeedData/Masters/GST_Rate_QC_Table.csv</code> (editable — several categories are LOW-confidence
     best-effort assumptions pending Finance/Tax confirmation; see that file's Confidence/Note/Finance_Approved columns).</p></details>`:''}
   ${cm2D?`<h3 class="sec" style="font-size:15px;margin:20px 0 4px">P&amp;L / CM2 (Contribution Margin 2)</h3>
   <p class="note" style="margin:0 0 10px">CM2 = NSV − P&amp;L Expenses (NSV is already net of TOT%/tax — see the TOT% section above).
     Expenses are never hardcoded — maintained month-on-month in <code>PowerBI/SeedData/Masters/PL_Expense_Input.csv</code> and
     matched to this same article-level data (Customer Code first, Chain fallback). Edit that file and re-run
     <code>--detail-only</code> to refresh CM2 dashboard-wide (and in Power BI — <code>DAX/13_CM2_Measures.dax</code> reads the same file).</p>
   ${cm2NoData?`<div class="repbanner"><b>No expense data loaded yet.</b> CM2 currently equals NSV (0 expenses matched).
        Populate PL_Expense_Input.csv with real monthly P&amp;L expenses to see actual CM2.</div>`:''}
   <div class="kpis">
     ${kpi('NSV (TOT%-scope)',crc(cm2D.total_nsv),'FY26-FY27, same population as TOT%')}
     ${kpi('TOT Value',totD?crc(totD.total_passon_value):'–',totD&&totD.blended_tot_pct!=null?totD.blended_tot_pct+'% of MRP':'')}
     ${kpi('Total P&L Expense',crc(cm2D.total_expense),cm2D.expense_pct_of_nsv!=null?cm2D.expense_pct_of_nsv+'% of NSV':'')}
     ${kpi('CM2 Value',crc(cm2D.cm2_value),cm2D.cm2_pct!=null?cm2D.cm2_pct+'% of NSV':'')}
     ${kpi('MoM CM2 Movement',cm2Latest&&cm2Latest.mom_cm2_change!=null?crc(cm2Latest.mom_cm2_change):'–',cm2Latest?`${cm2Latest.month} ${cm2Latest.fy}`:'')}
   </div>
   <div class="grid g2">
     ${card('Chain-wise CM2','NSV, matched P&L expense and resulting CM2 per chain. Click a chain to drill.',cv('cm2Chart'))}
     ${card('Chain-wise CM2 detail','',`<div class="tablewrap"><table>
       <thead><tr><th>Chain</th><th>NSV</th><th>Expense</th><th>CM2 Value</th><th>CM2%</th></tr></thead>
       <tbody>${cm2Rows||'<tr><td colspan="5">No chains for this filter.</td></tr>'}</tbody></table></div>`)}
   </div>
   ${card('Expense Head-wise contribution','Sum of matched P&L expense by Expense Head (across all chains/months loaded).',`<div class="tablewrap"><table>
     <thead><tr><th>Expense Head</th><th>Amount</th></tr></thead>
     <tbody>${cm2HeadRows||'<tr><td colspan="2">No expenses loaded.</td></tr>'}</tbody></table></div>`)}
   ${card('P&amp;L Expense QC summary','Data-quality check on PL_Expense_Input.csv as loaded.',`<div class="tablewrap"><table>
     <thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
     <tr><td>Total Expense Amount loaded</td><td>${crc(cm2Qc.total_expense||0)}</td></tr>
     <tr><td>Expense mapped to Primary/Offtake</td><td>${crc(cm2Qc.mapped_expense||0)} (${cm2Qc.mapped_pct_of_total==null?'–':cm2Qc.mapped_pct_of_total+'%'})</td></tr>
     <tr><td>Unmapped Expense Amount</td><td>${crc(cm2Qc.unmapped_expense||0)}</td></tr>
     <tr><td>Unmapped Chain/Customer (rows)</td><td>${num(cm2Qc.unmapped_chain_customer||0)}</td></tr>
     <tr><td>Unmapped Brand/Category (rows)</td><td>${num(cm2Qc.unmapped_brand_category||0)}</td></tr>
     <tr><td>Blank Month (rows)</td><td>${num(cm2Qc.blank_month||0)}</td></tr>
     <tr><td>Blank Expense Head (rows)</td><td>${num(cm2Qc.blank_expense_head||0)}</td></tr>
     <tr><td>Duplicate expense rows</td><td>${num(cm2Qc.duplicate_rows||0)}</td></tr>
     </tbody></table></div>`)}`:''}
   ${catDrillCardHtml('plCatDrill')}`;
  wireDrillLinks(s);
  if(fy26ok){
    mkBar('plBridge',top.map(c=>c.name),[
      {label:'Net NSV',data:top.map(c=>c.nsv),backgroundColor:C.teal,borderRadius:4,stack:'s'},
      {label:'MRP→NSV gap',data:top.map(c=>c.discount),backgroundColor:C.sand,borderRadius:4,stack:'s'}],
      {cfg:{scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:'#eee'},ticks:{callback:v=>crc(v)}}}}},
      v=>drillTo('Chain',v));
    mkBarH('plDisc',top.map(c=>c.name),top.map(c=>c.discount_pct),C.red,false,v=>drillTo('Chain',v));
    // override tick formatting for percent chart
    const ch=charts[charts.length-1];ch.options.scales.x.ticks.callback=v=>v+'%';
    ch.options.plugins.tooltip.callbacks.label=c=>c.parsed.x+'%';ch.update();
  }
  if(totD){
    mkBarH('totChart',totTop.map(c=>c.name),totTop.map(c=>c.tot_pct),C.teal,false,v=>drillTo('Chain',v));
    const tch=charts[charts.length-1];tch.options.scales.x.ticks.callback=v=>v+'%';
    tch.options.plugins.tooltip.callbacks.label=c=>c.parsed.x+'%';tch.update();
  }

function distFmtFootprintRows(dg){
  // Aggregate avg penetration per format from SKU-level dist_gap rows
  const fmt={};
  (dg.rows||[]).forEach(r=>{
    if(!r.group) return;
    if(!fmt[r.group]) fmt[r.group]={grp:r.group,target:r.target,sumPen:0,n:0,totCarry:0,totMiss:0};
    const f=fmt[r.group];
    f.sumPen+=r.penetration||0; f.n++;
    f.totCarry+=(r.carrying||0); f.totMiss+=(r.missing||0);
  });
  const rows=Object.values(fmt).sort((a,b)=>b.target-a.target);
  const body=rows.map(f=>{
    const avgPen=(f.sumPen/f.n).toFixed(1);
    const gap=(100-f.sumPen/f.n).toFixed(1);
    return `<tr><td>${f.grp}</td><td>${num(f.target)}</td><td>${avgPen}%</td><td>${gap}%</td></tr>`;
  }).join('');
  return `<div class="tablewrap"><table>
    <thead><tr><th>Format</th><th>Universe Stores</th><th>Avg Numeric Distribution</th><th>Gap%</th></tr></thead>
    <tbody>${body||'<tr><td colspan="4">No data.</td></tr>'}</tbody></table></div>`;
}
// Distribution Gap & Add-on Revenue Potential -- reads the D.dist_gap block
// (real store×article offtake, chain-format-comparable). Respects the global
// Category/Brand filters (reuses fOn/fHas); other dims (FY/Month/Zone/Chain)
// don't apply here since the gap is measured across a product's whole
// comparable-format store base, not a single chain/month.
function distGapRows(){
  const dg=D.dist_gap; if(!dg||!dg.rows) return [];
  let rows=dg.rows;
  if(fOn('Category')) rows=rows.filter(r=>fHas('Category',r.category));
  if(fOn('Brand'))    rows=rows.filter(r=>fHas('Brand',r.brand));
  return rows;
}
function distGapHtml(){
  const dg=D.dist_gap;
  if(!dg||!dg.rows||!dg.rows.length) return '';
  const W=dg.window_label||'window';
  const rows=distGapRows();
  const totAddon=rows.reduce((a,r)=>a+(r.addon_window||0),0);
  const totAddonAnn=rows.reduce((a,r)=>a+(r.addon_ann||0),0);
  const avgPen=rows.length?rows.reduce((a,r)=>a+(r.penetration||0),0)/rows.length:0;
  const top=rows.slice(0,25);
  const body=top.map(r=>`<tr>
     <td>${drillLink('Brand',r.brand)} · ${r.product}</td><td>${r.ean}</td><td>${r.group}</td>
     <td>${num(r.carrying)} / ${num(r.target)}</td><td>${num(r.missing)}</td>
     <td>${r.penetration}%</td><td>${crc(r.nsv_avg_ann)}/yr</td><td>${crc(r.nsv_window)}</td>
     <td>${num(r.latest_tp)}</td><td>${num(r.max_tp)}</td><td><b>${crc(r.addon_window)}</b></td></tr>`).join('');
  return `<h3 class="sec" style="font-size:15px;margin:22px 0 4px">Distribution Gap &amp; Add-on Revenue Potential</h3>
   <p class="note" style="margin:0 0 10px">Each product is compared ONLY against <b>comparable stores</b> — sites of its own
     chain <b>format</b> (Pharmacy / Hypermarket / Supermarket / Beauty Retail…), so a drug-store SKU is measured against
     drug-store doors, never against Dmart. <b>Target</b> = format-sites selling that product's category; <b>Carrying</b> =
     format-sites selling this SKU; <b>Add-on</b> = missing sites × NSV per carrying site. Real store×article offtake, window
     <b>${W}</b>${fOn('Category')||fOn('Brand')?' · filtered':''}. ${dg.n_months<3?'<i>Only '+dg.n_months+' months of store-level data loaded — refreshes to a true L3M once a third month is added.</i>':''}</p>
   <div class="kpis">
     ${kpi('Add-on Potential ('+W+')',crc(totAddon),'if gaps closed at current per-store rate')}
     ${kpi('Add-on Potential (annualised)',crc(totAddonAnn),'monthly avg × 12')}
     ${kpi('Products with Gap',num(rows.length),fOn('Category')||fOn('Brand')?'in this filter':'across comparable formats')}
     ${kpi('Avg Penetration',avgPen.toFixed(1)+'%',rows.length+' SKUs')}
   </div>
   <div class="grid g2">
     ${card('Add-on potential by store format ('+W+')','Where the biggest closable distribution gaps sit.',cv('dgGroup'))}
     ${card('Top 25 SKUs by add-on potential','Product · comparable format · carrying/target doors · penetration · add-on. Full list via ⭳ Export Table.',
       `<div class="tablewrap"><table>
       <thead><tr><th>Product</th><th>EAN</th><th>Group</th><th>Carrying / Target</th><th>Missing (${W})</th>
         <th>Penetration</th><th>NSV Avg</th><th>NSV ${W}</th><th>Latest TP</th><th>Max TP</th><th>Add-on (${W})</th></tr></thead>
       <tbody>${body||'<tr><td colspan="11">No products for this filter.</td></tr>'}</tbody></table></div>`)}
   </div>`;
}
function distGapChart(){
  const dg=D.dist_gap; if(!dg||!dg.rows||!dg.rows.length) return;
  // add-on by format, recomputed from the (filtered) rows so it tracks filters
  const rows=distGapRows(); const g={};
  rows.forEach(r=>{ g[r.group]=(g[r.group]||0)+(r.addon_window||0); });
  const ent=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  if(ent.length) mkBarH('dgGroup',ent.map(e=>e[0]),ent.map(e=>e[1]),C.amber,true);
}
